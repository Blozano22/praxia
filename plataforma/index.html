<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plataforma de recursos educativos</title>
<style>:root{--g:#0f4d3a;--g2:#0a3328;--gold:#c9a227;--bg:#f2f5f3;--ink:#14201b;--muted:#56665f;--line:#d6dfda;--tint:#e8eeec;--ok:#1f7a4d;--okbg:#e3f1e9;--bad:#a63a32;--badbg:#f7e6e4;--warn:#7a5a00;--warnbg:#f7f1dc}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5}
button{font:inherit}
.top{background:linear-gradient(180deg,var(--g2),var(--g));color:#fff;border-bottom:4px solid var(--gold);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .brand{font-weight:700;font-size:1.1rem;letter-spacing:.01em;cursor:pointer}
.top .brand small{display:block;font-weight:400;font-size:.75rem;opacity:.8}
.top .sp{flex:1}
.btn{cursor:pointer;border:2px solid var(--g);background:var(--g);color:#fff;border-radius:8px;padding:9px 18px;font-weight:600}
.btn:hover:not(:disabled){background:var(--g2);border-color:var(--g2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--g)}
.btn.sec:hover:not(:disabled){background:var(--tint)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1500}
.btn.danger{background:#fff;color:var(--bad);border-color:#d9a8a4}
.btn.sm{padding:5px 12px;font-size:.88rem}
.top .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.top .btn.sec:hover:not(:disabled){background:rgba(255,255,255,.14)}
.wrapx{max-width:1120px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:1.7rem;margin:.2rem 0 .3rem;color:var(--g2)}
h2{font-size:1.25rem;margin:1.4rem 0 .6rem;color:var(--g2)}
.lead{color:var(--muted);max-width:760px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(10,51,40,.08),0 6px 18px rgba(10,51,40,.06);padding:18px}
.pasos{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.pasos .p{flex:1 1 210px;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.pasos .p b{width:28px;height:28px;border-radius:6px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.drop{border:3px dashed #9fb3a9;border-radius:14px;background:#fff;padding:34px 20px;text-align:center;transition:.15s}
.drop.over{border-color:var(--g);background:var(--tint)}
.drop h2{margin:.2rem 0}
.drop p{margin:.3rem 0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
textarea,input[type=text],select{font:inherit;width:100%;padding:9px 11px;border:1.5px solid #b9c7c0;border-radius:8px;background:#fff;color:var(--ink)}
textarea:focus,input:focus,select:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px rgba(15,77,58,.18)}
textarea{resize:vertical;min-height:70px}
label.l{display:block;font-weight:600;margin:12px 0 4px}
.help{font-size:.85rem;color:var(--muted);margin:2px 0 0}
.msg{border-radius:10px;padding:12px 14px;margin:12px 0;border-left:5px solid}
.msg.ok{background:var(--okbg);border-color:var(--ok)}
.msg.bad{background:var(--badbg);border-color:var(--bad)}
.msg.warn{background:var(--warnbg);border-color:var(--gold);color:#4d3a00}
.msg.info{background:var(--tint);border-color:var(--g)}
.tipo{display:inline-block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--gold);color:#7a5a00;border-radius:4px;padding:1px 8px;font-weight:700}
.pill{display:inline-block;font-size:.78rem;border-radius:99px;padding:1px 10px;background:var(--tint);font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
/* revisión */
.rev{display:grid;gap:12px}
.rv{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.rv input[type=checkbox]{width:22px;height:22px;margin-top:4px;accent-color:var(--g)}
.rv h3{margin:0;font-size:1.05rem}
.kv{display:grid;grid-template-columns:200px 1fr;gap:4px 14px;font-size:.92rem}
.kv b{color:var(--muted);font-weight:600}
details.dt summary{cursor:pointer;font-weight:600;color:var(--g)}
/* galería */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.rc{display:flex;flex-direction:column;overflow:hidden;padding:0}
.pvw{position:relative;height:200px;overflow:hidden;background:var(--tint);border-bottom:1px solid var(--line);cursor:pointer}
.pvw iframe{position:absolute;top:0;left:0;width:1100px;height:700px;border:0;transform:scale(.3);transform-origin:0 0;pointer-events:none;background:#fff}
.pvw .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(10,51,40,.18))}
.rc .bd{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.rc h3{margin:0;font-size:1.05rem;line-height:1.25}
.rc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.pj{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* editor */
.ed{display:grid;grid-template-columns:440px 1fr;height:calc(100vh - 58px)}
.edL{display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);min-height:0}
.edR{display:flex;flex-direction:column;min-width:0;background:#dfe6e2}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--tint)}
.tabs button{flex:1;border:0;background:none;padding:12px 6px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:4px solid transparent}
.tabs button.on{color:var(--g2);border-bottom-color:var(--gold);background:#fff}
.pn{padding:14px 16px 40px;overflow:auto;flex:1}
.item{border:1.5px solid var(--line);border-radius:10px;margin:10px 0;background:#fff}
.item>.ih{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--tint);border-radius:9px 9px 0 0;cursor:pointer}
.item>.ih b{flex:1;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.closed>.ib{display:none}
.item.closed>.ih{border-radius:9px}
.ib{padding:4px 12px 12px}
.ic{border:1px solid #b9c7c0;background:#fff;border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--g2);font-size:.95rem}
.ic:hover{background:var(--tint)}
.ic.d{color:var(--bad)}
.listrow{display:flex;gap:6px;margin:5px 0;align-items:center}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:8px 0}
.sw button{border:2px solid var(--line);border-radius:10px;background:#fff;padding:8px;cursor:pointer;text-align:center;font-size:.85rem;font-weight:600}
.sw button.on{border-color:var(--g);box-shadow:0 0 0 3px rgba(15,77,58,.2)}
.sw i{display:block;height:28px;border-radius:6px;margin-bottom:5px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.seg button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.seg button.on{border-color:var(--g);background:var(--tint)}
.colors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.colors input[type=color]{width:100%;height:42px;padding:2px;border:1.5px solid #b9c7c0;border-radius:8px;background:#fff}
.edBar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.edBar .sp{flex:1}
.stat{font-size:.85rem;color:var(--muted)}
.pvWrap{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;justify-content:center}
.pvWrap iframe{width:100%;height:100%;border:0;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.pvWrap.cel iframe{width:390px;max-width:100%}
.tg{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.tg input{width:22px;height:22px;accent-color:var(--g);flex:none}
.tg b{display:block}
.tg span{font-size:.85rem;color:var(--muted)}
.imgp{display:flex;gap:10px;align-items:center;margin-top:8px}
.imgp img{height:54px;border-radius:6px;border:1px solid var(--line)}
.ayuda li{margin:8px 0}
.ayuda kbd{background:var(--tint);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.tour{background:var(--warnbg);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.92rem}
@media(max-width:900px){.ed{grid-template-columns:1fr;height:auto}.edL{border-right:0}.pn{max-height:60vh}.pvWrap{height:70vh}}
.fade{animation:f .25s both}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="top" class="top"></div>
<div id="app"></div>
<script>/* Motor de lectura de guiones: .docx / texto → recursos.
   Regla de oro: solo se usa texto que está en el guion. Lo que no se puede ubicar se reporta, nunca se inventa. */
(function(g){
const OVA=g.OVA=g.OVA||{};
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const words=t=>(t||'').trim().split(/\s+/).filter(Boolean).length;
const dec=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');

/* ---------- Lectura de .docx (zip + XML, sin librerías) ---------- */
async function unzip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('El archivo no parece un .docx válido.');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    files[name]={method,csize,lho};p+=46+nlen+elen+clen;
  }
  return {files,u8,dv};
}
async function entry(z,name,asBytes){
  const f=z.files[name];if(!f)return null;
  const nlen=z.dv.getUint16(f.lho+26,true),elen=z.dv.getUint16(f.lho+28,true),st=f.lho+30+nlen+elen;
  const data=z.u8.subarray(st,st+f.csize);
  let out;
  if(f.method===0)out=data;
  else out=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return asBytes?out:new TextDecoder().decode(out);
}
const pText=p=>dec([...p.matchAll(/<w:t(?: [^>]*)?>([^<]*)<\/w:t>|<w:tab\/>|<w:br\/>/g)].map(m=>m[1]!==undefined?m[1]:(m[0]==='<w:tab/>'?'\t':'\n')).join(''));
function docxBlocks(xml){
  const body=xml.slice(Math.max(0,xml.indexOf('<w:body>')));
  const blocks=[];
  for(const m of body.matchAll(/<w:tbl>[\s\S]*?<\/w:tbl>|<w:p[ >][\s\S]*?<\/w:p>/g)){
    const s=m[0];
    if(s.startsWith('<w:tbl>')){
      const rows=(s.match(/<w:tr[ >][\s\S]*?<\/w:tr>/g)||[]).map(r=>(r.match(/<w:tc>[\s\S]*?<\/w:tc>/g)||[]).map(c=>(c.match(/<w:p[ >][\s\S]*?<\/w:p>/g)||[]).map(pText).join('\n').trim()));
      blocks.push({t:'table',rows});
    }else{
      const style=(s.match(/<w:pStyle w:val="([^"]+)"/)||[])[1]||'';
      pText(s).split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&/[\p{L}\p{N}]/u.test(x)).forEach(x=>blocks.push({t:'p',text:x,style}));
    }
  }
  return blocks;
}
async function leerDocx(buf){
  const z=await unzip(buf);
  const xml=await entry(z,'word/document.xml');
  if(!xml)throw new Error('No se encontró el contenido del documento.');
  return docxBlocks(xml);
}
function textoBlocks(txt){
  const blocks=[];
  const lines=txt.replace(/\r/g,'').split('\n');
  let pairs=[];
  const flush=()=>{pairs=pairs.filter(p=>norm(p[0])!=='campo');if(pairs.length){blocks.push({t:'table',rows:[['Campo','Contenido'],...pairs]});pairs=[]}};
  for(const raw of lines){
    const l=raw.trim();if(!l){continue}
    if(raw.includes('\t')&&raw.split('\t').filter(Boolean).length===2){pairs.push(raw.split('\t').map(x=>x.trim()));continue}
    flush();
    const h=l.match(/^#{1,2}\s+(.*)$/);
    blocks.push({t:'p',text:(h?h[1]:l.replace(/^[-*•]\s+/,'')),style:h?'Titulo1':''});
  }
  flush();return blocks;
}

/* ---------- Análisis del guion ---------- */
const RE_CODE=/^([A-Za-z]{1,4}\d+(?:-[A-Za-z0-9]+)+)\s+(.{3,})$/;
const RE_ITEM=/^(escena|nodo|conexi[oó]n|bloque|diapositiva|slide|paso|secci[oó]n)\s*(\d+)\s*[:.\-–—]\s*(.*)$/i;
const RE_ACT=/^actividad(?:\s+de\s+autoaprendizaje)?\s*:\s*(.+)$/i;
const RE_SEC=/^([^:.,;]{2,70}?)\s*:\s*(.+)$/;
const RE_TEC=/(duraci[oó]n|minutos?|p[aá]ginas?|accesibilidad|estilo visual|interacci[oó]n)/i;
const TIPOS={
  presentacion:{nombre:'Presentación',kw:['presentaci']},
  flujo:{nombre:'Diagrama de flujo',kw:['diagrama','flujo']},
  microvideo:{nombre:'Micro-video',kw:['micro']},
  video:{nombre:'Video explicativo',kw:['video']},
  podcast:{nombre:'Podcast',kw:['podcast','audio']},
  lectura:{nombre:'Lectura diagramada',kw:['lectura','texto','documento']}
};
function inferirTipo(nombre){
  const n=norm(nombre);
  if(n.includes('presentaci'))return'presentacion';
  if(n.includes('podcast'))return'podcast';
  if(n.includes('micro')&&n.includes('video'))return'microvideo';
  if(n.includes('video'))return'video';
  if(n.includes('lectura'))return'lectura';
  if(n.includes('diagrama')||n.includes('flujo'))return'flujo';
  return null;
}
function limpiaPaso(s){return s.replace(/^\s*[-•*]\s*/,'').trim()}
function parseActividadInline(t){
  const out={};
  const re=/(Materiales|Pasos|Evidencias?|Criterios)\s*:/gi;
  const marks=[...t.matchAll(re)];
  marks.forEach((m,i)=>{
    const k=norm(m[1]).replace(/s$/,'').replace('materiale','material');
    const v=t.slice(m.index+m[0].length,i+1<marks.length?marks[i+1].index:t.length).trim().replace(/[.;]\s*$/,'');
    out[k]=v;
  });
  const r={materiales:out.material||'',evidencia:out.evidencia||'',pasos:[],criterios:[]};
  if(out.paso){
    const parts=out.paso.split(/\s*\d+\s*[).]\s+/).map(x=>x.trim().replace(/[.;]\s*$/,'')).filter(Boolean);
    r.pasos=parts.length?parts:[out.paso];
  }
  if(out.criterio){
    const c=out.criterio.split(/\s*,\s*/);
    if(c.length){const last=c.pop();const y=last.split(/\s+y\s+/);c.push(...y)}
    r.criterios=c.map(x=>x.trim()).filter(Boolean);
  }
  return r;
}
function construirRecurso(c,info){
  const lineas=c.lineas;
  const R={id:'r'+Math.random().toString(36).slice(2,9),codigo:c.codigo,clase:c.clase,nombre:c.nombre,tipo:c.tipo,titulo:'',partes:[],actividad:null,tecnica:{texto:'',duracion:''},avisos:[],sinUbicar:[]};
  let i=0;
  const esItem=t=>RE_ITEM.test(t)||/^(apertura|cierre)\s*:/i.test(t)||/^materiales\s*:/i.test(t)||RE_ACT.test(t);
  const t0=lineas.findIndex(l=>/t.?tulo\s*1|heading\s*1/i.test(l.style));
  if(t0>=0){R.titulo=lineas[t0].text.replace(/^[:\s]+|[:\s]+$/g,'');lineas.splice(t0,1)}
  else if(lineas[0]&&!esItem(lineas[0].text)){R.titulo=lineas[0].text;lineas.shift()}
  const pend=[];let act=null;
  lineas.forEach((l,idx)=>{
    const t=l.text;let m;
    if(/^materiales\s*:/i.test(t)){
      act=Object.assign(act||{},parseActividadInline(t));
      const prev=pend[pend.length-1];
      if(prev&&prev.idx===idx-1&&!act.enunciado){act.enunciado=prev.text;pend.pop()}
    }else if((m=RE_ACT.exec(t))){
      act=Object.assign(act||{},{enunciado:m[1].trim()});
    }else if((m=RE_ITEM.exec(t))){
      const grupo=norm(m[1]).replace('conexion','conexion'),n=+m[2];let txt=m[3].trim();let visual='';
      const v=txt.match(/^\[([^\]]*)\]\s*(.*)$/);if(v){visual=v[1].trim();txt=v[2].trim()}
      R.partes.push({clave:grupo,n,etiqueta:m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+' '+n,texto:txt,visual});
    }else if((m=/^(apertura|cierre)\s*:\s*(.*)$/i.exec(t))){
      R.partes.push({clave:norm(m[1]),n:0,etiqueta:m[1][0].toUpperCase()+m[1].slice(1).toLowerCase(),texto:m[2].trim(),visual:''});
    }else if((m=RE_SEC.exec(t))&&words(m[1])<=8){
      R.partes.push({clave:'seccion',n:0,etiqueta:m[1].trim(),texto:m[2].trim(),visual:''});
    }else pend.push({text:t,idx});
  });
  // ficha técnica: último párrafo suelto con indicaciones de producción
  for(let k=pend.length-1;k>=0;k--){
    if(RE_TEC.test(pend[k].text)&&pend[k].text.length>40){R.tecnica.texto=pend[k].text;pend.splice(k,1);break}
  }
  const d=R.tecnica.texto.match(/(\d+)\s*(minutos?|p[aá]ginas?)/i);
  if(d)R.tecnica.duracion=d[1]+' '+d[2].toLowerCase();
  R.sinUbicar=pend.map(p=>p.text);
  if(act&&(act.pasos||act.materiales||act.evidencia||act.criterios||act.enunciado)){
    R.actividad={enunciado:act.enunciado||'',materiales:act.materiales||'',pasos:act.pasos||[],evidencia:act.evidencia||'',criterios:act.criterios||[]};
  }
  return R;
}
function analizar(blocks){
  const info={},recursos=[],avisos=[];let cur=null,evaluacion=false;
  const cierra=()=>{if(cur){recursos.push(construirRecurso(cur,info));cur=null}};
  for(const b of blocks){
    if(b.t==='table'){
      const rows=b.rows;
      if(!cur&&rows.length>=2&&rows[0].length>=2&&norm(rows[0][0])==='campo'){
        rows.slice(1).forEach(r=>{if(r[0])info[norm(r[0]).replace(/ /g,'_')]=(r[1]||'').trim()});
      }
      continue;
    }
    const t=b.text;if(!t)continue;
    if(/^evaluaci[oó]n\s*:?$/i.test(t)){cierra();evaluacion=true;continue}
    const m=RE_CODE.exec(t);
    if(m&&!evaluacion){
      cierra();
      const cl=(m[2].match(/\((OVA|OVI)\)/i)||[])[1];
      const nombre=m[2].replace(/\s*\((OVA|OVI)\)\s*/i,' ').trim();
      const code=m[1];
      const clase=(cl||(/PRES/i.test(code)?'PRES':(/OV([AI])/i.exec(code)||[])[0]||'')).toUpperCase();
      cur={codigo:code,nombre,clase,tipo:inferirTipo(nombre),lineas:[]};
      continue;
    }
    if(cur)cur.lineas.push({text:t,style:b.style});
    else if(!evaluacion&&b.style&&/t.?tulo\s*1|heading\s*1/i.test(b.style)&&!info.titulo_guion)info.titulo_guion=t;
  }
  cierra();
  let diagnostico='';
  if(!recursos.length){
    const todo=blocks.map(b=>b.t==='table'?b.rows.map(r=>r.join(' ')).join(' '):b.text).join('\n');
    if(/<<[^>]*>>|<ID_RECURSO>/i.test(todo))diagnostico='Este documento es la plantilla del guion y todavía está sin llenar (tiene marcas como «<<TÍTULO_DEL_RECURSO>>»). Llénela con el contenido de cada recurso y vuelva a cargarla.';
    else if(blocks.some(b=>b.t==='table'&&b.rows[0]&&b.rows[0].some(c=>/recurso educativo digital|actividad de autoaprendizaje/i.test(c))))diagnostico='Este documento describe qué recursos tendrá la unidad (su estructura), pero no trae el contenido de cada uno: faltan las escenas, nodos, bloques o secciones. Cargue el guion de recursos, donde cada recurso tiene su código, por ejemplo «U2-T1-OVA1».';
  }
  recursos.forEach(r=>{

 h('div',{class:'card info'},h('b',{},'Resultado de aprendizaje'),h('p',{style:'margin:.3rem 0 0'},i.resultado));\n}\nconst secs2=(n)=>Math.max(4,Math.round(words(n)/5));\n\n/* Actividad de autoaprendizaje: muestra exactamente lo que dice el guion.\n   No inventa preguntas ni respuestas: solo ofrece dónde registrar pasos, evidencia y autoevaluación. */\nfunction actividadUI(host,A,opt){\n  opt=opt||{};\n  const key='act';\n  const saved=store(key)||{pasos:[],crit:[],ev:''};\n  const sv=()=>store(key,saved);\n  const prog=h('div',{class:'bar','aria-hidden':'true'},h('i'));\n  const total=(A.pasos||[]).length+(A.criterios||[]).length;\n  const upd=()=>{\n    const n=(saved.pasos||[]).filter(Boolean).length+(saved.crit||[]).filter(Boolean).length;\n    $('i',prog).style.width=(total?n/total*100:0)+'%';\n    res.textContent=(A.criterios||[]).length?('Criterios cumplidos: '+(saved.crit||[]).filter(Boolean).length+' de '+A.criterios.length):'';\n  };\n  const res=h('p',{class:'muted',style:'font-weight:600'});\n  const card=h('div',{class:'card act'});\n  card.append(h('h3',{style:'margin-top:0'},'Actividad de autoaprendizaje'));\n  if(A.enunciado)card.append(h('p',{},A.enunciado));\n  if(A.materiales)card.append(h('p',{},h('b',{},'Materiales: '),A.materiales));\n  if(total)card.append(prog);\n  if((A.pasos||[]).length){\n    card.append(h('h4',{class:'ah4'},'Pasos'),h('p',{class:'hint'},LOCK?'Marque cada paso al terminarlo: se habilita el siguiente.':'Marque cada paso al terminarlo.'));\n    const boxes=[];\n    const list=h('ol',{class:'pasos2'},A.pasos.map((p,i)=>{\n      const cb=h('input',{type:'checkbox',id:'ps'+i});cb.checked=!!saved.pasos[i];\n      cb.onchange=()=>{saved.pasos[i]=cb.checked;sv();lock();upd();if(cb.checked)addPts2(1)};\n      boxes.push(cb);\n      return h('li',{},h('label',{for:'ps'+i,class:'cl'},cb,h('span',{},p)));\n    }));\n    const lock=()=>{if(!LOCK)return;boxes.forEach((b,i)=>{b.disabled=i>0&&!boxes[i-1].checked&&!b.checked})};\n    lock function fArray(r){
