<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evolución de la didáctica</title>
<style>:root{
  --bg:#f2f5f3;--card:#fff;--ink:#14201b;--muted:#56665f;
  --brand:#0f4d3a;--brand2:#0a3328;--brand3:#b8912f;--accent:#c9a227;
  --ok:#1f7a4d;--okbg:#e3f1e9;--bad:#a63a32;--badbg:#f7e6e4;--line:#d6dfda;
  --radius:12px;--shadow:0 1px 2px rgba(10,51,40,.08),0 6px 18px rgba(10,51,40,.07);
  --grad:linear-gradient(90deg,var(--brand2),var(--mid));
  --tint:#e8eeec;--tint2:#eef3f0;--line2:#b9c7c0;--mid:#1f5c47;--accent-light:#e9d9a1;--accent-dark:#b8901f;--accent-soft:#f7f1dc;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--fs:17px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);line-height:1.6;font-size:var(--fs);background:var(--bg);overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 56px}
/* ---- Cabecera institucional ---- */
.hero{position:relative;background:linear-gradient(180deg,var(--brand2),var(--brand));color:#fff;padding:40px 16px 52px;border-bottom:5px solid var(--accent)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 18px);pointer-events:none}
.hero .in{position:relative;max-width:1040px;margin:0 auto;z-index:1}
.tag{display:inline-block;border:1px solid rgba(255,255,255,.45);padding:4px 12px;border-radius:4px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-light)}
.hero h1{margin:.7rem 0 .4rem;font-size:clamp(1.7rem,4.4vw,2.5rem);line-height:1.15;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0;max-width:740px;opacity:.93;font-size:1.08rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.meta span{background:rgba(255,255,255,.1);border-left:3px solid var(--accent);padding:4px 12px;font-size:.85rem}
/* ---- Secciones y tarjetas ---- */
section.sec{margin-top:34px}
h2{font-size:1.4rem;margin:0 0 14px;color:var(--brand2);font-weight:700;display:flex;align-items:center;gap:10px}
h2:before{content:"";width:5px;height:24px;background:var(--accent);flex:none}
h3{margin:.2rem 0 .4rem;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.grid{display:grid;gap:18px}
/* ---- Botones ---- */
.btn{font:inherit;cursor:pointer;border:2px solid var(--brand);border-radius:8px;padding:10px 22px;background:var(--brand);color:#fff;font-weight:600;letter-spacing:.01em;transition:background .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--brand2);border-color:var(--brand2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--brand)}
.btn.sec:hover:not(:disabled){background:var(--tint)}
.btn.warn{background:var(--accent);border-color:var(--accent);color:#1b1500}
.btn.warn:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ---- Retroalimentación ---- */
.fb{border-radius:8px;padding:12px 16px;margin-top:12px;border-left:5px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb.info{background:var(--tint);border-color:var(--brand)}
.fb b:first-child{display:block;margin-bottom:2px}
/* ---- Ventana emergente ---- */
.overlay{position:fixed;inset:0;background:rgba(8,28,22,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:12px;border-top:5px solid var(--accent);max-width:600px;width:100%;max-height:92vh;overflow:auto;padding:24px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal .x{position:absolute;top:10px;right:12px;border:0;background:var(--tint2);border-radius:6px;width:36px;height:36px;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--brand2)}
/* ---- Formularios y barras ---- */
.bar{height:10px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);width:0;transition:width .4s}
textarea,select,input[type=text]{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink)}
textarea:focus,select:focus,input[type=text]:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,77,58,.18)}
textarea{min-height:92px;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:var(--brand)}
label{font-weight:600}
/* ---- Ilustraciones ---- */
.art svg{width:100%;height:auto;display:block;border-radius:8px}
.art img{width:100%;display:block;border-radius:8px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;font-weight:700;font-size:.9rem;flex:none}
.muted{color:var(--muted)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{margin-top:44px;padding:0 16px 34px;text-align:center;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:opacity .15s ease,background-color .15s ease,color .15s ease,border-color .15s ease!important}.btn:active:not(:disabled){transform:none}}
@media print{.hero{background:#fff;color:#000}.btn{display:none}}
@media(max-width:600px){body{font-size:16.5px}.card{padding:16px}.hero{padding:28px 16px 40px}}
/* ---- Interacción obligatoria: bloqueos, avance, avisos ---- */
.gated>:not(.veil){display:none!important}
.gated>.veil{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line2);background:repeating-linear-gradient(135deg,var(--tint2),var(--tint2) 12px,var(--tint) 12px,var(--tint) 24px);border-radius:var(--radius);padding:26px 18px;color:var(--brand2);font-weight:600}
.veil h3{margin:6px 0 4px;font-size:1.15rem}
.veil p{margin:0;font-weight:400;color:var(--muted)}
.unlocked{animation:unl .5s}
@keyframes unl{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brand2);color:#fff;padding:10px 20px;border-radius:8px;border-left:5px solid var(--accent);z-index:90;transition:opacity .5s;max-width:92vw;text-align:center;box-shadow:var(--shadow);font-weight:600}
.toast.out{opacity:0}
.hud{position:fixed;top:12px;right:12px;z-index:60;background:var(--brand2);color:#fff;font-weight:600;font-size:.9rem;padding:6px 14px;border-radius:6px;border-left:4px solid var(--accent);box-shadow:var(--shadow)}
.hud.pop{animation:hudpop .35s}
@keyframes hudpop{50%{transform:scale(1.12)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{font-size:.9rem;color:var(--muted);margin:6px 0 0}
/* Iconos de contenido en tono neutro (evita aspecto infantil) */
.ico,.hot span,.lh .ic,.dot,.stepper li>span,.cust .av,.scn-i{filter:grayscale(1) contrast(1.05)}
/* Ventana emergente compacta: evita desplazamiento */
.modal{max-width:640px;padding:20px 24px;max-height:96vh}
.modal h3{margin:0 40px 8px 0;font-size:1.2rem}
.modal .art svg{height:84px;border-radius:6px}
.modal p{margin:.4rem 0}
.modal .fb{margin-top:8px;padding:10px 14px}
.modal .fb .hint{display:none}
.modal .reto .opt,.modal .opt{padding:8px 14px;margin:5px 0}
.opt:disabled,.reto .opt:disabled{color:var(--ink)}
.modal .row{margin-top:8px!important}
@media(max-height:760px){.modal .art{display:none}}
/* Ventana emergente: encabezado institucional, sin ilustración recortada */
.modal .art{display:none}
.modal h3{background:var(--brand2);color:#fff;margin:-20px -24px 14px;padding:16px 60px 16px 24px;font-size:1.1rem;border-radius:7px 7px 0 0}
.modal .x{background:rgba(255,255,255,.15);color:#fff;top:9px}
.modal .x:hover{background:rgba(255,255,255,.28)}
.modal .opt{border-radius:8px}
.modal .row{justify-content:flex-end}

/* Acordeón de secciones */
section.sec{scroll-margin-top:12px}
.ab[hidden]{display:none}
.ah{display:block;width:100%;font:inherit;text-align:left;cursor:pointer;border:0;background:none;padding:0;color:var(--brand2)}
.ah.open{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:700;margin:0 0 14px}
.ah.open:before{content:'';width:5px;height:24px;background:var(--accent);flex:none}
.ah.lock,.ah.done,.ah.idle{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 18px;border-radius:var(--radius);gap:0}
.ah.lock{border:2px dashed var(--line2);background:repeating-linear-gradient(135deg,var(--tint2),var(--tint2) 12px,var(--tint) 12px,var(--tint) 24px);cursor:not-allowed}
.ah.done{border:2px solid var(--ok);background:var(--okbg)}
.ah.idle{border:2px solid var(--brand);background:#fff}
.ah.done:hover,.ah.idle:hover{filter:brightness(.97)}
.ah .ic{font-size:1.5rem;line-height:1.2}
.ah.done .ic{color:var(--ok);font-weight:800}
.ah.idle .ic{color:var(--brand);font-size:1.1rem}
.ah .tt{font-weight:700;font-size:1.05rem}
.ah .st{font-size:.9rem;color:var(--muted);font-weight:400}

/* Utilidades de la plataforma */
.cl{display:flex;gap:10px;align-items:flex-start;font-weight:400;padding:5px 0}
.cl input{width:22px;height:22px;margin-top:2px;flex:none}
.ah4{margin:16px 0 4px;font-size:1.05rem;color:var(--brand2)}
.pasos2{list-style:none;padding:0;margin:0}
.card.info{border-left:5px solid var(--accent)}
.hero .logo{height:52px;display:block;margin-bottom:10px}
.hero.lisa:before{display:none}
.unlocked{animation:unl .5s}

/* Diseño institucional (tablero de Figma): hoja blanca centrada, encabezado degradado, tarjetas compactas.
   Se aplica después de base.css y solo en los recursos de la plataforma. */
:root{--nav:#13235b;--lime:#d7ff1e;--ins:#d7ff1e;--ink:#1b2a41;--gris:#f1f3f5}
body{background:#e6e9ee;color:var(--ink);line-height:1.55;padding:22px 14px}

/* La hoja: encabezado + contenido forman una sola hoja blanca */
.hero{background:#fff;max-width:1000px;margin:0 auto;padding:22px 24px 0;border-radius:14px 14px 0 0;border:1px solid #e3e7ec;border-bottom:0}
.hero:before{display:none}
.wrap{display:flow-root}
.wrap{background:#fff;max-width:1000px;margin:0 auto;padding:0 24px 26px;border-radius:0 0 14px 14px;border:1px solid #e3e7ec;border-top:0;box-shadow:0 14px 24px -14px rgba(19,35,91,.20)}
.hero .in{position:relative;overflow:hidden;max-width:none;border-radius:12px;padding:20px 26px 22px;color:#fff;
  background:radial-gradient(120% 140% at 50% 130%,rgba(255,255,255,.14),transparent 60%),linear-gradient(100deg,var(--nav) 0%,var(--brand) 100%)}
.hero .in:before,.hero .in:after{content:"";position:absolute;pointer-events:none;border:2px solid rgba(255,255,255,.16);border-radius:22px;transform:rotate(45deg)}
.hero .in:before{width:150px;height:150px;right:-38px;top:-62px}
.hero .in:after{width:96px;height:96px;right:96px;bottom:-58px;border-color:rgba(255,255,255,.10)}
.hero .in>*{position:relative;z-index:1}
.hero .tag{border:0;padding:0;border-radius:0;color:rgba(255,255,255,.9);font-size:.62rem;letter-spacing:.08em;font-weight:600}
.hero h1{margin:.45rem 0 .4rem;font-size:clamp(1.3rem,3.3vw,1.85rem);line-height:1.22;font-weight:800;letter-spacing:-.005em}
.hero p{margin:0;opacity:.95;font-size:.82rem}
.hero .logo{margin-bottom:8px}
.meta{margin-top:12px;gap:6px}
.meta span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 12px;font-size:.7rem;font-weight:600}
footer{max-width:1000px;margin:14px auto 0;color:#6b7686;font-size:.75rem}

/* Títulos, tarjetas, botones */
section.sec{margin-top:22px}
h2{color:var(--brand);font-size:1.15rem;font-weight:800;margin:0 0 10px}
h2:before{display:none}
h3{color:var(--nav)}
.card{border:1px solid #dfe4ea;border-radius:10px;box-shadow:none;padding:16px 18px}
.card.info{background:var(--tint);border-color:var(--line2)}
.card.info b{color:var(--brand)}
.btn{background:var(--nav);border-color:var(--nav);border-radius:7px;font-weight:700;font-size:.8rem;padding:8px 16px}
.btn:hover:not(:disabled){background:#0c1744;border-color:#0c1744}
.btn.sec{background:#fff;color:var(--nav)}
.btn.sec:hover:not(:disabled){background:var(--tint)}
.btn.warn{background:var(--lime);border-color:var(--lime);color:#10240a}
.btn.sm{padding:6px 12px;font-size:.75rem}
:focus-visible{outline:3px solid var(--nav);outline-offset:2px}
.bar{height:6px;border-radius:999px;background:#dfe4ea}
.bar>i{background:linear-gradient(90deg,var(--nav),var(--brand));border-radius:999px}
.toast,.hud{background:var(--nav);border-left-color:var(--lime)}
.modal{border-top-color:var(--lime);border-radius:14px}
textarea:focus,select:focus,input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,107,92,.18)}
input[type=checkbox],input[type=radio]{accent-color:var(--brand)}
.muted{color:#6b7686}
.pt-i{color:var(--brand)}

/* Resto de plantillas heredadas */
.sec2{border:1px solid #dfe4ea!important;box-shadow:none!important;border-radius:8px!important}
.sec2>button.hd{background:#fff!important;color:var(--brand)!important;font-weight:800;font-size:.95rem!important}
.sec2>button.hd .n{background:var(--nav)!important}
.sec2.open{border-color:var(--brand)!important}
.tag2{border-color:var(--brand)!important;color:var(--brand)!important}
@media print{.hero .in{background:#fff;color:#000}.wrap{box-shadow:none}}
@media(max-width:640px){body{padding:10px 6px}.hero{padding:14px 12px 0}.hero .in{padding:16px 16px}.wrap{padding:0 12px 20px}}

/* ---- Actividades: vista propia a hoja completa ---- */
.lanz .tagl{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:1px 10px}
.vact{position:fixed;inset:0;z-index:80;overflow:auto;background:#e6e9ee;padding:20px 12px}
.vact .hoja{max-width:880px;margin:0 auto;background:#fff;border:1px solid #e3e7ec;border-radius:14px;padding:22px 24px;box-shadow:0 10px 30px rgba(19,35,91,.12)}
.vact .cabv{position:relative;overflow:hidden;border-radius:12px;padding:18px 24px 20px;color:#fff;background:radial-gradient(120% 140% at 50% 130%,rgba(255,255,255,.14),transparent 60%),linear-gradient(100deg,var(--nav),var(--brand))}
.vact .cabv .rot{font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.vact .cabv h1{margin:.4rem 0 .35rem;font-size:clamp(1.2rem,3vw,1.7rem);font-weight:800;line-height:1.2}
.vact .cabv .ins{display:flex;gap:8px;align-items:center;margin:8px 0 0;font-size:.74rem;color:var(--ins)}
.vact .cabv .ins svg{width:17px;height:17px;flex:none}
.vact .cuerpov{padding-top:14px}
.vact .tit2{margin:0 0 4px;font-size:1.02rem;color:var(--nav);font-weight:800}
.vact .sub2{margin:0 0 12px;font-size:.76rem;color:#3b4a60}
.vact .pieact{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid #e3e7ec;font-size:.64rem;color:#4a586b}
.vact .pieact .sp{flex:1}
.vact .dos{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.vact .colx h3{margin:0 0 8px;font-size:.86rem;color:var(--nav);font-weight:800}
.vact .fila{display:flex;align-items:center;gap:9px;width:100%;margin-bottom:6px;padding:8px 11px;border:1px solid #dfe3ea;border-radius:7px;background:var(--gris);font:inherit;font-size:.74rem;color:var(--ink);text-align:left;cursor:pointer}
.vact .fila .num{font-weight:800;color:var(--nav);font-size:.7rem;flex:none;min-width:20px}
.vact .fila .tx{flex:1}
.vact .fila .pto{width:18px;height:18px;border-radius:50%;border:1.5px solid #9aa6b8;background:#fff;flex:none;color:#fff;font-size:.58rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.vact .fila:hover{border-color:var(--brand)}
.vact .fila.sel{border-color:var(--brand);background:var(--tint);box-shadow:0 0 0 2px var(--line2)}
.vact .fila.unida{background:#fff}
.vact .fila.ok{border-color:#1f7a4d;background:#e3f1e9}
.vact .fila.mal{border-color:#a63a32;background:#f7e6e4}
.vact .resx{margin:0;font-size:.74rem;font-weight:700;color:var(--nav)}
@media(max-width:700px){.vact .dos{grid-template-columns:1fr}}

/* Clasificación */
.vact .crit{background:var(--gris);border:1px solid #dfe3ea;border-radius:8px;padding:10px 13px;margin-bottom:10px}
.vact .crit b{display:block;font-size:.78rem;color:var(--nav);margin-bottom:3px}
.vact .crit p{margin:0;font-size:.72rem;color:#2b3a50}
.vact .cls{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:start}
.vact .banco h3{margin:0 0 8px;font-size:.84rem;color:var(--nav);font-weight:800}
.vact .banco{display:flex;flex-direction:column;gap:6px;min-height:80px}
.vact .banco .vacio{font-size:.68rem;color:#6b7686;margin:0}
.vact .chip{touch-action:none;user-select:none;display:inline-block;text-align:left;font:inherit;font-size:.7rem;color:var(--ink);background:#fff;border:1px solid #cdd5e0;border-radius:6px;padding:6px 10px;cursor:grab}
.vact .banco .chip{display:block;width:100%}
.vact .chip.sel{border-color:var(--brand);background:var(--tint);box-shadow:0 0 0 2px var(--line2)}
.vact .chip.ok{border-color:#1f7a4d;background:#e3f1e9}
.vact .chip.mal{border-color:#a63a32;background:#f7e6e4}
.vact .zona{background:var(--gris);border:1px solid #dfe3ea;border-radius:8px;padding:10px 12px;margin-bottom:10px}
.vact .zona>b{display:block;font-size:.8rem;color:var(--nav)}
.vact .zona>p{margin:2px 0 7px;font-size:.66rem;color:#4a586b}
.vact .drop{margin-top:7px;border:1.5px dashed #aeb8c8;border-radius:7px;min-height:58px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#fff;color:#6b7686;font-size:.66rem;text-align:center}
.vact .drop.lista{border-color:var(--brand);background:var(--tint2);cursor:pointer}
.vact .drop.sobre{border-color:var(--brand);background:var(--tint)}
@media(max-width:700px){.vact .cls{grid-template-columns:1fr}}

/* Cuestionario */
.vact .opc{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.vact .fila.op .pto{width:18px;height:18px;font-size:.62rem}
.vact .fila.op .pto.cuad{border-radius:4px}
.vact .fbq{margin-top:12px;border-radius:8px;padding:10px 13px;border-left:5px solid}
.vact .fbq b{display:block;font-size:.78rem;margin-bottom:2px}
.vact .fbq p{margin:0;font-size:.7rem;line-height:1.6}
.vact .fbq.ok{background:#e3f1e9;border-color:#1f7a4d}
.vact .fbq.mal{background:#f7e6e4;border-color:#a63a32}
.vact .row.nav{display:flex;align-items:center;gap:10px}
.vact .row.nav .sp{flex:1}
.vact .row.nav .cnt{font-size:.66rem;color:#4a586b}
.vact .nv{display:flex;flex-direction:column;gap:6px;margin-top:10px}

/* Tarea evaluativa */
.vact .sub3{margin:0 0 8px;font-size:.84rem;color:var(--nav);font-weight:800}
.vact .dosv{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px;align-items:start}
.vact .pasosv{display:flex;flex-direction:column;gap:6px}
.vact .pasov{background:var(--gris);border:1px solid #dfe3ea;border-radius:7px;padding:8px 11px}
.vact .pasov b{display:block;font-size:.74rem;color:var(--nav)}
.vact .pasov span{font-size:.66rem;color:#3b4a60;line-height:1.5}
.vact .cmpv{margin-bottom:8px}
.vact .cmpv label{display:block;font-size:.68rem;font-weight:700;color:var(--nav);margin-bottom:3px}
.vact .cmpv textarea{width:100%;min-height:70px;font-size:.72rem}

const OVA=(function(){
  let api=null,t0=Date.now(),susp={},hecho=false,tm=null;
  const busca=()=>{try{let w=window,n=0;while(!w.API&&w.parent&&w.parent!==w&&n++<20)w=w.parent;return w.API||null}catch(e){return null}};
  const lee=k=>{try{return api?String(api.LMSGetValue(k)||''):''}catch(e){return ''}};
  const pon=(k,v)=>{try{if(api)api.LMSSetValue(k,String(v))}catch(e){}};
  const p2=n=>String(n).padStart(2,'0');
  const hms=ms=>{const s=Math.floor(ms/1000);return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
  const guarda=()=>{pon('cmi.suspend_data',JSON.stringify(susp).slice(0,4000));pon('cmi.core.session_time',hms(Date.now()-t0));try{if(api)api.LMSCommit('')}catch(e){}};
  const pronto=()=>{clearTimeout(tm);tm=setTimeout(guarda,400)};
  try{
    api=busca();

      api.LMSInitialize('');
      const st=lee('cmi.core.lesson_status');

  addEventListener('pagehide',()=>{guarda();try{if(api)api.LMSFinish('')}catch(e){}});
  return {
    leer:k=>susp[k],
    guardar:(k,v)=>{susp[k]=v;pronto()},
    ubicacion:l=>{pon('cmi.core.lesson_location',String(l).slice(0,255));pronto()},
    completo:()=>{if(hecho)return;hecho=true;pon('cmi.core.lesson_status','completed');guarda()},

})();

        if(comprobado)return;

      }},h('span',{class:'num'},String(i+1).padStart(2,'0')),h('span',{class:'tx'},p.a),
        h('span',{class:'pto',style:k?'background:'+color(i)+';border-color:'+color(i):''},k?String(i+1):''));

    });
    orden.forEach((iB,pos)=>{

function actividadClasificacion(host,A){

  let s=T.length*7919+29;const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
  for(let i=T.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[T[i],T[j]]=[T[j],T[i]]}

    const mueve=ev=>{

        fan.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;margin:0;pointer-events:none;z-index:9999';
        fan.dataset.dx=x0-r.left;fan.dataset.dy=y0-r.top;document.body.append(fan);c.classList.add('origen')}
      ev.preventDefault();

  }

    }));

  function p4(){
    const filas=textoReg();
    const t=h('table',{class:'tabreg'},h('thead',{},h('tr',{},['Paso','Etapa','Su elección','Resultado'].map(x=>h('th',{},x)))),h('tbody',{},filas.map(f=>h('tr',{},f.map(x=>h('td',{},x))))));
    return h('div',{},sub('Registro de la experiencia'),t,A.reporte?h('p',{class:'sub2'},A.reporte):null);
  }
  const listo=()=>pg===0?E.dgOk:pg===1?E.comparado:pg===2?E.ivOk:true;
  function pinta(){
    cuerpo.replaceChildren(pg===0?p1():pg===1?p2():pg===2?p3():p4());
    const ult=pg===3,falta=LOCK&&!listo();
    cuerpo.append(h('div',{class:'row nav',style:'margin-top:14px'},h('span',{class:'cnt'},(pg+1)+'/4 · '+ETA[pg]+(falta?' · complete el paso para continuar':'')),h('span',{class:'sp'}),
      h('button',{class:'btn sec',type:'button',disabled:pg===0,onclick:()=>{pg--;pinta()}},'← Anterior'),
      h('button',{class:'btn',type:'button',disabled:falta,onclick:()=>{if(ult)reiniciar();else{pg++;pinta()}}},ult?'Volver al inicio':'Siguiente →')));
    if(vista)vista.h1.textContent=TIT[pg];
  }
  const reiniciar=()=>{Object.assign(E,{dg:null,dgOk:false,cfVistas:new Set(),cfSel:0,comparado:false,iv:null,ivOk:false});Object.keys(mem).forEach(k=>delete mem[k]);try{localStorage.removeItem('ova:'+CFG.id+':'+clave)}catch(e){}pg=0;pinta()};
  vista=vistaActividad(TIT[0],ACT_ROT.laboratorio,'Observe la situación y complete cada paso del laboratorio.',cuerpo,reiniciar);
  pinta();
  lanzadorActividad(host,A,titulo,vista);
}
</script>
<script>
document.title=CFG.titulo;
const E=(CFG.eventos||[]).filter(e=>e.fecha||e.texto);
const N=E.length;
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let cur=0;const vistos=new Set(FREE?E.map((_,i)=>i):[0]);let playT=null,actHost=null,bAct=null,aviso=null;
const canOpen=i=>!LOCK||vistos.has(i)||vistos.has(i-1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const anuncia=t=>{const l=$('#live');if(l){l.textContent='';setTimeout(()=>l.textContent=t,40)}};
const etiqueta=e=>e.fecha||'Momento';
const APP=$('#app');

/* ---- paleta DIEPO fija: cada etapa toma un color (el texto encima va en blanco, o en azul oscuro sobre cian) ---- */
const BL='#FFFFFF',OSC='#151B3B';
const COLS=[{c:'#00665F',cf:BL},{c:'#08A6CB',cf:OSC},{c:'#1C45B4',cf:BL},{c:'#22335D',cf:BL}];
const rgba=(h,a)=>'rgba('+[1,3,5].map(i=>parseInt(h.substr(i,2),16)).join(',')+','+a+')';

/* ---- fecha → año (para la escala) ---- */
const ROM={I:1,V:5,X:10,L:50,C:100};
const romano=s=>{let t=0,p=0;s.toUpperCase().split('').reverse().forEach(ch=>{const v=ROM[ch]||0;if(v<p)t-=v;else{t+=v;p=v}});return t};
const aRom=n=>{const t=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';t.forEach(([v,r])=>{while(n>=v){s+=r;n-=v}});return s};
function anioDe(f){
  f=String(f||'');const ac=/\ba\.?\s?(de\s)?C\b\.?/i.test(f)||/\bAC\b/.test(f);
  let m=f.match(/siglo\s+([ivxlc]+)\b/i);
  if(m){const n=romano(m[1]);if(n>0)return{y:ac?-(n*100-50):(n-1)*100+50,aprox:true}}
  m=f.match(/(?:^|[^\d])(\d{1,4})(?!\d)/);
  if(m&&(ac||m[1].length>=3))return{y:ac?-(+m[1]):+m[1],aprox:false};
  return null;
}
const sigloDe=y=>y>0?'Siglo '+aRom(Math.floor((y-1)/100)+1):null;

/* ---- posiciones: a escala si todos los hitos tienen año y van en orden; si no, a espacios iguales ---- */
const PAD=140,GAP=210;
const Y=E.map(e=>anioDe(e.fecha));
const escala=N>1&&Y.every(Boolean)&&Y.every((a,i)=>i===0||a.y>=Y[i-1].y)&&Y[N-1].y>Y[0].y;
let W=0,Y0=0,Y1=0,pxAnio=0;
if(escala){
  Y0=Y[0].y;Y1=Y[N-1].y;const objetivo=Math.max(N*GAP,1500);pxAnio=objetivo/(Y1-Y0);
  E.forEach((e,i)=>{e._x=PAD+(Y[i].y-Y0)*pxAnio});
  for(let i=1;i<N;i++){const m1=i>=1?E[i-1]._x+52:0,m2=i>=2?E[i-2]._x+140:0;E[i]._x=Math.max(E[i]._x,m1,m2)}
}else{E.forEach((e,i)=>{e._x=PAD+i*GAP})}
W=N?E[N-1]._x+PAD:0;
const fx=y=>PAD+(y-Y0)*pxAnio;

/* ---- etapas (franjas de color) ---- */
const ETAPAS=[];
E.forEach((e,i)=>{
  const clave=e.etapa||e.era||(escala&&sigloDe(Y[i].y))||('#'+i);
  const nombre=(e.etapa||e.era)||((escala&&sigloDe(Y[i].y))||etiqueta(e));
  if(!ETAPAS.length||ETAPAS[ETAPAS.length-1].clave!==clave)ETAPAS.push({clave,nombre,desde:i,hasta:i});else ETAPAS[ETAPAS.length-1].hasta=i;
  e._et=ETAPAS.length-1;e._col=COLS[e._et%COLS.length];
});

/* ---- motivos geométricos genéricos ---- */
const MOTIVOS=[
  ()=>{let s='';[88,62,38].forEach((r,k)=>{s+='<circle class="m-pop" style="--dl:'+(k*130)+'ms" cx="120" cy="120" r="'+r+'" fill="'+(k===2?'var(--acc)':'none')+'" stroke="currentColor" stroke-width="5"/>'});return s+'<circle class="m-pulse" cx="120" cy="120" r="14" fill="none" stroke="currentColor" stroke-width="4"/>'},
  ()=>{let s='',c,r;for(r=0;r<4;r++)for(c=0;c<4;c++){const on=(c*3+r*5)%7<3;s+='<rect class="m-pop" style="--dl:'+(c*60+r*60)+'ms" x="'+(40+c*40)+'" y="'+(40+r*40)+'" width="34" height="34" rx="8" fill="'+(on?'var(--acc)':'var(--soft)')+'" stroke="currentColor" stroke-width="3"/>'}return s},
  ()=>{const hs=[56,92,70,128,104,150];let s='<line class="m-fade" x1="30" y1="200" x2="212" y2="200" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>';hs.forEach((v,k)=>{s+='<rect class="m-grow" style="--dl:'+(k*80)+'ms" x="'+(40+k*28)+'" y="'+(200-v)+'" width="20" height="'+v+'" rx="5" fill="currentColor"/>'});return s+'<polyline class="m-draw" pathLength="1" style="--dl:700ms" points="'+hs.map((v,k)=>(50+k*28)+' '+(200-v-18)).join(' ')+'" fill="none" stroke="var(--acc)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>'},
  ()=>'<circle class="m-pop" cx="120" cy="120" r="26" fill="var(--acc)" stroke="currentColor" stroke-width="5"/><ellipse class="m-draw" pathLength="1" cx="120" cy="120" rx="92" ry="44" fill="none" stroke="currentColor" stroke-width="4" transform="rotate(-24 120 120)"/><g class="m-spin"><circle class="m-pop" style="--dl:500ms" cx="198" cy="96" r="11" fill="currentColor"/><circle class="m-pop" style="--dl:650ms" cx="44" cy="146" r="9" fill="currentColor"/></g>',
  ()=>{let s='';[92,66,40].forEach((r,k)=>{s+='<rect class="m-draw" pathLength="1" style="--dl:'+(k*180)+'ms" x="'+(120-r)+'" y="'+(120-r)+'" width="'+(r*2)+'" height="'+(r*2)+'" rx="8" transform="rotate(45 120 120)" fill="'+(k===2?'var(--acc)':'none')+'" stroke="currentColor" stroke-width="5"/>'});return s},
  ()=>{let s='';[70,110,150].forEach((y,k)=>{s+='<path class="m-draw" pathLength="1" style="--dl:'+(k*170)+'ms" d="M26 '+y+' C70 '+(y-34)+' 100 '+(y+34)+' 140 '+y+' S200 '+(y-30)+' 214 '+(y-6)+'" fill="none" stroke="'+(k===1?'var(--acc)':'currentColor')+'" stroke-width="'+(k===1?7:5)+'" stroke-linecap="round"/>'});return s+'<circle class="m-pop" style="--dl:700ms" cx="140" cy="110" r="10" fill="currentColor"/>'}
];

/* ---- ajuste del texto del panel ---- */
/* Un solo tamaño de texto para todos los hitos: el mayor que cabe en el hito con más texto */
let TAM=0,RW='';
function llenaTexto(e,i){
  const a=escala&&!Y[i].aprox?String(Y[i].y):null;
  $('#pan').textContent=a||etiqueta(e);
  $('#pan').style.fontSize=(a?'':'clamp(1.3rem,4vh,2rem)');
  $('#ptit').replaceChildren(h('span',{class:'so'},etiqueta(e)+'. '),e.titulo||'');
  $('#ptx').replaceChildren(...String(e.texto||'').split(/\n+/).filter(Boolean).map(t=>h('p',{},t)));
  $('#pcm').replaceChildren(...(e.cambio?[h('div',{class:'cam'},h('b',{},'¿Qué cambió?'),h('p',{},e.cambio))]:[]));
  $('#chips').replaceChildren(...[ETAPAS[e._et].nombre,a?etiqueta(e):null].filter(t=>t&&t!==(a||'')).map(t=>h('li',{},t)));
}
function ajusta(){
  const x=$('#ptx');if(!x||!N)return;
  const k=innerWidth+'x'+innerHeight;if(k===RW)return;RW=k;
  if(innerWidth<=820){TAM=0;x.style.fontSize='';return}
  let t=clamp(Math.round(innerHeight*.03),15,24);
  E.forEach((e,i)=>{llenaTexto(e,i);x.style.fontSize=t+'px';while(t>12&&x.scrollHeight>x.clientHeight+1){t-=1;x.style.fontSize=t+'px'}});
  TAM=t;llenaTexto(E[cur],cur);x.style.fontSize=TAM+'px';
}

/* ---- actividad opcional: vista propia ---- */
function montaActividad(){
  if(!CFG.actividad)return;
  actHost=h('div',{hidden:true});document.body.append(actHost);
  actividadUI(actHost,CFG.actividad);
}
function abreActividad(){
  if(!actHost)return;reproduce(false);
  const b=actHost.querySelector('.lanz .btn');
  if(b){b.click();return}
  const nodos=[...actHost.childNodes];
  const cierra=()=>{ov.remove();document.body.style.overflow='';document.removeEventListener('keydown',esc);nodos.forEach(n=>actHost.append(n));if(bAct)bAct.focus()};
  const esc=e=>{if(e.key==='Escape')cierra()};
  const ov=h('div',{class:'vact',role:'dialog','aria-modal':'true','aria-label':'Actividad'},h('div',{class:'hoja'},...nodos,h('div',{class:'pieact'},h('span',{class:'sp'}),h('button',{class:'btn sec',type:'button',onclick:cierra},'← Volver al recurso'))));
  document.body.append(ov);document.body.style.overflow='hidden';document.addEventListener('keydown',esc);
}
const hayCapa=()=>!!document.querySelector('.vact,.overlay');

/* ---- construcción ---- */
let VP,TR,vw=0,pos=0,pulsoMini=false;
const esc3=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function monta(){
  $('#tt').textContent=CFG.tituloSecuencia||CFG.titulo;
  VP=$('#vp');TR=$('#track');
  if(!N){$('#pn').innerHTML='<div></div><div class="pc"><p class="ptit">Esta línea de tiempo todavía no tiene momentos. Agréguelos en el editor.</p></div>';$('#stage').hidden=true;return}
  const dots=$('#dots');dots.setAttribute('aria-valuemax',N);dots.replaceChildren(...E.map(()=>h('i')));
  let bs='';
  ETAPAS.forEach((et,k)=>{
    const izq=k===0?0:Math.round((E[ETAPAS[k-1].hasta]._x+E[et.desde]._x)/2);
    const der=k===ETAPAS.length-1?W:Math.round((E[et.hasta]._x+E[ETAPAS[k+1].desde]._x)/2);
    const c=E[et.desde]._col;
    bs+='<div class="banda'+(c.c==='#22335D'?' st':'')+'" style="left:'+izq+'px;width:'+(der-izq)+'px;--c:'+c.c+';--cf:'+c.cf+'"><span class="b-et" data-izq="'+izq+'" data-w="'+(der-izq)+'">'+esc3(et.nombre)+'</span></div>';
  });
  let d='';
  if(escala){
    const pasos=[1,2,5,10,25,50,100,200,250,500,1000];const paso=pasos.find(p=>p*pxAnio>=110)||1000;
    for(let y=Math.ceil(Y0/paso)*paso;y<=Y1;y+=paso)d+='<span class="regla" style="left:'+Math.round(fx(y))+'px">'+y+'</span>';
    for(let k=1;k<N;k++){
      if(Y[k].aprox||Y[k-1].aprox)continue;
      const dy=Y[k].y-Y[k-1].y;
      if(dy>0&&(E[k]._x-E[k-1]._x)>=120)d+='<span class="lapso" style="left:'+Math.round((E[k]._x+E[k-1]._x)/2)+'px">'+dy+(dy===1?' año':' años')+'</span>';
    }
  }
  let hs='';
  E.forEach((e,i)=>{
    const lado=i%2===0?'arriba':'abajo';
    hs+='<li class="ev '+lado+'" data-k="'+i+'" style="left:'+Math.round(e._x)+'px;--c:'+e._col.c+'">'
      +'<span class="tallo" aria-hidden="true"></span>'
      +'<button type="button" class="et" tabindex="-1" aria-hidden="true"><b>'+esc3(e.fecha||('Momento '+(i+1)))+'</b><span>'+esc3(e.titulo||'')+'</span></button>'
      +'<button type="button" class="pin" aria-label="'+esc3(etiqueta(e)+(e.titulo?': '+e.titulo:''))+'"></button></li>';
  });
  let m='<div class="vent" id="vent"></div>';
  E.forEach((e,i)=>{m+='<i data-k="'+i+'" style="left:'+(e._x/W*100)+'%;--c:'+e._col.c+'"></i>'});
  TR.style.width=W+'px';
  $('#bandas').innerHTML=bs;$('#detalles').innerHTML=d;$('#evs').innerHTML=hs;$('#mini').innerHTML=m;
  if(escala)$('#stage').setAttribute('aria-label','Línea de tiempo a escala');
  const ctl=$('#pctl');
  ctl.append(
    h('button',{type:'button',class:'bn',id:'ant2',onclick:()=>ir(cur-1,{user:true})},'◂ Anterior'),
    h('button',{type:'button',class:'bp',id:'play','aria-pressed':'false',onclick:()=>reproduce(!playT)},h('span',{class:'pp','aria-hidden':'true'},'▶'),h('span',{id:'pl'},'Reproducir')),
    h('button',{type:'button',class:'bn',id:'sig2',onclick:()=>ir(cur+1,{user:true})},'Siguiente ▸'));
  if(CFG.actividad){
    aviso=h('span',{class:'ahint',id:'ahint'},'Se habilita al ver todos los momentos.');
    bAct=h('button',{type:'button',class:'bp',id:'bAct',onclick:abreActividad,disabled:true,'aria-describedby':'ahint'},'Ir a la actividad →');
    ctl.append(h('span',{class:'sp'}),aviso,bAct);
  }
  eventos();
}

/* ---- movimiento ---- */
function medir(){vw=VP.clientWidth}
const limita=p=>Math.max(0,Math.min(Math.max(0,W-vw),p));
function mover(p,anim){
  pos=limita(p);
  const mn=$('#mini');
  TR.classList.toggle('libre',!anim||REDUCED);mn.classList.toggle('libre',!anim||REDUCED);
  TR.style.transform='translateX('+(-pos)+'px)';
  const v=$('#vent'),mw=mn.clientWidth,ancho=Math.min(1,vw/W)*mw;
  v.style.width=ancho+'px';v.style.transform='translateX('+(pos/W*mw)+'px)';
  $$('.b-et',TR).forEach(et=>{
    const izq=+et.dataset.izq,w=+et.dataset.w;
    et.style.transform='translateX('+Math.max(0,Math.min(w-et.offsetWidth-32,pos-izq+8))+'px)';
  });
}
const centrar=(i,anim)=>mover(E[i]._x-vw/2,anim);
function cercano(){
  const c=pos+vw/2;let mejor=0,md=1e9,perm=-1,mp=1e9;
  E.forEach((e,i)=>{const d=Math.abs(e._x-c);if(d<md){md=d;mejor=i}if(canOpen(i)&&d<mp){mp=d;perm=i}});
  if(!canOpen(mejor)){toast('🔒 Revise primero el momento anterior.');return perm}
  return mejor;
}
const ocultaPista=()=>$('#cue').classList.add('oc');

/* ---- panel del hito ---- */
function pintaPanel(e,i,primero){
  const c=e._col,PN=$('#pn');
  PN.style.setProperty('--c',c.c);PN.style.setProperty('--cf',c.cf);PN.style.setProperty('--soft',rgba(c.c==='#22335D'?'#08A6CB':c.c,.14));
  PN.style.setProperty('--acc',c.c==='#08A6CB'?'#22335D':c.c);
  llenaTexto(e,i);$('#ptx').scrollTop=0;if(TAM)$('#ptx').style.fontSize=TAM+'px';
  const m=$('#med');m.replaceChildren();
  if(e.img){m.setAttribute('aria-label',e.titulo||etiqueta(e));m.append(h('img',{src:e.img,alt:''}))}
  else{m.setAttribute('aria-label','Dibujo geométrico decorativo del momento '+(i+1));m.innerHTML='<svg viewBox="0 0 240 240" aria-hidden="true" focusable="false">'+MOTIVOS[i%MOTIVOS.length]()+'</svg>'}
  PN.classList.remove('ent');if(!primero&&!REDUCED){void PN.offsetWidth;PN.classList.add('ent')}
}
function progreso(){
  $$('#dots i').forEach((el,k)=>{el.dataset.v=vistos.has(k)?'1':'0';el.dataset.c=k===cur?'1':'0'});
  const d=$('#dots');d.setAttribute('aria-valuenow',vistos.size);d.setAttribute('aria-valuetext',vistos.size+' de '+N+' momentos vistos');
  $('#pt').textContent=vistos.size+' de '+N;
  $$('#evs .ev').forEach((el,k)=>{el.dataset.v=vistos.has(k)?'1':'0';el.dataset.lk=canOpen(k)?'0':'1';const p=$('.pin',el);p.setAttribute('aria-disabled',canOpen(k)?'false':'true');if(k===cur)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current')});
  $$('#mini i').forEach((el,k)=>{el.dataset.v=vistos.has(k)?'1':'0';el.dataset.c=k===cur?'1':'0'});
  $('#prev').disabled=$('#ant2').disabled=cur===0;$('#next').disabled=$('#sig2').disabled=cur===N-1;
  const todos=vistos.size===N;
  if(bAct){bAct.disabled=!todos;aviso.hidden=todos}
  if(todos)ovaCompleto();
}
function ir(i,o){
  o=o||{};i=clamp(i,0,N-1);
  if(!canOpen(i)){
    toast('🔒 Revise primero el momento anterior.');
    if(!REDUCED){APP.classList.remove('shake');void APP.offsetWidth;APP.classList.add('shake')}
    centrar(cur,true);return false;
  }
  const cambio=i!==cur||o.forzar||o.inicio;
  cur=i;vistos.add(i);
  centrar(i,!o.inicio);
  if(cambio){pintaPanel(E[i],i,!!o.inicio);if(!o.inicio){anuncia(etiqueta(E[i])+': '+(E[i].titulo||''));ovaUbicacion('hito-'+(i+1))}}
  progreso();
  if(o.user){reproduce(false);ocultaPista()}
  return true;
}
function reproduce(on){
  clearInterval(playT);playT=null;
  const b=$('#play');if(!b)return;
  const was=b.getAttribute('aria-pressed')==='true';
  b.setAttribute('aria-pressed',on?'true':'false');$('#pl').textContent=on?'Pausar':'Reproducir';$('.pp',b).textContent=on?'❚❚':'▶';
  if(on){
    ocultaPista();if(cur>=N-1)ir(0,{});
    playT=setInterval(()=>{if(cur<N-1&&canOpen(cur+1))ir(cur+1,{});else reproduce(false)},6500);
    anuncia('Recorrido iniciado.');
  }else if(was)anuncia('Recorrido en pausa.');
}

/* ---- eventos: arrastre, rueda, minimapa, teclado ---- */
function eventos(){
  let x0=null,pos0=0,movido=false,ruedaT=null;
  const suelta=()=>{if(x0===null)return;const fue=movido;x0=null;VP.classList.remove('arr');if(fue)ir(cercano(),{user:true,forzar:true})};
  VP.addEventListener('pointerdown',e=>{if(e.button>0)return;x0=e.clientX;pos0=pos;movido=false});
  window.addEventListener('pointermove',e=>{
    if(x0===null)return;const dx=e.clientX-x0;
    if(!movido&&Math.abs(dx)>6){movido=true;VP.classList.add('arr');ocultaPista();reproduce(false)}
    if(movido)mover(pos0-dx,false);
  });
  window.addEventListener('pointerup',suelta);window.addEventListener('pointercancel',suelta);
  VP.addEventListener('click',e=>{
    if(movido){movido=false;e.preventDefault();e.stopPropagation();return}
    const ev=e.target.closest&&e.target.closest('.ev');if(ev)ir(+ev.dataset.k,{user:true});
  },true);
  VP.addEventListener('wheel',e=>{
    if(!(Math.abs(e.deltaX)>Math.abs(e.deltaY)||e.shiftKey))return;
    e.preventDefault();ocultaPista();reproduce(false);
    mover(pos+(e.deltaX||e.deltaY),false);
    clearTimeout(ruedaT);ruedaT=setTimeout(()=>ir(cercano(),{user:true,forzar:true}),220);
  },{passive:false});
  const mn=$('#mini');
  const irA=e=>{const r=mn.getBoundingClientRect();mover(clamp((e.clientX-r.left)/r.width,0,1)*W-vw/2,false)};
  mn.addEventListener('pointerdown',e=>{pulsoMini=true;ocultaPista();reproduce(false);irA(e)});
  window.addEventListener('pointermove',e=>{if(pulsoMini)irA(e)});
  window.addEventListener('pointerup',()=>{if(!pulsoMini)return;pulsoMini=false;ir(cercano(),{user:true,forzar:true})});
  $('#prev').addEventListener('click',()=>ir(cur-1,{user:true}));
  $('#next').addEventListener('click',()=>ir(cur+1,{user:true}));
  document.addEventListener('keydown',e=>{
    if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||hayCapa())return;
    const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
    if(e.key==='ArrowRight'){e.preventDefault();ir(cur+1,{user:true})}else if(e.key==='ArrowLeft'){e.preventDefault();ir(cur-1,{user:true})}
    else if(e.key==='Home'&&t===VP){e.preventDefault();ir(0,{user:true})}else if(e.key==='End'&&t===VP){e.preventDefault();ir(N-1,{user:true})}
  });
  if(window.ResizeObserver)new ResizeObserver(()=>{medir();centrar(cur,false);ajusta()}).observe(VP);
  window.addEventListener('resize',()=>{medir();centrar(cur,false);ajusta()});
}
function reiniciar(){
  vistos.clear();(FREE?E.map((_,i)=>i):[0]).forEach(i=>vistos.add(i));reproduce(false);
  if(N){ir(0,{inicio:true});$('#cue').classList.remove('oc')}
  toast('Recurso reiniciado');
}
function ayuda(){
  reproduce(false);
  const li=t=>h('li',{style:'list-style:disc'},t);
  modal('Ayuda',h('ul',{style:'margin:0;padding-left:1.2rem;display:grid;gap:6px'},
    li('Arrastre la línea o pulse un momento: abajo aparece su explicación.'),
    li('El minimapa de la parte inferior sirve para saltar a otra zona de la línea.'),
    li('Anterior y Siguiente, o las flechas del teclado, cambian de momento.'+(LOCK?' Cada momento se habilita al ver el anterior.':'')),
    li('Reproducir recorre los momentos solo; pulse Pausar para detenerlo.'),
    CFG.actividad?li('Al ver todos los momentos se habilita la actividad.'):null));
}
$('#bAyuda').addEventListener('click',ayuda);
$('#bReini').addEventListener('click',reiniciar);
monta();
if(N){medir();ir(0,{inicio:true});ajusta();ovaUbicacion('hito-1');setTimeout(()=>{const c=$('#cue');if(c)c.classList.add('oc')},9000)}
montaActividad();
</script>
