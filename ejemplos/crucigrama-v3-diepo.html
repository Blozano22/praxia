<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crucigrama técnico de didáctica</title>
<!--
  CRUCIGRAMA · DISEÑO 3 «Una pregunta a la vez»
  La pista activa ocupa una tarjeta grande arriba; debajo, un carrusel de fichas para saltar entre pistas y la cuadrícula.
  Al completar se abre un diálogo de cierre sobrio. Un solo archivo, sin recursos externos; colores del tema.
-->
<style>:root{
  --bg:#f2f5f3;--card:#fff;--ink:#14201b;--muted:#56665f;
  --brand:#0f4d3a;--brand2:#0a3328;--brand3:#b8912f;--accent:#c9a227;
  --ok:#1f7a4d;--okbg:#e3f1e9;--bad:#a63a32;--badbg:#f7e6e4;--line:#d6dfda;
  --radius:12px;--shadow:0 1px 2px rgba(10,51,40,.08),0 6px 18px rgba(10,51,40,.07);
  --grad:linear-gradient(90deg,var(--brand2),var(--mid));
  --tint:#e8eeec;--tint2:#eef3f0;--line2:#b9c7c0;--mid:#1f5c47;--accent-light:#e9d9a1;--accent-dark:#b8901f;--accent-soft:#f7f1dc;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--fs:17px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);line-height:1.6;font-size:var(--fs);background:var(--bg);overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 56px}
/* ---- Cabecera institucional ---- */
.hero{position:relative;background:linear-gradient(180deg,var(--brand2),var(--brand));color:#fff;padding:40px 16px 52px;border-bottom:5px solid var(--accent)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 18px);pointer-events:none}
.hero .in{position:relative;max-width:1040px;margin:0 auto;z-index:1}
.tag{display:inline-block;border:1px solid rgba(255,255,255,.45);padding:4px 12px;border-radius:4px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-light)}
.hero h1{margin:.7rem 0 .4rem;font-size:clamp(1.7rem,4.4vw,2.5rem);line-height:1.15;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0;max-width:740px;opacity:.93;font-size:1.08rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.meta span{background:rgba(255,255,255,.1);border-left:3px solid var(--accent);padding:4px 12px;font-size:.85rem}
/* ---- Secciones y tarjetas ---- */
section.sec{margin-top:34px}
h2{font-size:1.4rem;margin:0 0 14px;color:var(--brand2);font-weight:700;display:flex;align-items:center;gap:10px}
h2:before{content:"";width:5px;height:24px;background:var(--accent);flex:none}
h3{margin:.2rem 0 .4rem;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.grid{display:grid;gap:18px}
/* ---- Botones ---- */
.btn{font:inherit;cursor:pointer;border:2px solid var(--brand);border-radius:8px;padding:10px 22px;background:var(--brand);color:#fff;font-weight:600;letter-spacing:.01em;transition:background .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--brand2);border-color:var(--brand2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--brand)}
.btn.sec:hover:not(:disabled){background:var(--tint)}
.btn.warn{background:var(--accent);border-color:var(--accent);color:#1b1500}
.btn.warn:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ---- Retroalimentación ---- */
.fb{border-radius:8px;padding:12px 16px;margin-top:12px;border-left:5px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb.info{background:var(--tint);border-color:var(--brand)}
.fb b:first-child{display:block;margin-bottom:2px}
/* ---- Ventana emergente ---- */
.overlay{position:fixed;inset:0;background:rgba(8,28,22,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:12px;border-top:5px solid var(--accent);max-width:600px;width:100%;max-height:92vh;overflow:auto;padding:24px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal .x{position:absolute;top:10px;right:12px;border:0;background:var(--tint2);border-radius:6px;width:36px;height:36px;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--brand2)}
/* ---- Formularios y barras ---- */
.bar{height:10px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);width:0;transition:width .4s}
textarea,select,input[type=text]{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink)}
textarea:focus,select:focus,input[type=text]:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,77,58,.18)}
textarea{min-height:92px;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:var(--brand)}
label{font-weight:600}
/* ---- Ilustraciones ---- */
.art svg{width:100%;height:auto;display:block;border-radius:8px}
.art img{width:100%;display:block;border-radius:8px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;font-weight:700;font-size:.9rem;flex:none}
.muted{color:var(--muted)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{margin-top:44px;padding:0 16px 34px;text-align:center;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:opacity .15s ease,background-color .15s ease,color .15s ease,border-color .15s ease!important}.btn:active:not(:disabled){transform:none}}
@media print{.hero{background:#fff;color:#000}.btn{display:none}}
@media(max-width:600px){body{font-size:16.5px}.card{padding:16px}.hero{padding:28px 16px 40px}}
/* ---- Interacción obligatoria: bloqueos, avance, avisos ---- */
.gated>:not(.veil){display:none!important}
.gated>.veil{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line2);background:repeating-linear-gradient(135deg,var(--tint2),var(--tint2) 12px,var(--tint) 12px,var(--tint) 24px);border-radius:var(--radius);padding:26px 18px;color:var(--brand2);font-weight:600}
.veil h3{margin:6px 0 4px;font-size:1.15rem}
.veil p{margin:0;font-weight:400;color:var(--muted)}
.unlocked{animation:unl .5s}
@keyframes unl{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brand2);color:#fff;padding:10px 20px;border-radius:8px;border-left:5px solid var(--accent);z-index:90;transition:opacity .5s;max-width:92vw;text-align:center;box-shadow:var(--shadow);font-weight:600}
.toast.out{opacity:0}
.hud{position:fixed;top:12px;right:12px;z-index:60;background:var(--brand2);color:#fff;font-weight:600;font-size:.9rem;padding:6px 14px;border-radius:6px;border-left:4px solid var(--accent);box-shadow:var(--shadow)}
.hud.pop{animation:hudpop .35s}
@keyframes hudpop{50%{transform:scale(1.12)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{font-size:.9rem;color:var(--muted);margin:6px 0 0}
/* Iconos de contenido en tono neutro (evita aspecto infantil) */
.ico,.hot span,.lh .ic,.dot,.stepper li>span,.cust .av,.scn-i{filter:grayscale(1) contrast(1.05)}
/* Ventana emergente compacta: evita desplazamiento */
.modal{max-width:640px;padding:20px 24px;max-height:96vh}
.modal h3{margin:0 40px 8px 0;font-size:1.2rem}
.modal .art svg{height:84px;border-radius:6px}
.modal p{margin:.4rem 0}
.modal .fb{margin-top:8px;padding:10px 14px}
.modal .fb .hint{display:none}
.modal .reto .opt,.modal .opt{padding:8px 14px;margin:5px 0}
.opt:disabled,.reto .opt:disabled{color:var(--ink)}
.modal .row{margin-top:8px!important}
@media(max-height:760px){.modal .art{display:none}}
/* Ventana emergente: encabezado institucional, sin ilustración recortada */
.modal .art{display:none}
.modal h3{background:var(--brand2);color:#fff;margin:-20px -24px 14px;padding:16px 60px 16px 24px;font-size:1.1rem;border-radius:7px 7px 0 0}
.modal .x{background:rgba(255,255,255,.15);color:#fff;top:9px}
.modal .x:hover{background:rgba(255,255,255,.28)}
.modal .opt{border-radius:8px}
.modal .row{justify-content:flex-end}

/* Acordeón de secciones */
section.sec{scroll-margin-top:12px}
.ab[hidden]{display:none}
.ah{display:block;width:100%;font:inherit;text-align:left;cursor:pointer;border:0;background:none;padding:0;color:var(--brand2)}
.ah.open{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:700;margin:0 0 14px}
.ah.open:before{content:'';width:5px;height:24px;background:var(--accent);flex:none}
.ah.lock,.ah.done,.ah.idle{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 18px;border-radius:var(--radius);gap:0}
.ah.lock{border:2px dashed var(--line2);background:repeating-linear-gradient(135deg,var(--tint2),var(--tint2) 12px,var(--tint) 12px,var(--tint) 24px);cursor:not-allowed}
.ah.done{border:2px solid var(--ok);background:var(--okbg)}
.ah.idle{border:2px solid var(--brand);background:#fff}
.ah.done:hover,.ah.idle:hover{filter:brightness(.97)}
.ah .ic{font-size:1.5rem;line-height:1.2}
.ah.done .ic{color:var(--ok);font-weight:800}
.ah.idle .ic{color:var(--brand);font-size:1.1rem}
.ah .tt{font-weight:700;font-size:1.05rem}
.ah .st{font-size:.9rem;color:var(--muted);font-weight:400}

/* Utilidades de la plataforma */
.cl{display:flex;gap:10px;align-items:flex-start;font-weight:400;padding:5px 0}
.cl input{width:22px;height:22px;margin-top:2px;flex:none}
.ah4{margin:16px 0 4px;font-size:1.05rem;color:var(--brand2)}
.pasos2{list-style:none;padding:0;margin:0}
.card.info{border-left:5px solid var(--accent)}
.hero .logo{height:52px;display:block;margin-bottom:10px}
.hero.lisa:before{display:none}
.unlocked{animation:unl .5s}

/* Diseño institucional (tablero de Figma): hoja blanca centrada, encabezado degradado, tarjetas compactas.
   Se aplica después de base.css y solo en los recursos de la plataforma. */
:root{--nav:#13235b;--lime:#d7ff1e;--ins:#d7ff1e;--ink:#1b2a41;--gris:#f1f3f5}
body{background:#e6e9ee;color:var(--ink);line-height:1.55;padding:22px 14px}

/* La hoja: encabezado + contenido forman una sola hoja blanca */
.hero{background:#fff;max-width:1000px;margin:0 auto;padding:22px 24px 0;border-radius:14px 14px 0 0;border:1px solid #e3e7ec;border-bottom:0}
.hero:before{display:none}
.wrap{display:flow-root}
.wrap{background:#fff;max-width:1000px;margin:0 auto;padding:0 24px 26px;border-radius:0 0 14px 14px;border:1px solid #e3e7ec;border-top:0;box-shadow:0 14px 24px -14px rgba(19,35,91,.20)}
.hero .in{position:relative;overflow:hidden;max-width:none;border-radius:12px;padding:20px 26px 22px;color:#fff;
  background:radial-gradient(120% 140% at 50% 130%,rgba(255,255,255,.14),transparent 60%),linear-gradient(100deg,var(--nav) 0%,var(--brand) 100%)}
.hero .in:before,.hero .in:after{content:"";position:absolute;pointer-events:none;border:2px solid rgba(255,255,255,.16);border-radius:22px;transform:rotate(45deg)}
.hero .in:before{width:150px;height:150px;right:-38px;top:-62px}
.hero .in:after{width:96px;height:96px;right:96px;bottom:-58px;border-color:rgba(255,255,255,.10)}
.hero .in>*{position:relative;z-index:1}
.hero .tag{border:0;padding:0;border-radius:0;color:rgba(255,255,255,.9);font-size:.62rem;letter-spacing:.08em;font-weight:600}
.hero h1{margin:.45rem 0 .4rem;font-size:clamp(1.3rem,3.3vw,1.85rem);line-height:1.22;font-weight:800;letter-spacing:-.005em}
.hero p{margin:0;opacity:.95;font-size:.82rem}
.hero .logo{margin-bottom:8px}
.meta{margin-top:12px;gap:6px}
.meta span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 12px;font-size:.7rem;font-weight:600}
footer{max-width:1000px;margin:14px auto 0;color:#6b7686;font-size:.75rem}

/* Títulos, tarjetas, botones */
section.sec{margin-top:22px}
h2{color:var(--brand);font-size:1.15rem;font-weight:800;margin:0 0 10px}
h2:before{display:none}
h3{color:var(--nav)}
.card{border:1px solid #dfe4ea;border-radius:10px;box-shadow:none;padding:16px 18px}
.card.info{background:var(--tint);border-color:var(--line2)}
.card.info b{color:var(--brand)}
.btn{background:var(--nav);border-color:var(--nav);border-radius:7px;font-weight:700;font-size:.8rem;padding:8px 16px}
.btn:hover:not(:disabled){background:#0c1744;border-color:#0c1744}
.btn.sec{background:#fff;color:var(--nav)}
.btn.sec:hover:not(:disabled){background:var(--tint)}
.btn.warn{background:var(--lime);border-color:var(--lime);color:#10240a}
.btn.sm{padding:6px 12px;font-size:.75rem}
:focus-visible{outline:3px solid var(--nav);outline-offset:2px}
.bar{height:6px;border-radius:999px;background:#dfe4ea}
.bar>i{background:linear-gradient(90deg,var(--nav),var(--brand));border-radius:999px}
.toast,.hud{background:var(--nav);border-left-color:var(--lime)}
.modal{border-top-color:var(--lime);border-radius:14px}
textarea:focus,select:focus,input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,107,92,.18)}
input[type=checkbox],input[type=radio]{accent-color:var(--brand)}
.muted{color:#6b7686}
.pt-i{color:var(--brand)}

/* Resto de plantillas heredadas */
.sec2{border:1px solid #dfe4ea!important;box-shadow:none!important;border-radius:8px!important}
.sec2>button.hd{background:#fff!important;color:var(--brand)!important;font-weight:800;font-size:.95rem!important}
.sec2>button.hd .n{background:var(--nav)!important}
.sec2.open{border-color:var(--brand)!important}
.tag2{border-color:var(--brand)!important;color:var(--brand)!important}
@media print{.hero .in{background:#fff;color:#000}.wrap{box-shadow:none}}
@media(max-width:640px){body{padding:10px 6px}.hero{padding:14px 12px 0}.hero .in{padding:16px 16px}.wrap{padding:0 12px 20px}}

/* ---- Actividades: vista propia a hoja completa ---- */
.lanz .tagl{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:1px 10px}
.vact{position:fixed;inset:0;z-index:80;overflow:auto;background:#e6e9ee;padding:20px 12px}
.vact .hoja{max-width:880px;margin:0 auto;background:#fff;border:1px solid #e3e7ec;border-radius:14px;padding:22px 24px;box-shadow:0 10px 30px rgba(19,35,91,.12)}
.vact .cabv{position:relative;overflow:hidden;border-radius:12px;padding:18px 24px 20px;color:#fff;background:radial-gradient(120% 140% at 50% 130%,rgba(255,255,255,.14),transparent 60%),linear-gradient(100deg,var(--nav),var(--brand))}
.vact .cabv .rot{font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.vact .cabv h1{margin:.4rem 0 .35rem;font-size:clamp(1.2rem,3vw,1.7rem);font-weight:800;line-height:1.2}
.vact .cabv .ins{display:flex;gap:8px;align-items:center;margin:8px 0 0;font-size:.74rem;color:var(--ins)}
.vact .cabv .ins svg{width:17px;height:17px;flex:none}
.vact .cuerpov{padding-top:14px}
.vact .tit2{margin:0 0 4px;font-size:1.02rem;color:var(--nav);font-weight:800}
.vact .sub2{margin:0 0 12px;font-size:.76rem;color:#3b4a60}
.vact .pieact{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid #e3e7ec;font-size:.64rem;color:#4a586b}
.vact .pieact .sp{flex:1}
.vact .dos{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.vact .colx h3{margin:0 0 8px;font-size:.86rem;color:var(--nav);font-weight:800}
.vact .fila{display:flex;align-items:center;gap:9px;width:100%;margin-bottom:6px;padding:8px 11px;border:1px solid #dfe3ea;border-radius:7px;background:var(--gris);font:inherit;font-size:.74rem;color:var(--ink);text-align:left;cursor:pointer}
.vact .fila .num{font-weight:800;color:var(--nav);font-size:.7rem;flex:none;min-width:20px}
.vact .fila .tx{flex:1}
.vact .fila .pto{width:18px;height:18px;border-radius:50%;border:1.5px solid #9aa6b8;background:#fff;flex:none;color:#fff;font-size:.58rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.vact .fila:hover{border-color:var(--brand)}
.vact .fila.sel{border-color:var(--brand);background:var(--tint);box-shadow:0 0 0 2px var(--line2)}
.vact .fila.unida{background:#fff}
.vact .fila.ok{border-color:#1f7a4d;background:#e3f1e9}
.vact .fila.mal{border-color:#a63a32;background:#f7e6e4}
.vact .resx{margin:0;font-size:.74rem;font-weight:700;color:var(--nav)}
@media(max-width:700px){.vact .dos{grid-template-columns:1fr}}

/* Clasificación */
.vact .crit{background:var(--gris);border:1px solid #dfe3ea;border-radius:8px;padding:10px 13px;margin-bottom:10px}
.vact .crit b{display:block;font-size:.78rem;color:var(--nav);margin-bottom:3px}
.vact .crit p{margin:0;font-size:.72rem;color:#2b3a50}
.vact .cls{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:start}
.vact .banco h3{margin:0 0 8px;font-size:.84rem;color:var(--nav);font-weight:800}
.vact .banco{display:flex;flex-direction:column;gap:6px;min-height:80px}
.vact .banco .vacio{font-size:.68rem;color:#6b7686;margin:0}
.vact .chip{touch-action:none;user-select:none;display:inline-block;text-align:left;font:inherit;font-size:.7rem;color:var(--ink);background:#fff;border:1px solid #cdd5e0;border-radius:6px;padding:6px 10px;cursor:grab}
.vact .banco .chip{display:block;width:100%}
.vact .chip.sel{border-color:var(--brand);background:var(--tint);box-shadow:0 0 0 2px var(--line2)}
.vact .chip.ok{border-color:#1f7a4d;background:#e3f1e9}
.vact .chip.mal{border-color:#a63a32;background:#f7e6e4}
.vact .zona{background:var(--gris);border:1px solid #dfe3ea;border-radius:8px;padding:10px 12px;margin-bottom:10px}
.vact .zona>b{display:block;font-size:.8rem;color:var(--nav)}
.vact .zona>p{margin:2px 0 7px;font-size:.66rem;color:#4a586b}
.vact .drop{margin-top:7px;border:1.5px dashed #aeb8c8;border-radius:7px;min-height:58px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#fff;color:#6b7686;font-size:.66rem;text-align:center}
.vact .drop.lista{border-color:var(--brand);background:var(--tint2);cursor:pointer}
.vact .drop.sobre{border-color:var(--brand);background:var(--tint)}
@media(max-width:700px){.vact .cls{grid-template-columns:1fr}}

/* Cuestionario */
.vact .opc{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.vact .fila.op .pto{width:18px;height:18px;font-size:.62rem}
.vact .fila.op .pto.cuad{border-radius:4px}
.vact .fbq{margin-top:12px;border-radius:8px;padding:10px 13px;border-left:5px solid}
.vact .fbq b{display:block;font-size:.78rem;margin-bottom:2px}
.vact .fbq p{margin:0;font-size:.7rem;line-height:1.6}
.vact .fbq.ok{background:#e3f1e9;border-color:#1f7a4d}
.vact .fbq.mal{background:#f7e6e4;border-color:#a63a32}
.vact .row.nav{display:flex;align-items:center;gap:10px}
.vact .row.nav .sp{flex:1}
.vact .row.nav .cnt{font-size:.66rem;color:#4a586b}
.vact .nv{display:flex;flex-direction:column;gap:6px;margin-top:10px}

/* Tarea evaluativa */
.vact .sub3{margin:0 0 8px;font-size:.84rem;color:var(--nav);font-weight:800}
.vact .dosv{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px;align-items:start}
.vact .pasosv{display:flex;flex-direction:column;gap:6px}
.vact .pasov{background:var(--gris);border:1px solid #dfe3ea;border-radius:7px;padding:8px 11px}
.vact .pasov b{display:block;font-size:.74rem;color:var(--nav)}

/* SCORM 1.2 sin pantalla: usa la API del aula si existe y una simulación en memoria si no. Registra estado, lugar,
   datos de la sesión y tiempo. No califica. Todo dentro de try/catch: en un iframe aislado no hay API ni localStorage. */
const OVA=(function(){
  let api=null,t0=Date.now(),susp={},hecho=false,tm=null;
  const busca=()=>{try{let w=window,n=0;while(!w.API&&w.parent&&w.parent!==w&&n++<20)w=w.parent;return w.API||null}catch(e){return null}};
  const lee=k=>{try{return api?String(api.LMSGetValue(k)||''):''}catch(e){return ''}};
  const pon=(k,v)=>{try{if(api)api.LMSSetValue(k,String(v))}catch(e){}};
  const p2=n=>String(n).padStart(2,'0');
  const hms=ms=>{const s=Math.floor(ms/1000);return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
  const guarda=()=>{pon('cmi.suspend_data',JSON.stringify(susp).slice(0,4000));pon('cmi.core.session_time',hms(Date.now()-t0));try{if(api)api.LMSCommit('')}catch(e){}};
  const pronto=()=>{clearTimeout(tm);tm=setTimeout(guarda,400)};
  try{
    api=busca();
    if(api){
      api.LMSInitialize('');
      const st=lee('cmi.core.lesson_status');
      if(st===''||st==='not attempted'||st==='unknown')pon('cmi.core.lesson_status','incomplete');else hecho=(st==='completed'||st==='passed');
      try{susp=JSON.parse(lee('cmi.suspend_data')||'{}')||{}}catch(e){susp={}}
    }
  }catch(e){api=null}
  addEventListener('pagehide',()=>{guarda();try{if(api)api.LMSFinish('')}catch(e){}});
  return {
    leer:k=>susp[k],
    guardar:(k,v)=>{susp[k]=v;pronto()},
    ubicacion:l=>{pon('cmi.core.lesson_location',String(l).slice(0,255));pronto()},
    completo:()=>{if(hecho)return;hecho=true;pon('cmi.core.lesson_status','completed');guarda()},
    esCompleto:()=>hecho
  };
})();

  const C=(A.categorias||[]).map(c=>({nombre:c.nombre||'',descripcion:c.descripcion||'',els:String(c.elementos||'').split(/\n+/).map(x=>x.trim()).filter(Boolean)})).filter(c=>c.nombre&&c.els.length);

  for(let i=T.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[T[i],T[j]]=[T[j],T[i]]}
  const pos=T.map(()=>-1);                 // pos[i] = zona asignada (-1 = banco)
  let sel=null,comprobado=false;
  const banco=h('div',{class:'banco'}),zonas=h('div',{class:'zonas'}),res=h('p',{class:'resx'});
  let btn=null;
  const mover=(i,z)=>{if(comprobado)return;pos[i]=z;sel=null;pinta()};
  // Arrastrar y soltar con el puntero: funciona con ratón y con el dedo. Un toque corto sigue siendo «seleccionar».
  let recienArrastrado=false;
  function arrastra(e,i,c){
    if(comprobado||(e.pointerType==='mouse'&&e.button!==0))return;
    const x0=e.clientX,y0=e.clientY;let fan=null,sobre=null;
    const destino=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest('.vact .drop,.vact .banco')};
    const mueve=ev=>{
      if(!fan){if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<6)return;
        const r=c.getBoundingClientRect();fan=c.cloneNode(true);fan.classList.add('fantasma');
        fan.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;margin:0;pointer-events:none;z-index:9999';
        fan.dataset.dx=x0-r.left;fan.dataset.dy=y0-r.top;document.body.append(fan);c.classList.add('origen')}
      ev.preventDefault();
      fan.style.left=(ev.clientX-fan.dataset.dx)+'px';fan.style.top=(ev.clientY-fan.dataset.dy)+'px';
      const d=destino(ev.clientX,ev.clientY);if(d!==sobre){sobre&&sobre.classList.remove('sobre');sobre=d;sobre&&sobre.classList.add('sobre')}
    };
    const fin=ev=>{
      removeEventListener('pointermove',mueve);removeEventListener('pointerup',fin);removeEventListener('pointercancel',fin);
      if(!fan)return;
      fan.remove();c.classList.remove('origen');sobre&&sobre.classList.remove('sobre');
      recienArrastrado=true;setTimeout(()=>{recienArrastrado=false},0);
      const d=ev.type==='pointerup'?destino(ev.clientX,ev.clientY):null;
      if(d)mover(i,d.classList.contains('banco')?-1:Number(d.dataset.z));
    };
    addEventListener('pointermove',mueve,{passive:false});addEventListener('pointerup',fin);addEventListener('pointercancel',fin);
  }
  function chip(i){
    const bien=comprobado&&pos[i]===T[i].ok,mal=comprobado&&pos[i]!==T[i].ok;
    const c=h('button',{type:'button',class:'chip'+(sel===i?' sel':'')+(bien?' ok':'')+(mal?' mal':''),'aria-label':T[i].t,
      onclick:ev=>{ev.stopPropagation();if(comprobado||recienArrastrado)return;if(pos[i]>=0){mover(i,-1);return}sel=(sel===i?null:i);pinta()}},T[i].t);
    c.addEventListener('pointerdown',e=>arrastra(e,i,c));
    return c;
  }
  function pinta(){
    banco.replaceChildren(h('h3',{},'Banco de elementos'));
    const enBanco=T.map((_,i)=>i).filter(i=>pos[i]===-1);
    if(!enBanco.length)banco.append(h('p',{class:'vacio'},'Ya clasificó todos los elementos.'));
    enBanco.forEach(i=>banco.append(chip(i)));
    zonas.replaceChildren(...C.map((c,zi)=>{
      const dentro=T.map((_,i)=>i).filter(i=>pos[i]===zi);
      const drop=h('div',{class:'drop'+(sel!=null?' lista':''),'data-z':zi,onclick:()=>{if(sel!=null)mover(sel,zi)}},
        dentro.length?dentro.map(chip):h('span',{},sel!=null?'Toque aquí para colocar el elemento seleccionado':'Suelte aquí los elementos de esta categoría'));
      return h('div',{class:'zona'},h('b',{},'Zona '+(zi+1)+' · '+c.nombre),c.descripcion?h('p',{},c.descripcion):null,drop);
    }));
    const colocados=pos.filter(p=>p>=0).length;
    res.textContent=comprobado?res.dataset.t:'Elementos clasificados: '+colocados+' de '+T.length;
    if(btn)btn.disabled=comprobado||colocados<T.length;
  }
  btn=h('button',{class:'btn sec',type:'button',onclick:()=>{
    comprobado=true;const bien=T.filter((x,i)=>pos[i]===x.ok).length;
    res.dataset.t=bien===T.length?'¡Excelente! Clasificó correctamente los '+T.length+' elementos.':'Correctos: '+bien+' de '+T.length+'. Los marcados en rojo están en otra zona; reinicie para intentarlo de nuevo.';
    pinta();toast(bien===T.length?'¡Actividad completada!':bien+' de '+T.length+' correctos');
  }},'Comprobar respuestas');
  const reiniciar=()=>{pos.fill(-1);sel=null;comprobado=false;delete res.dataset.t;pinta()};
  const cuerpo=h('div',{},
    h('h2',{class:'tit2'},titulo),
    A.criterio?h('div',{class:'crit'},h('b',{},'Criterio de clasificación'),h('p',{},A.criterio)):null,
    A.enunciado?h('p',{class:'sub2'},A.enunciado):h('p',{class:'sub2'},'Seleccione una tarjeta y elija una zona de destino, o arrástrela. Puede reubicarla si cambia de decisión.'),
    h('div',{class:'cls'},banco,zonas),h('div',{class:'row',style:'margin-top:12px'},btn,res));
  const vista=vistaActividad(CFG.titulo||titulo,ACT_ROT.clasificacion,'Seleccione un elemento y asígnelo a la zona de clasificación. Reubique si es necesario.',cuerpo,reiniciar);
  pinta();
  lanzadorActividad(host,A,titulo,vista);
}

function actividadCuestionario(host,A){
  const Q=(A.preguntas||[]).map(q=>{
    const ops=String(q.opciones||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(t=>({t:t.replace(/\*\s*$/,'').trim(),ok:/\*\s*$/.test(t)}));
    const tipo=/mult/i.test(q.tipo||'')?'multiple':(/^(vf|verdadero|falso)/i.test(q.tipo||'')?'vf':'unica');
    return {tipo,enunciado:q.enunciado||'',ops,retro:q.retro||''};
  }).filter(q=>q.enunciado&&q.ops.length>1);
  const N=Q.length;
  const titulo=A.nombre||'Cuestionario con retroalimentación';
  const ETQ={unica:'Única respuesta',multiple:'Múltiple respuesta',vf:'Verdadero / falso'};
  const resp=Q.map(()=>new Set());const hecha=Q.map(()=>false);
  let cur=0,fin=false;
  const cuerpo=h('div',{});
  function esOk(i){const q=Q[i];const sel=resp[i];return q.ops.every((o,k)=>o.ok===sel.has(k))}
  function pinta(){
    cuerpo.replaceChildren();
    if(fin){
      const bien=Q.filter((_,i)=>esOk(i)).length;
      cuerpo.append(h('h2',{class:'tit2'},'Resultado de la actividad'),
        h('div',{class:'crit'},h('b',{},bien+' de '+N+' respuestas correctas'),h('p',{},bien===N?'¡Excelente! Respondió correctamente todas las preguntas.':'Revise las preguntas marcadas y vuelva a intentarlo para fortalecer su aprendizaje.')),
        h('div',{class:'nv'},...Q.map((q,i)=>h('div',{class:'fila '+(esOk(i)?'ok':'mal')},h('span',{class:'num'},String(i+1).padStart(2,'0')),h('span',{class:'tx'},q.enunciado)))),
        h('div',{class:'row',style:'margin-top:14px'},h('button',{class:'btn',type:'button',onclick:()=>{reiniciar()}},'Volver al inicio')));
      return;
    }
    const q=Q[cur];const ya=hecha[cur];
    cuerpo.append(h('h2',{class:'tit2'},'Pregunta '+(cur+1)+' · '+ETQ[q.tipo]),
      h('div',{class:'crit'},h('b',{},q.enunciado),h('p',{},q.tipo==='multiple'?'Seleccione todas las respuestas que considere correctas.':'Seleccione una respuesta y consulte la explicación antes de continuar.')));
    const lista=h('div',{class:'opc'});
    q.ops.forEach((o,k)=>{
      const sel=resp[cur].has(k);
      const bien=ya&&o.ok,mal=ya&&sel&&!o.ok;
      const b=h('button',{type:'button',class:'fila op'+(sel?' sel':'')+(bien?' ok':'')+(mal?' mal':''),onclick:()=>{
        if(ya)return;
        if(q.tipo==='multiple'){sel?resp[cur].delete(k):resp[cur].add(k)}else{resp[cur].clear();resp[cur].add(k)}
        pinta();
      }},h('span',{class:'num'},String.fromCharCode(65+k)+'.'),h('span',{class:'tx'},o.t),h('span',{class:'pto'+(q.tipo==='multiple'?' cuad':''),style:sel?'background:var(--brand);border-color:var(--brand)':''},sel?'✓':''));
      lista.append(b);
    });
    cuerpo.append(lista);
    if(ya){
      const ok=esOk(cur);
      cuerpo.append(h('div',{class:'fbq '+(ok?'ok':'mal')},h('b',{},ok?'¡Correcto!':'Revise su respuesta'),h('p',{},q.retro||(ok?'Su respuesta coincide con la del guion.':'Las respuestas correctas están marcadas en verde.'))));
    }
    const ant=h('button',{class:'btn sec',type:'button',disabled:cur===0,onclick:()=>{cur--;pinta()}},'← Anterior');
    const comp=h('button',{class:'btn sec',type:'button',disabled:ya||!resp[cur].size,onclick:()=>{hecha[cur]=true;pinta()}},'Comprobar respuesta');
    const ult=cur===N-1;
    const sig=h('button',{class:'btn',type:'button',disabled:!ya,onclick:()=>{if(ult){fin=true}else cur++;pinta()}},ult?'Ver resultado':'Siguiente →');
    cuerpo.append(h('div',{class:'row nav',style:'margin-top:12px'},ant,comp,h('span',{class:'cnt'},(cur+1)+'/'+N),h('span',{class:'sp'}),sig));
  }
  const reiniciar=()=>{resp.forEach(s=>s.clear());hecha.fill(false);cur=0;fin=false;pinta()};
  const vista=vistaActividad(CFG.titulo?titulo+' · '+(CFG.titulo):titulo,ACT_ROT.cuestionario,'Seleccione una respuesta y consulte la explicación antes de continuar.',cuerpo,reiniciar);
  pinta();
  lanzadorActividad(host,A,titulo,vista);
}

function actividadLaboratorio(host,A){
  const titulo=A.nombre||'Laboratorio virtual';
  const lin=s=>String(s||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const ops=s=>lin(s).map(t=>({t:t.replace(/\*\s*$/,'').trim(),ok:/\*\s*$/.test(t)}));

    const w=h('div',{class:'dosv'},h('div',{},sub('Paso 2 · Manipula y compara'),h('p',{class:'sub2'},'Elija cada configuración y observe sus resultados.'),sel,

        E.comparado?h('div',{class:'crit',style:'margin-top:10px'},h('b',{},'Comparación'),h('div',{class:'tabv'},CF.map(x=>h('div',{},h('b',{},x.n),h('span',{},x.ind.map(i=>i.t+': '+i.v+'%').join(' · ')))))):
        h('button',{class:'btn sec',type:'button',style:'margin-top:8px',disabled:E.cfVistas.size<CF.length,onclick:()=>{E.comparado=true;pinta()}},'Comparar configuraciones')));
    if(!E.cfVistas.has(E.cfSel)){E.cfVistas.add(E.cfSel)}

  function p3(){

    return h('div',{},flujo,sub('Paso 3 · Diseña y verifica una acción'),h('p',{class:'sub2'},A.intervPregunta||'Elija la intervención más adecuada.'),

    ['Paso 2','Comparación',[...E.cfVistas].map(k=>CF[k]&&CF[k].n).filter(Boolean).join(', ')||'—',E.comparado?'Comparadas':'Pendiente'],
    ['Paso 3','Intervención',E.iv!=null&&IV[E.iv]?IV[E.iv].t:'—',IV[E.iv]&&IV[E.iv].ok?'Adecuada':'Por revisar']];
  function p4(){

    const t=h('table',{class:'tabreg'},h('thead',{},h('tr',{},['Paso','Etapa','Su elección','Resultado'].map(x=>h('th',{},x)))),h('tbody',{},filas.map(f=>h('tr',{},f.map(x=>h('td',{},x))))));
    return h('div',{},sub('Registro de la experiencia'),t,A.reporte?h('p',{class:'sub2'},A.reporte):null);
  }

  vista=vistaActividad(TIT[0],ACT_ROT.laboratorio,'Observe la situación y complete cada paso del laboratorio.',cuerpo,reiniciar);
  pinta();

<script>

  const pon=b=>{const ok=!LOCK||!!window.__cw;b.disabled=!ok;b.title=ok?'':'Complete el crucigrama para habilitar la actividad'};
  window.__cwGate={abrir(){btns.forEach(pon)}};
  return {tiene:true,abrir,btn(cls,txt,fn){const b=h('button',{type:'button',class:cls,onclick:fn||abrir},txt||'Ir a la actividad →');btns.push(b);pon(b);return b}};
})();
</script>
<script>
hero2();
/* ===== Núcleo del crucigrama: mismo algoritmo de colocación y numeración que la plantilla clásica ===== */
const P=(CFG.palabras||[]).map(p=>({raw:String(p.palabra||'').trim(),w:norm(String(p.palabra||'')).replace(/[^a-z0-9]/g,'').toUpperCase(),clue:p.pista||''})).filter(p=>p.w.length>1);
const K=(r,c)=>r+','+c;
const NS='http://www.w3.org/2000/svg';
const ico=(d,sw)=>{const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width',sw||2.4);s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');s.innerHTML='<path d="'+d+'"/>';return s};
const IC={ok:'M5 12.5l4.5 4.5L19 7.5',izq:'M15 5l-7 7 7 7',der:'M9 5l7 7-7 7',rei:'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5',ojo:'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',cmp:'M4 12.5l5 5L20 6.5'};

function armar(P){
  const placed=[];const cells=new Map();
  const fits=(w,r,c,dir)=>{
    const dr=dir==='v'?1:0,dc=dir==='h'?1:0;let cross=0;
    if(cells.has(K(r-dr,c-dc))||cells.has(K(r+dr*w.length,c+dc*w.length)))return -1;
    for(let i=0;i<w.length;i++){
      const rr=r+dr*i,cc=c+dc*i,ex=cells.get(K(rr,cc));
      if(ex){if(ex!==w[i])return -1;cross++}
      else{if(cells.has(K(rr+dc,cc+dr))||cells.has(K(rr-dc,cc-dr)))return -1}
    }
    return cross;
  };
  const put=(p,r,c,dir)=>{const dr=dir==='v'?1:0,dc=dir==='h'?1:0;for(let i=0;i<p.w.length;i++)cells.set(K(r+dr*i,c+dc*i),p.w[i]);placed.push({...p,r,c,dir})};
  const orden=P.slice().sort((a,b)=>b.w.length-a.w.length);
  const sueltas=[];
  orden.forEach(p=>{
    if(!placed.length){put(p,0,0,'h');return}
    let best=null;
    placed.forEach(q=>{
      for(let i=0;i<q.w.length;i++)for(let j=0;j<p.w.length;j++){
        if(q.w[i]!==p.w[j])continue;
        const dir=q.dir==='h'?'v':'h';
        const r=q.dir==='h'?q.r-j:q.r+i,c=q.dir==='h'?q.c+i:q.c-j;
        const s=fits(p.w,r,c,dir);
        if(s>0&&(!best||s>best.s))best={s,r,c,dir};
      }
    });
    if(best)put(p,best.r,best.c,best.dir);else sueltas.push(p);
  });
  sueltas.forEach(p=>{ /* sin cruce posible: debajo del resto, sin romper nada */
    let maxr=0;cells.forEach((v,k)=>{maxr=Math.max(maxr,+k.split(',')[0])});
    put(p,placed.length?maxr+2:0,0,'h');
  });
  let r0=1e9,c0=1e9,r1=-1e9,c1=-1e9;cells.forEach((v,k)=>{const[r,c]=k.split(',').map(Number);r0=Math.min(r0,r);c0=Math.min(c0,c);r1=Math.max(r1,r);c1=Math.max(c1,c)});
  placed.forEach(p=>{p.r-=r0;p.c-=c0});
  const R=r1-r0+1,C=c1-c0+1;
  const starts=[];placed.slice().sort((a,b)=>a.r-b.r||a.c-b.c).forEach(p=>{let s=starts.find(x=>x.r===p.r&&x.c===p.c);if(!s){s={r:p.r,c:p.c,n:starts.length+1};starts.push(s)}p.n=s.n});
  const letra=new Map();placed.forEach(p=>{for(let i=0;i<p.w.length;i++){letra.set(K(p.r+(p.dir==='v'?i:0),p.c+(p.dir==='h'?i:0)),p.w[i])}});
  return {placed,R,C,letra,starts};
}

/* Confirmación en <dialog> nativo (foco atrapado, Esc cierra) */
function confirmar(titulo,texto,okTxt,fn){
  const prev=document.activeElement;
  const d=h('dialog',{class:'dlg','aria-labelledby':'dlg-t'});
  d.append(h('h3',{id:'dlg-t'},titulo),h('p',{},texto),h('div',{class:'dlg-b'},
    h('button',{class:'bt sec',type:'button',onclick:()=>d.close()},'Cancelar'),
    h('button',{class:'bt',type:'button',onclick:()=>{d.close();fn()}},okTxt)));
  d.addEventListener('close',()=>{d.remove();if(prev&&prev.focus)prev.focus()});
  d.addEventListener('click',e=>{if(e.target===d)d.close()});
  document.body.append(d);d.showModal();
}

function motor(G,H){
  const {placed,R,C,letra,starts}=G;
  H=H||{};
  const orden=[...placed.filter(p=>p.dir==='h').sort((a,b)=>a.n-b.n),...placed.filter(p=>p.dir==='v').sort((a,b)=>a.n-b.n)];
  const el=new Map();
  const grid=h('div',{class:'cw-grid',role:'group','aria-label':'Cuadrícula del crucigrama',style:'grid-template-columns:repeat('+C+',var(--cs,32px));grid-auto-rows:var(--cs,32px)'});
  const live=h('div',{class:'vh',role:'status','aria-live':'polite'});
  const sig=placed.map(p=>p.dir+p.r+p.c+p.w).join('|');
  let cur=null,curK=null,hecho=false,solMostrada=false,sobre=false;
  const cubre=(p,r,c)=>p.dir==='h'?(p.r===r&&c>=p.c&&c<p.c+p.w.length):(p.c===c&&r>=p.r&&r<p.r+p.w.length);
  const kDe=(p,i)=>K(p.r+(p.dir==='v'?i:0),p.c+(p.dir==='h'?i:0));
  const celdasDe=p=>Array.from({length:p.w.length},(_,i)=>el.get(kDe(p,i)));
  const idxEn=(p,k)=>{const x=el.get(k);return p.dir==='h'?x.c-p.c:x.r-p.r};
  const primeraVacia=p=>{const i=celdasDe(p).findIndex(x=>!x.inp.value);return i<0?null:kDe(p,i)};
  const norma=s=>norm(s).replace(/[^a-z0-9]/g,'').toUpperCase();

  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const k=K(r,c);
    if(!letra.has(k)){grid.append(h('div',{class:'cel v','aria-hidden':'true'}));continue}
    const cel=h('div',{class:'cel l'});
    const inp=h('input',{'aria-label':'Fila '+(r+1)+', columna '+(c+1),autocomplete:'off',autocapitalize:'characters',autocorrect:'off',spellcheck:'false',inputmode:'text',tabindex:'-1'});
    const x={cel,inp,r,c,ch:letra.get(k),ws:placed.filter(p=>cubre(p,r,c))};
    el.set(k,x);
    cel.append(inp);
    const s=starts.find(z=>z.r===r&&z.c===c);if(s)cel.append(h('span',{class:'n','aria-hidden':'true'},s.n));
    inp.addEventListener('focus',()=>{
      try{inp.select()}catch(e){}
      const p=(cur&&x.ws.includes(cur))?cur:(x.ws.find(w=>cur&&w.dir===cur.dir)||x.ws[0]);
      if(p!==cur||curK!==k)select(p,k,false);
    });
    inp.addEventListener('pointerdown',()=>{sobre=(curK===k&&document.activeElement===inp)});
    inp.addEventListener('click',()=>{if(sobre&&x.ws.length>1){sobre=false;alterna()}});
    inp.addEventListener('keydown',e=>teclas(e,k));
    inp.addEventListener('input',e=>{
      const multi=e.inputType==='insertFromPaste'||(e.data&&norma(e.data).length>1);
      if(multi&&cur){ /* pegado o texto de varias letras: se reparte por la palabra */
        const txt=norma(e.data||inp.value);inp.value=x.prev||'';
        const i0=idxEn(cur,k);let last=k;
        for(let j=0;j<txt.length&&i0+j<cur.w.length;j++){last=kDe(cur,i0+j);el.get(last).inp.value=txt[j];tras(last)}
        const i=idxEn(cur,last);select(cur,i<cur.w.length-1?kDe(cur,i+1):last,true);return;
      }
      const v=norma(inp.value).slice(-1);inp.value=v;if(v){tras(k);avanza()}else tras(k)
    });
    inp.addEventListener('beforeinput',()=>{x.prev=norma(inp.value).slice(-1)});
    grid.append(cel);
  }

  function select(p,k,foco){
    if(!p)return;
    const prev=cur;
    if(curK&&el.get(curK)){const o=el.get(curK);o.cel.classList.remove('act');o.inp.tabIndex=-1}
    cur=p;curK=k||primeraVacia(p)||K(p.r,p.c);
    el.forEach(x=>x.cel.classList.remove('sel'));
    celdasDe(p).forEach(x=>x.cel.classList.add('sel'));
    const xa=el.get(curK);xa.cel.classList.add('act');xa.inp.tabIndex=0;
    if(p!==prev){
      live.textContent=p.n+' '+(p.dir==='h'?'horizontal':'vertical')+', '+p.w.length+' letras: '+(p.clue||'sin pista');
      H.onSelect&&H.onSelect(p,curK);
    }
    if(foco)xa.inp.focus();
  }
  function alterna(){
    if(!cur)return;const x=el.get(curK);const o=x.ws.find(w=>w!==cur);
    if(o)select(o,curK,true);
  }
  function avanza(){
    if(!cur)return;const i=idxEn(cur,curK);
    if(i<cur.w.length-1)select(cur,kDe(cur,i+1),true);
  }
  function vecino(k,dr,dc){
    const x=el.get(k);let r=x.r+dr,c=x.c+dc;
    while(r>=0&&r<R&&c>=0&&c<C){const kk=K(r,c);if(el.has(kk))return kk;r+=dr;c+=dc}
    return null;
  }
  function paso(d){
    const i=orden.indexOf(cur);const n=orden[(i+d+orden.length)%orden.length];
    select(n,null,true);
  }
  function tras(k){
    const x=el.get(k);
    x.cel.classList.remove('ok','mal','rev');
    x.ws.forEach(w=>{w.ok=false});
    guardar();progreso();
  }
  function escribe(k,ch){const x=el.get(k);x.inp.value=ch;tras(k);avanza()}
  function teclas(e,k){
    if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
    const x=el.get(k),key=e.key;
    const dirs={ArrowLeft:[0,-1,'h'],ArrowRight:[0,1,'h'],ArrowUp:[-1,0,'v'],ArrowDown:[1,0,'v']};
    if(dirs[key]){
      e.preventDefault();const [dr,dc,pref]=dirs[key];const nk=vecino(k,dr,dc);
      if(nk){const nx=el.get(nk);select(nx.ws.find(w=>w.dir===pref)||(nx.ws.includes(cur)?cur:nx.ws[0]),nk,true)}
      return;
    }
    if(key===' '||key==='Spacebar'){e.preventDefault();alterna();return}
    if(key==='Enter'){e.preventDefault();paso(e.shiftKey?-1:1);return}
    if(key==='Tab'){
      const i=orden.indexOf(cur);
      if((e.shiftKey&&i<=0)||(!e.shiftKey&&i>=orden.length-1))return; /* deja salir de la cuadrícula */
      e.preventDefault();paso(e.shiftKey?-1:1);return;
    }
    if(key==='Backspace'){
      e.preventDefault();
      if(x.inp.value){x.inp.value='';tras(k)}
      else if(cur){const i=idxEn(cur,k);if(i>0){const pk=kDe(cur,i-1);select(cur,pk,true);if(el.get(pk).inp.value){el.get(pk).inp.value='';tras(pk)}}}
      return;
    }
    if(key==='Delete'){e.preventDefault();if(x.inp.value){x.inp.value='';tras(k)}return}
    if(key==='Home'&&cur){e.preventDefault();select(cur,kDe(cur,0),true);return}
    if(key==='End'&&cur){e.preventDefault();select(cur,kDe(cur,cur.w.length-1),true);return}
    if(key.length===1){
      const ch=norma(key);e.preventDefault();
      if(ch)escribe(k,ch.slice(-1));
    }
  }

  function progreso(sil){
    let llenas=0,ok=0;
    el.forEach(x=>{const v=x.inp.value;if(v){llenas++;if(v===x.ch)ok++}});
    const total=el.size;
    H.onProgress&&H.onProgress({llenas,ok,total});
    if(total>0&&ok===total){if(!hecho){hecho=true;H.onDone&&H.onDone({silencioso:!!sil,solucion:solMostrada})}}
    else hecho=false;
  }
  function guardar(){const v={};el.forEach((x,k)=>{if(x.inp.value)v[k]=x.inp.value});store('cw',{sig,v})}
  function restaurar(){
    const s=store('cw');if(!s||s.sig!==sig||!s.v)return false;
    for(const k in s.v)if(el.has(k))el.get(k).inp.value=String(s.v[k]).slice(0,1);
    return true;
  }
  function comprobar(){
    let bien=0,vacias=0,mal=0;
    placed.forEach(p=>{p.ok=celdasDe(p).every((x,i)=>x.inp.value===p.w[i]);if(p.ok)bien++});
    el.forEach(x=>{const v=x.inp.value;x.cel.classList.toggle('ok',!!v&&v===x.ch);x.cel.classList.toggle('mal',!!v&&v!==x.ch);if(!v)vacias++;else if(v!==x.ch)mal++});
    const res={bien,total:placed.length,vacias,mal};
    H.onProgress&&progreso();
    H.onCheck&&H.onCheck(res);
    return res;
  }
  function revela(p){
    celdasDe(p).forEach((x,i)=>{x.inp.value=p.w[i];x.cel.classList.remove('mal');x.cel.classList.add('ok','rev')});
    p.ok=true;
  }
  function revelar(p){p=p||cur;if(!p)return;revela(p);guardar();progreso();H.onReveal&&H.onReveal(p)}
  function mostrarSolucion(){solMostrada=true;placed.forEach(revela);guardar();progreso();H.onSolucion&&H.onSolucion()}
  function reiniciar(){
    el.forEach(x=>{x.inp.value='';x.cel.classList.remove('ok','mal','rev')});
    placed.forEach(p=>{p.ok=false});
    solMostrada=false;hecho=false;guardar();progreso();
    H.onReset&&H.onReset();
    if(orden.length)select(orden[0],null,false);
  }
  const GAP=3;
  function fit(box,fijo){
    const cs0=getComputedStyle(box);
    const W=box.clientWidth-parseFloat(cs0.paddingLeft)-parseFloat(cs0.paddingRight);
    const Hh=box.clientHeight-parseFloat(cs0.paddingTop)-parseFloat(cs0.paddingBottom);
    let cs=(W-(C-1)*GAP)/C;
    if(fijo&&Hh>0)cs=Math.min(cs,(Hh-(R-1)*GAP)/R);
    cs=Math.floor(Math.max(fijo?16:28,Math.min(cs,62)));
    grid.style.setProperty('--cs',cs+'px');
    return cs;
  }
  function iniciar(){
    restaurar();
    if(orden.length)select(orden[0],null,false);
    progreso(true);
  }
  return {grid,live,placed,orden,el,R,C,celdasDe,select,fit,iniciar,comprobar,revelar,mostrarSolucion,reiniciar,paso,
    estado:p=>({llena:celdasDe(p).every(x=>x.inp.value),ok:!!p.ok}),
    actual:()=>cur,enFoco:p=>{select(p,null,true)}};
}

(function(){
  if(!P.length){
    $('#app').replaceChildren(h('header',{},$('#hero')),h('div',{class:'vacio'},'Este crucigrama todavía no tiene palabras. Agréguelas en el editor (palabra y pista).'));
    return;
  }
  const G=armar(P);
  const pq=$('#pq'),riel=$('#riel');
  const chips=new Map();let fin=false,llenasAhora=0,zoneFin=null;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const msgEl=h('p',{class:'msg',role:'status','aria-live':'polite'});
  const msg=(t,tipo)=>{msgEl.textContent=t;msgEl.className='msg'+(tipo?' '+tipo:'')};
  const txtDir=d=>d==='h'?'Horizontal':'Vertical';
  const flecha=d=>ico(d==='h'?'M4 12h16M14 6l6 6-6 6':'M12 4v16M6 14l6 6 6-6',2.6);
  const ordenar=()=>[...G.placed.filter(p=>p.dir==='h').sort((a,b)=>a.n-b.n),...G.placed.filter(p=>p.dir==='v').sort((a,b)=>a.n-b.n)];

  let slotsEl=null;
  function pintaSlots(){
    const p=M.actual();if(!p||!slotsEl)return;
    slotsEl.replaceChildren(...M.celdasDe(p).map(x=>h('i',{},x.inp.value||'')));
  }
  function pintaCard(){
    const p=M.actual();pq.replaceChildren();
    if(!p)return;
    const num=h('span',{class:'num','aria-hidden':'true'},String(p.n));
    slotsEl=h('span',{class:'slots','aria-hidden':'true'});
    pq.append(num,
      h('div',{class:'k'},h('span',{class:'dir'},flecha(p.dir),txtDir(p.dir)),h('span',{},p.w.length+' letras'),slotsEl),
      h('p',{class:'t'},p.clue||'(sin pista)'),
      h('div',{class:'nav'},
        h('button',{type:'button',class:'rd','aria-label':'Pista anterior',onclick:()=>M.paso(-1)},ico(IC.izq,2.6)),
        h('button',{type:'button',class:'rd','aria-label':'Pista siguiente',onclick:()=>M.paso(1)},ico(IC.der,2.6))));
    pintaSlots();
  }
  const ord=ordenar();
  ord.forEach((p,i)=>{
    if(i>0&&ord[i-1].dir!==p.dir)riel.append(h('span',{class:'sep','aria-hidden':'true'}));
    const sr=h('span',{class:'vh'});
    const b=h('button',{type:'button',class:'ch','aria-label':p.n+' '+txtDir(p.dir).toLowerCase(),onclick:()=>M.enFoco(p)},
      h('span',{class:'cn'},String(p.n)),h('span',{class:'a','aria-hidden':'true'},p.dir==='h'?'→':'↓'),ico(IC.ok,3.2),sr);
    b.querySelector('svg').setAttribute('class','ck');
    chips.set(p,{b,sr});riel.append(b);
  });

  const M=motor(G,{
    onSelect(p){
      pintaCard();try{ovaUbicacion('p'+p.n+p.dir)}catch(e){}
      chips.forEach((v,q)=>v.b.setAttribute('aria-current',q===p?'true':'false'));
      const b=chips.get(p).b;
      riel.scrollTo({left:b.offsetLeft-(riel.clientWidth-b.offsetWidth)/2,behavior:reduce?'auto':'smooth'});
    },
    onProgress(s){
      llenasAhora=s.llenas;
      $('#pn').textContent=s.llenas;$('#pt').textContent='de '+s.total+' letras';
      $('#pb').style.transform='scaleX('+(s.total?s.llenas/s.total:0)+')';
      chips.forEach((v,p)=>{const e=M.estado(p);v.b.classList.toggle('llena',e.llena&&!e.ok);v.b.classList.toggle('hecha',e.ok);v.sr.textContent=e.ok?' (correcta)':''});
      pintaSlots();
      if(fin&&s.ok<s.total){fin=false;msg('')}
    },
    onCheck(r){
      if(r.bien===r.total)return;
      msg('Palabras correctas: '+r.bien+' de '+r.total+'.'+(r.mal?' Revise las casillas rayadas.':'')+(r.vacias?' Faltan '+r.vacias+' casillas.':''));
    },
    onDone(o){
      fin=true;cwFin();
      if(o.silencioso){msg('Crucigrama completado.','ok');return}
      if(o.solucion){msg('Solución mostrada. Pulse «Reiniciar» para intentarlo de nuevo.','ok');return}
      msg('¡Crucigrama completo! Todas las palabras son correctas.','ok');
      celebra();
    },
    onReveal(p){msg('Palabra revelada: '+p.w+'.')},
    onReset(){fin=false;msg('Crucigrama reiniciado.')}
  });

  function celebra(){
    const prev=document.activeElement;
    const d=h('dialog',{class:'fiesta','aria-labelledby':'f-t'});
    const med=h('div',{class:'medalla','aria-hidden':'true'},ico(IC.ok,3.2));
    d.append(med,h('h2',{id:'f-t'},'¡Crucigrama completo!'),
      h('p',{},'Resolvió las '+G.placed.length+' palabras. Buen trabajo.'),
      h('div',{class:'dlg-b'},
        h('button',{type:'button',class:'bt',onclick:()=>d.close()},'Seguir revisando'),
        ACT.tiene?ACT.btn('bt go','Ir a la actividad →',()=>{d.close();ACT.abrir()}):null,
        h('button',{type:'button',class:'bt sec',onclick:()=>{d.close();M.reiniciar()}},'Reiniciar')));
    d.addEventListener('close',()=>{d.remove();if(prev&&prev.focus)prev.focus()});
    d.addEventListener('click',e=>{if(e.target===d)d.close()});
    document.body.append(d);d.showModal();
  }

  const bt=(txt,ic,cls,fn)=>{const b=h('button',{type:'button',class:'bt'+(cls?' '+cls:''),onclick:fn});if(ic){const i=h('span',{class:'i','aria-hidden':'true'});i.append(ico(ic,2.4));b.append(i)}b.append(txt);return b};
  $('#izq').append(
    bt('Comprobar',IC.cmp,'',()=>M.comprobar()),
    bt('Revelar palabra',IC.ojo,'sec',()=>M.revelar()),
    bt('Reiniciar',IC.rei,'sec',()=>{if(llenasAhora)confirmar('¿Reiniciar el crucigrama?','Se borrarán todas las letras que escribió.','Reiniciar',()=>M.reiniciar());else M.reiniciar()}),
    ACT.btn('bt go'),
    h('button',{type:'button',class:'link',onclick:()=>confirmar('¿Mostrar la solución?','Se completarán todas las palabras. Podrá reiniciar para volver a intentarlo.','Mostrar solución',()=>M.mostrarSolucion())},'Mostrar solución'));
  const sub=CFG.tituloCrucigrama&&CFG.tituloCrucigrama!==CFG.titulo?CFG.tituloCrucigrama:'';
  $('#der').append(
    sub?h('p',{class:'sub'},sub):null,
    h('div',{class:'prog'},h('b',{id:'pn'},'0'),h('span',{id:'pt'},'letras')),
    h('div',{class:'barra','aria-hidden':'true'},h('i',{id:'pb'})),
    msgEl,
    h('p',{class:'ayuda'},CFG.instruccion||'Elija una ficha o toque una casilla y escriba. Toque de nuevo la casilla (o pulse Espacio) para cambiar de dirección.'),
    CFG.nota?h('p',{class:'ayuda'},CFG.nota):null);

  $('#tablero').append(M.grid,M.live);
  const mq=matchMedia('(min-width:900px) and (min-height:520px)');
  const ajusta=()=>M.fit($('#tablero'),mq.matches);
  if(window.ResizeObserver)new ResizeObserver(ajusta).observe($('#tablero'));
  addEventListener('resize',ajusta);ajusta();
  M.iniciar();
  ajusta();
})();
</script>
</body>
</html>
