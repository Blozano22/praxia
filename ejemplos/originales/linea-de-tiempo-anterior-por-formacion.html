<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Historia de la estadística: una línea de tiempo por años</title>
<!--
  PLANTILLA OVA · LÍNEA DE TIEMPO POR AÑOS · SCORM 1.2
  Ficha de la plantilla (para el registro de plantillas):
  - Cuándo usarla: contenido que se cuenta como secuencia de años o hitos fechados (5 a 12 hitos), con un texto corto por hito.
  - Cuándo NO usarla: procesos sin fechas, comparaciones, contenido numérico o actividades con calificación.
  - Qué hace: línea de tiempo animada; el año se muestra en un cuentakilómetros, el color de la pantalla cambia por hito
    (inundación radial), cada hito tiene un motivo animado, la línea inferior se arrastra y hay reproducción con pausa.
    Registra estado (completado al visitar todos los años), tiempo y avance en Moodle (SCORM 1.2). No califica.
  - Contenido: todo sale del bloque JSON #ova-content (meta, quote, nodes[]: año, textos, motivo). Los colores no van en el JSON:
    salen de la paleta DIEPO del nivel de formación (meta.nivel, o ?nivel=... en la dirección) y se alternan por hito.
  - Motivos disponibles: tablilla, dados, barras, estado, parcelas, regresion, correlacion, chi, calor.
  - Diseño: campos de color planos (flat) con la paleta DIEPO del nivel (base y oscuro del nivel, blanco) y el cian o el gris como resalte (sin lima).
  - Un solo archivo, sin recursos externos (numeral 4.6 de las especificaciones técnicas).
  - Escudo: reemplazar el marcador por el archivo autorizado.
-->
<style>
:root{
  /* Paleta DIEPO: estos valores son los de Tecnología; el script los reemplaza según el nivel (ver NIVELES). */
  --bg:#FFFFFF; --fg:#142749; --on:#FFFFFF; --acc:#00665F; --soft:rgba(20,39,73,.08);
  --paper:#FFFFFF; --text:#142749; --muted:rgba(20,39,73,.72); --line:#C8C8C8; --ink:#142749; --nivel:#00665F;
  /* Tipografía provisional: se reemplaza cuando COEST/GEVIP confirmen la fuente oficial */
  --font:'Century Gothic','CenturyGothic','Apple Gothic','Futura','Avenir Next','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;font-family:var(--font);background:var(--ink);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.paper :focus-visible,dialog :focus-visible{outline-color:var(--ink)}
h2[tabindex="-1"]:focus,#modal-title:focus,.stage:focus{outline:none}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:.75rem;top:-4rem;background:var(--ink);color:#fff;padding:.6rem 1rem;z-index:100;border-radius:999px;font-weight:700}
.skip:focus{top:.75rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Lienzo ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);color:var(--fg);overflow:hidden;transition:color .35s var(--ease)}
.flood{position:absolute;width:40px;height:40px;border-radius:50%;pointer-events:none;will-change:transform}
.layers{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.layer{position:absolute;border-radius:50%;background:var(--soft);transition:transform 1.5s var(--ease),background-color .4s var(--ease)}
.l1{width:78vh;height:78vh;right:-14vh;top:-20vh;transform:translateX(calc(var(--i,0) * -2.4vw))}
.l2{width:44vh;height:44vh;left:42%;bottom:-18vh;transform:translateX(calc(var(--i,0) * 3.2vw))}
.l3{width:20vh;height:20vh;right:7%;bottom:24%;background:none;border:3px solid currentColor;opacity:.2;transform:translateX(calc(var(--i,0) * -1.6vw))}
.tape{position:absolute;left:2vw;top:48%;white-space:nowrap;font-size:34vh;line-height:1;font-weight:700;letter-spacing:.01em;color:transparent;-webkit-text-stroke:2px currentColor;opacity:.1;transform:translate(calc(var(--i,0) * -10vw),-58%);transition:transform 1.7s var(--ease)}
.tape span{margin-right:.5em}

/* ---------- Cabecera ---------- */
.top{position:relative;z-index:3;display:flex;align-items:center;gap:1rem;padding:.7rem clamp(1rem,3.4vw,2.8rem)}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0;flex:1 1 auto}
.escudo{width:40px;height:40px;flex:none;opacity:.85}
.crumb{line-height:1.2;min-width:0;font-size:.85rem}
.crumb strong{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:.6rem;font-size:.88rem;font-weight:700;white-space:nowrap}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;transition:background .3s var(--ease),transform .3s var(--ease)}
.dots i[data-v="1"]{background:currentColor}
.dots i[data-c="1"]{transform:scale(1.35)}
.tools{display:flex;gap:.5rem;flex:none}
.btn-ln,.pill{font:inherit;font-weight:700;min-height:44px;padding:.35rem 1.2rem;border-radius:999px;cursor:pointer;border:2px solid var(--fg);transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}
.btn-ln{background:transparent;color:inherit}
.btn-ln:hover,.pill:hover{background:var(--fg);color:var(--on)}
.pill{background:var(--fg);color:var(--on)}
.pill:hover{background:transparent;color:var(--fg)}
.btn-ln:active,.pill:active{transform:scale(.96)}
.pill:disabled,.btn-ln:disabled{opacity:.35;cursor:not-allowed;transform:none}
.pill .pp{display:inline-block;width:1.1em;text-align:center;margin-right:.4em}
.tools .ico{display:none}
@media (max-width:760px){.tools .lbl{display:none}.tools .ico{display:inline}.crumb{display:none}.dots{display:none}}

/* ---------- Escena ---------- */
.stage{position:relative;z-index:2;min-height:0;padding:0 clamp(1.2rem,4.4vw,3.6rem);overflow:auto}
.scene{min-height:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(1rem,3vw,3rem);align-items:center}
.copy{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.yr{font-size:min(15.5vw,23vh);margin-top:.15rem;font-weight:700;letter-spacing:-.055em;line-height:1;height:1em;display:flex;align-items:flex-end;font-variant-numeric:tabular-nums;margin-left:-.04em}
.yr-num{display:flex;height:1em}
.yr-num[hidden],.yr-txt[hidden]{display:none}
.col{display:block;width:.67em;height:1em;overflow:hidden;position:relative}
.reel{display:block;transform:translateY(calc(var(--d,0) * -1em));transition:transform 1.25s cubic-bezier(.16,.84,.24,1);transition-delay:calc(var(--c,0) * 90ms)}
.reel span{display:block;height:1em;line-height:1;text-align:center}
.yr-txt{display:inline-block;white-space:nowrap}
.yr-txt.in{animation:slideUp .9s var(--ease) both}
.yr[data-mode="txt"]{font-size:min(12vw,20vh);letter-spacing:-.05em}
@keyframes slideUp{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.ev-title{font-size:clamp(1.55rem,3.1vw,2.7rem);font-weight:700;letter-spacing:-.035em;line-height:1.04;text-wrap:balance;max-width:30ch}
.ev-text{font-size:clamp(1rem,1.25vw,1.18rem);line-height:1.58;max-width:54ch}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chips li{border:2px solid currentColor;border-radius:999px;padding:.05rem .85rem;font-weight:700;font-size:.9rem}
.ev-actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.2rem}
.scene.enter .copy>*{animation:rise .75s var(--ease) both;animation-delay:calc(var(--k,0) * 90ms + 320ms)}
.scene.enter .medal{animation:medalIn .9s var(--ease) 320ms both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes medalIn{from{opacity:0;transform:scale(.82) rotate(-6deg)}to{opacity:1;transform:none}}
.medal{justify-self:center;width:min(100%,min(46vh,400px));aspect-ratio:1;border-radius:50%;background:var(--soft);position:relative;display:grid;place-items:center;transition:background-color .4s var(--ease)}
.medal::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px dashed currentColor;opacity:.4}
.medal svg{width:84%;height:84%;overflow:visible}
@media (max-width:1100px){.scene{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
@media (max-width:820px){.scene{grid-template-columns:1fr;align-content:start;padding-top:.5rem}.medal{display:none}.yr{font-size:min(26vw,20vh)}}

/* animaciones de los motivos */
@media (prefers-reduced-motion:no-preference){
  .m-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:mdraw 1.1s var(--ease) calc(var(--dl,0ms) + 320ms) forwards}
  .m-pop{transform-box:fill-box;transform-origin:center;animation:mpop .65s var(--ease) calc(var(--dl,0ms) + 320ms) both}
  .m-grow{transform-box:fill-box;transform-origin:bottom;animation:mgrow .85s var(--ease) calc(var(--dl,0ms) + 320ms) both}
  .m-fade{animation:mfade .7s var(--ease) calc(var(--dl,0ms) + 320ms) both}
  .m-pulse{transform-box:fill-box;transform-origin:center;animation:mpulse 2.4s ease-out 1.5s infinite}
}
@keyframes mdraw{to{stroke-dashoffset:0}}
@keyframes mpop{from{transform:scale(0) rotate(-24deg);opacity:0}to{transform:none;opacity:1}}
@keyframes mgrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}

/* ---------- Línea inferior ---------- */
.ribbon{position:relative;z-index:3;padding:.2rem clamp(1.2rem,4.4vw,3.6rem) calc(.8rem + env(safe-area-inset-bottom,0px))}
.rb{--n:9;position:relative;padding-top:1.6rem;touch-action:pan-y}
.rb-track{position:absolute;left:calc(100% / (2 * var(--n)));right:calc(100% / (2 * var(--n)));top:calc(1.6rem + 20px);height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.rb-fill{position:absolute;inset:0;background:var(--fg);transform-origin:left center;transform:scaleX(var(--p,0));transition:transform 1s var(--ease)}
.rb-head{position:absolute;top:1.6rem;left:0;width:calc(100% / var(--n));height:44px;display:flex;align-items:center;justify-content:center;transform:translateX(calc(var(--hi,0) * 100%));transition:transform 1s var(--ease);pointer-events:none;z-index:1}
.rb.dragging .rb-head,.rb.dragging .rb-fill{transition:none}
.rb-head span{width:28px;height:28px;border-radius:50%;background:var(--fg);position:relative}
.rb-head span::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--fg);opacity:.5}
@media (prefers-reduced-motion:no-preference){.rb-head span::after{animation:ring 2.4s ease-out infinite}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.rb-scrub{position:absolute;left:0;right:0;top:calc(1.6rem - 8px);height:60px;cursor:ew-resize;z-index:2;touch-action:none}
.rb-nodes{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));position:relative}
.rb-nodes li{position:relative}
.rb-node{display:flex;flex-direction:column;align-items:center;gap:.3rem;width:100%;min-height:44px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:.15rem 0 .1rem;position:relative;z-index:1}
.rb-node .dot{width:16px;height:16px;border-radius:50%;border:3px solid currentColor;background:var(--bg);margin-top:12px;transition:background .3s var(--ease),transform .3s var(--ease)}
.rb-node[data-v="1"] .dot{background:currentColor}
.rb-node[aria-current="step"] .dot{opacity:0}
.rb-node .yl{font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:.2rem;transition:transform .35s var(--ease)}
.rb-node[aria-current="step"] .yl{transform:scale(1.18)}
.rb-node:hover .dot{transform:scale(1.25)}
.gap{position:absolute;left:100%;top:-1.5rem;transform:translateX(-50%);font-size:.78rem;font-weight:700;opacity:.85;white-space:nowrap;pointer-events:none}
.rb-ctl{display:flex;justify-content:center;align-items:center;gap:.8rem;margin-top:.3rem;flex-wrap:wrap}
.hint{font-size:.88rem;opacity:.9;max-width:46ch;text-align:right}
@media (max-width:760px){.rb-node .yl{font-size:.7rem}.gap{display:none}.hint{display:none}}
@media (max-height:640px){
  .yr{font-size:min(15.5vw,17vh)}
  .ev-title{font-size:clamp(1.3rem,2.3vw,1.9rem)}
  .ev-text{font-size:.93rem;line-height:1.45}
  .rb{padding-top:1.3rem}
  .rb-track{top:calc(1.3rem + 20px)}
  .rb-head{top:1.3rem}
}
@media (max-height:700px){
  .yr{font-size:min(15.5vw,19.5vh)}
  .ev-title{font-size:clamp(1.4rem,2.6vw,2.25rem)}
  .ev-text{font-size:.98rem;line-height:1.5}
  .chips li{font-size:.84rem}
  .copy{gap:.5rem}
  .ev-text{max-width:60ch}
  .medal{width:min(100%,min(40vh,340px))}
  .top{padding-top:.4rem;padding-bottom:.4rem}
  .escudo{width:34px;height:34px}
  .rb-ctl .pill,.rb-ctl .btn-ln{min-height:42px}
}

/* ---------- Ventanas emergentes ---------- */
dialog{border:0;padding:0;border-radius:28px;width:min(620px,94vw);max-width:94vw;background:var(--paper);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog[open]{animation:dlgIn .5s var(--ease)}
@keyframes dlgIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
dialog::backdrop{background:color-mix(in srgb,var(--ink) 55%,transparent);backdrop-filter:blur(6px)}
.modal-in{display:flex;flex-direction:column;max-height:88vh;max-height:88dvh}
.modal-head{background:var(--bg);color:var(--fg);padding:1rem 1.3rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.modal-head h2{font-size:1.3rem;letter-spacing:-.02em}
.modal-head .btn-ln{min-height:40px;padding:.15rem 1rem;border-color:var(--fg)}
.modal-head .btn-ln:hover{background:var(--fg);color:var(--on)}
.modal-body{padding:1.1rem 1.3rem 1.4rem;overflow:auto;display:flex;flex-direction:column;gap:.8rem}
.modal-body .pill{align-self:flex-start}
.modal-body ul.bul{list-style:disc;padding-left:1.2rem;display:grid;gap:.35rem}
.bl{display:grid;gap:.1rem}
.bl li{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.7rem;padding:.4rem 0;border-top:1px solid var(--line);line-height:1.35}
.bl li:first-child{border-top:0}
.bl b{font-variant-numeric:tabular-nums}
.quote{font-size:1.6rem;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.tech table{border-collapse:collapse;width:100%;font-size:.88rem}
.tech th,.tech td{padding:.3rem .6rem;border-top:1px solid var(--line);text-align:left;word-break:break-all}
.tech th{width:36%}
.tech pre{margin:.4rem 0 0;max-height:150px;overflow:auto;background:var(--ink);color:#C8C8C8;padding:.6rem;border-radius:10px;font-size:.8rem;white-space:pre-wrap}
details.tech summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.toast{position:absolute;left:50%;top:4.6rem;transform:translateX(-50%);z-index:5;background:var(--fg);color:var(--on);padding:.4rem 1.2rem;border-radius:999px;font-weight:700;animation:toast .6s var(--ease) both}
.toast[hidden]{display:none}
@keyframes toast{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translateX(-50%)}}
.pillnote{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:6;background:var(--ink);color:#fff;padding:.15rem 1rem;border-radius:0 0 14px 14px;font-weight:700;font-size:.82rem;white-space:nowrap}
</style>
</head>
<body>
<a class="skip" href="#stage">Saltar al contenido</a>
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<h1 class="sr-only" id="h1"></h1>

<div class="app" id="app">
  <div class="layers" aria-hidden="true">
    <div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div>
    <div class="tape" id="tape"></div>
  </div>

  <header class="top">
    <div class="brand">
      <!-- Reemplazar por <img src="escudo.png" alt="Escudo de la Policía Nacional de Colombia"> con el archivo autorizado -->
      <svg class="escudo" viewBox="0 0 64 64" role="img" aria-label="Espacio reservado para el escudo oficial de la Policía Nacional">
        <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="32" y="30" text-anchor="middle" font-size="9" fill="currentColor" font-family="sans-serif">Escudo</text>
        <text x="32" y="41" text-anchor="middle" font-size="9" fill="currentColor" font-family="sans-serif">oficial</text>
      </svg>
      <p class="crumb"><strong id="crumb-course"></strong><span id="crumb-unit"></span></p>
    </div>
    <span id="vista-previa" class="pillnote" role="note" hidden>Vista previa sin aula<span class="sr-only">: el avance se guarda solo en este navegador.</span></span>
    <div class="prog">
      <div class="dots" id="dots" role="progressbar" aria-label="Años visitados" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0"></div>
      <span id="prog-text">0 de 9</span>
    </div>
    <div class="tools" role="group" aria-label="Ayuda y sesión">
      <button type="button" class="btn-ln" data-modal="help" aria-label="Ayuda"><span class="lbl">Ayuda</span><span class="ico" aria-hidden="true">?</span></button>
      <button type="button" class="btn-ln" data-modal="exit" aria-label="Guardar y salir"><span class="lbl">Guardar y salir</span><span class="ico" aria-hidden="true">⏻</span></button>
    </div>
  </header>
  <div id="cerrada" class="pillnote" role="alert" hidden style="top:auto;bottom:0;border-radius:14px 14px 0 0">Sesión cerrada: los cambios nuevos no se guardan. Abre el recurso de nuevo desde el aula.</div>
  <div id="toast" class="toast" role="status" hidden>Recorrido completo</div>

  <main class="stage" id="stage" tabindex="-1">
    <section class="scene enter" id="scene" aria-labelledby="ev-title">
      <div class="copy">
        <div class="yr" id="yr" aria-hidden="true" data-mode="num">
          <div class="yr-num" id="yr-num"></div>
          <div class="yr-txt" id="yr-txt" hidden></div>
        </div>
        <h2 class="ev-title" id="ev-title" tabindex="-1" style="--k:1"></h2>
        <p class="ev-text" id="ev-text" style="--k:2"></p>
        <ul class="chips" id="ev-chips" aria-label="Temas" style="--k:3"></ul>
        <div class="ev-actions" style="--k:4"><button type="button" class="pill" id="ev-more">Más detalle</button><button type="button" class="btn-ln" id="ev-quote" hidden>Una idea para llevar</button></div>
      </div>
      <div class="medal" id="medal" role="img" aria-label=""></div>
    </section>
  </main>

  <nav class="ribbon" aria-label="Línea de tiempo por años">
    <div class="rb" id="rb">
      <div class="rb-track" aria-hidden="true"><div class="rb-fill" id="rb-fill"></div></div>
      <div class="rb-head" id="rb-head" aria-hidden="true"><span></span></div>
      <div class="rb-scrub" id="rb-scrub" aria-hidden="true"></div>
      <ol class="rb-nodes" id="rb-nodes"></ol>
    </div>
    <div class="rb-ctl">
      <span class="hint">Pulsa un año, arrastra la línea o reproduce el viaje.</span>
      <button type="button" class="btn-ln" id="prev">Año anterior</button>
      <button type="button" class="pill" id="play" aria-pressed="false" data-play-ms="7000"><span class="pp" aria-hidden="true">▶</span><span id="play-t">Reproducir viaje</span></button>
      <button type="button" class="btn-ln" id="next">Año siguiente</button>
    </div>
  </nav>
</div>

<dialog id="modal" aria-labelledby="modal-title">
  <div class="modal-in">
    <div class="modal-head"><h2 id="modal-title" tabindex="-1"></h2><button type="button" class="btn-ln" id="modal-close">Cerrar</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</dialog>

 },
 "nodes": [

var Scorm=(function(){
  var api=null,mock=false,initialized=false,finished=false,start=Date.now(),icount=0,log=[],listener=null;
  function findAPI(win){
    var tries=0;
    try{ while(win.API==null&&win.parent!=null&&win.parent!==win){ tries++; if(tries>500)return null; win=win.parent; } return win.API||null; }
    catch(e){ return null; }
  }
  function createMock(){
    var store={}; try{store=JSON.parse(localStorage.getItem(CONFIG.storageKey)||'{}');}catch(e){}
    var err='0';
    var defaults={'cmi.core.student_name':'Estudiante, Demo','cmi.core.student_id':'demo-001','cmi.core.lesson_mode':'normal','cmi.core.credit':'credit','cmi.launch_data':'','cmi.core.lesson_status':'not attempted','cmi.core.lesson_location':'','cmi.suspend_data':''};
    function persist(){try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(store));}catch(e){}}
    return {
      LMSInitialize:function(){err='0';return 'true';},
      LMSFinish:function(){persist();err='0';return 'true';},
      LMSGetValue:function(k){err='0';
        if(k==='cmi.core.entry')return store['cmi.core.lesson_status']?'resume':'ab-initio';
        if(k==='cmi.interactions._count')return String(store.__ic||0);
        if(Object.prototype.hasOwnProperty.call(store,k))return store[k];
        if(Object.prototype.hasOwnProperty.call(defaults,k))return defaults[k];
        return '';},
      LMSSetValue:function(k,v){err='0';store[k]=String(v);
        var mt=/^cmi\.interactions\.(\d+)\.id$/.exec(k); if(mt){store.__ic=Math.max(store.__ic||0,parseInt(mt[1],10)+1);}
        return 'true';},
      LMSCommit:function(){persist();err='0';return 'true';},
      LMSGetLastError:function(){return err;},LMSGetErrorString:function(){return '';},LMSGetDiagnostic:function(){return '';}
    };
  }
  function note(fn,k,v,r){ log.push({fn:fn,k:k,v:v,r:r}); if(log.length>60)log.shift(); if(listener)listener(); }
  function init(){
    api=findAPI(window);
    if(!api){ try{ if(window.opener&&!window.opener.closed)api=findAPI(window.opener); }catch(e){} }
    if(!api){ api=createMock(); mock=true; }
    var r=String(api.LMSInitialize(''));
    initialized=(r==='true'); note('LMSInitialize','""','',r);
    icount=parseInt(get('cmi.interactions._count'),10)||0;
    return initialized;
  }
  function get(k){ if(!api)return ''; var r=String(api.LMSGetValue(k)); note('LMSGetValue',k,'',r); return r; }
  function set(k,v){ if(!api||finished)return 'false'; var r=String(api.LMSSetValue(k,String(v))); note('LMSSetValue',k,String(v),r); return r; }
  function commit(){ if(!api||finished)return 'false'; var r=String(api.LMSCommit('')); note('LMSCommit','""','',r); return r; }
  function timeSpan(ms){ var s=Math.floor(ms/1000); return pad(Math.floor(s/3600),4)+':'+pad(Math.floor((s%3600)/60),2)+':'+pad(s%60,2)+'.00'; }
  function clock(){ var d=new Date(); return pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)+':'+pad(d.getSeconds(),2); }
  function terminate(exitValue){
    if(finished||!initialized)return;
    set('cmi.core.session_time',timeSpan(Date.now()-start));
    if(exitValue!==undefined)set('cmi.core.exit',exitValue);
    commit(); var r=String(api.LMSFinish('')); note('LMSFinish','""','',r); finished=true;
  }
  return {init:init,get:get,set:set,commit:commit,terminate:terminate,clock:clock,timeSpan:timeSpan,
    isMock:function(){return mock;},isFinished:function(){return finished;},
    elapsed:function(){return Date.now()-start;},
    nextInteraction:function(){return icount++;},
    getLog:function(){return log;},onLog:function(f){listener=f;}};
})();

    var strong=[[138,172],[148,162],[158,146],[168,130],[178,116],[188,98],[198,88],[208,70]];
    var s='<path class="m-fade" d="M24 40V180H112M126 40V180H220" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
    weak.forEach(function(p,k){ s+='<circle class="m-pop" style="--dl:'+(200+k*70)+'ms" cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="currentColor"/>'; });
    strong.forEach(function(p,k){ s+='<circle class="m-pop" style="--dl:'+(600+k*70)+'ms" cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="var(--acc)" stroke="currentColor" stroke-width="2"/>'; });
    return s+'<text class="m-fade" style="--dl:900ms" x="68" y="212" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">débil</text><text class="m-fade" style="--dl:1100ms" x="172" y="212" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">fuerte</text>'; },
  chi:function(){
    var hs=[34,76,118,92,58,30], s='<line class="m-fade" x1="26" y1="196" x2="216" y2="196" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>';
    hs.forEach(function(h,k){ s+='<rect class="m-grow" style="--dl:'+(150+k*100)+'ms" x="'+(40+k*30)+'" y="'+(196-h)+'" width="24" height="'+h+'" rx="5" fill="var(--soft)" stroke="currentColor" stroke-width="4"/>'; });
    return s+'<path class="m-draw" pathLength="1" style="--dl:900ms" d="M32 190 C60 186 70 90 108 84 C150 78 160 170 212 190" fill="none" stroke="var(--acc)" stroke-width="7" stroke-linecap="round"/>'; },
  calor:function(){
    var s='',c,r,hx=5,hy=2;
    for(r=0;r<6;r++)for(c=0;c<8;c++){ var d=Math.hypot(c-hx,(r-hy)*1.2), o=Math.max(.12,1-d/4.2); s+='<rect class="m-pop" style="--dl:'+Math.round(d*90)+'ms" x="'+(14+c*27)+'" y="'+(40+r*27)+'" width="23" height="23" rx="6" fill="var(--acc)" fill-opacity="'+o.toFixed(2)+'" stroke="currentColor" stroke-opacity=".35" stroke-width="2"/>'; }
    var px=14+hx*27+11.5, py=40+hy*27+11.5;
    return s+'<circle class="m-pulse" cx="'+px+'" cy="'+py+'" r="12" fill="none" stroke="currentColor" stroke-width="4"/><circle class="m-pop" style="--dl:900ms" cx="'+px+'" cy="'+py+'" r="9" fill="#fff" stroke="currentColor" stroke-width="4"/>'; }
};

/* ================= ESCENA ================= */
function renderScene(n,opts){
  var y=nodeYear(n);
  $('#ev-title').innerHTML='<span class="sr-only">'+(n.hoy?'Hoy, '+NOW:(y?'Año '+y:n.yearLabel))+'. </span>'+n.title;
  $('#ev-text').textContent=n.text;
  $('#ev-chips').innerHTML=[n.era].concat(n.themes).map(function(t){return '<li>'+t+'</li>';}).join('');
  $('#ev-quote').hidden=(n.id!==NODES[N-1].id);
  var m=$('#medal'); m.setAttribute('aria-label',n.alt); m.innerHTML='<svg viewBox="0 0 240 240" aria-hidden="true" focusable="false">'+MOTIFS[n.motif]()+'</svg>';
  var sc=$('#scene'); sc.classList.remove('enter'); if(!opts.silent){ void sc.offsetWidth; sc.classList.add('enter'); }
  setYearDisplay(n,opts.silent);
}

/* ================= LÍNEA INFERIOR ================= */
function buildRibbon(){
  var rb=$('#rb'); rb.style.setProperty('--n',N);
  $('#rb-nodes').innerHTML=NODES.map(function(n,i){
    var gap=''; if(i<N-1&&nodeYear(n)&&nodeYear(NODES[i+1])){ var g=nodeYear(NODES[i+1])-nodeYear(n); gap='<span class="gap">'+g+(g===1?' año':' años')+'</span>'; }
    var lab=n.hoy?'Hoy':n.label;
    return '<li>'+gap+'<button type="button" class="rb-node" data-i="'+i+'" aria-label="'+(n.hoy?'Hoy':(nodeYear(n)?'Año '+nodeYear(n):n.yearLabel))+': '+esc(n.title)+'"><span class="dot"></span><span class="yl">'+lab+'</span></button></li>';
  }).join('');
  $$('#rb-nodes .rb-node').forEach(function(b){ b.addEventListener('click',function(e){ goNode(parseInt(b.getAttribute('data-i'),10),{user:true,from:{x:e.clientX||0,y:e.clientY||0}}); }); });
  $('#rb-nodes').addEventListener('keydown',function(e){
    var k=e.key,fb=e.target.closest?e.target.closest('.rb-node'):null,i=fb?parseInt(fb.getAttribute('data-i'),10):state.i,t=null;
    if(k==='ArrowRight')t=i+1; else if(k==='ArrowLeft')t=i-1; else if(k==='Home')t=0; else if(k==='End')t=N-1;
    if(t===null)return; e.preventDefault(); t=Math.max(0,Math.min(N-1,t));
    goNode(t,{user:true}); var b=$('#rb-nodes .rb-node[data-i="'+t+'"]'); if(b)b.focus();
  });
  $('#dots').innerHTML=NODES.map(function(){return '<i></i>';}).join('');
  $('#dots').setAttribute('aria-valuemax',N);
}
function setHead(f){
  $('#rb-head').style.setProperty('--hi',f); $('#rb').style.setProperty('--p',N>1?f/(N-1):0);
  $('#app').style.setProperty('--i',f);
}
function renderProgress(){
  var d=visitedCount(), dots=$$('#dots i');
  dots.forEach(function(el,k){ el.setAttribute('data-v',state.vis[k]?'1':'0'); el.setAttribute('data-c',k===state.i?'1':'0'); });
  var pr=$('#dots'); pr.setAttribute('aria-valuenow',d); pr.setAttribute('aria-valuetext',d+' de '+N+' años visitados');
  $('#prog-text').textContent=d+' de '+N;
  $$('#rb-nodes .rb-node').forEach(function(b,k){ b.setAttribute('data-v',state.vis[k]?'1':'0'); if(k===state.i){b.setAttribute('aria-current','step');}else{b.removeAttribute('aria-current');} });
  $('#prev').disabled=(state.i===0); $('#next').disabled=(state.i===N-1);
}
function evaluate(){
  var all=(visitedCount()>=N), prev=Scorm.get('cmi.core.lesson_status');
  if(all){ Scorm.set('cmi.core.lesson_status','completed'); }
  else if(!prev||prev==='not attempted'){ Scorm.set('cmi.core.lesson_status','incomplete'); }
}
function goNode(i,opts){
  opts=opts||{};
  i=Math.max(0,Math.min(N-1,i));
  var changed=(i!==state.i)||opts.force;
  state.i=i; state.vis[i]=1;
  var n=NODES[i];
  if(!opts.keepHead)setHead(i);
  if(changed){ applyTheme(n,!!opts.silent,opts.from); renderScene(n,{silent:!!opts.silent}); }
  renderProgress();
  if(!opts.silent&&changed)announce((n.hoy?'Hoy':(nodeYear(n)?'Año '+nodeYear(n):n.yearLabel))+': '+n.title+'.');
  if(opts.user)setPlay(false);
  var wasDone=state.done;
  if(visitedCount()>=N&&!state.done){ state.done=1; var t=$('#toast'); t.hidden=false; setTimeout(function(){t.hidden=true;},3600); announce('Recorrido completo: visitaste los '+N+' años.'); }
  evaluate();
  if(state.done&&!wasDone)save(true); else save();
}
function setPlay(on){
  clearInterval(playT); playT=null;
  var b=$('#play'); if(!b)return;
  var was=b.getAttribute('aria-pressed')==='true';
  b.setAttribute('aria-pressed',on?'true':'false'); $('#play-t').textContent=on?'Pausar viaje':'Reproducir viaje'; $('.pp',b).textContent=on?'❚❚':'▶';
  if(on){
    if(state.i>=N-1)goNode(0,{auto:true});
    var ms=parseInt(b.getAttribute('data-play-ms'),10)||CONFIG.playMs;
    playT=setInterval(function(){ if(state.i<N-1){goNode(state.i+1,{auto:true});}else{setPlay(false);} },ms);
    announce('Viaje iniciado. Pulsa Pausar viaje para detenerlo.');
  } else if(was){ announce('Viaje en pausa.'); }
}
function initScrub(){
  var sc=$('#rb-scrub'), rb=$('#rb'), drag=null;
  function frac(e){ var r=sc.getBoundingClientRect(); var f=(e.clientX-r.left)/r.width*N-0.5; return Math.max(0,Math.min(N-1,f)); }
  sc.addEventListener('pointerdown',function(e){ e.preventDefault(); try{sc.setPointerCapture(e.pointerId);}catch(_){} drag={moved:false,x:e.clientX}; rb.classList.add('dragging'); setPlay(false); });
  sc.addEventListener('pointermove',function(e){
    if(!drag)return; if(Math.abs(e.clientX-drag.x)>3)drag.moved=true;
    var f=frac(e); setHead(f); var k=Math.round(f); if(k!==state.i)goNode(k,{user:true,keepHead:true,from:{x:e.clientX,y:e.clientY}});
  });
  function end(e){ if(!drag)return; var f=frac(e),k=Math.round(f); var was=drag; drag=null; rb.classList.remove('dragging'); goNode(k,{user:true,force:!was.moved&&k===state.i,from:{x:e.clientX,y:e.clientY}}); setHead(state.i); }
  sc.addEventListener('pointerup',end); sc.addEventListener('pointercancel',end);
}

/* ================= VENTANAS EMERGENTES ================= */
var lastOpener=null;
function openModal(title,html,opts){
  opts=opts||{}; setPlay(false);
  var dlg=$('#modal'); $('#modal-title').textContent=title; $('#modal-body').innerHTML=html;
  lastOpener=document.activeElement;
  dlg.onclose=function(){ if(opts.onClose)opts.onClose(); var o=lastOpener; if(o&&o.focus&&document.contains(o))setTimeout(function(){o.focus();},0); };
  if(dlg.showModal){ try{dlg.showModal();}catch(e){dlg.setAttribute('open','');} } else { dlg.setAttribute('open',''); }
  $('#modal-title').focus();
  if(opts.onOpen)opts.onOpen($('#modal-body'));
}
function closeModal(){ var dlg=$('#modal'); if(dlg.close&&dlg.open){dlg.close();}else{dlg.removeAttribute('open'); if(dlg.onclose)dlg.onclose();} }
function helpHTML(){
  return '<ul class="bul"><li>Pulsa un año de la línea, usa <strong>Año anterior</strong> y <strong>Año siguiente</strong>, o arrastra la línea.</li><li><strong>Reproducir viaje</strong> recorre los años solo; pulsa <strong>Pausar viaje</strong> cuando quieras. También se pausa al abrir una ventana.</li><li>Con una flecha de la línea enfocada, las flechas del teclado cambian de año.</li><li>Tu avance se guarda solo. Usa <strong>Guardar y salir</strong> cuando termines.</li></ul><details class="tech" id="tech"><summary>Vista técnica: datos enviados al aula (SCORM 1.2)</summary><div id="tech-body"></div></details>';
}
var MODALS={
  help:function(){return {title:'Ayuda',html:helpHTML(),onOpen:function(b){ $('#tech',b).addEventListener('toggle',renderTech); }};},
  more:function(){
    var n=NODES[state.i], y=nodeYear(n), h='<p>'+n.detail+'</p>';
    if(n.bullets&&n.bullets.length)h+='<ul class="bl">'+n.bullets.map(function(b){return '<li><b>'+b.when+'</b><span>'+b.text+'</span></li>';}).join('')+'</ul>';
    h+='<p style="color:var(--muted)">Etapa: '+n.era+'. Fuente: '+OVA.meta.source+'.</p>';
    return {title:(n.hoy?'Hoy':(y?String(y):n.yearLabel))+': '+n.title,html:h};},
  quote:function(){return {title:'Una idea para llevar',html:'<p class="quote">«'+OVA.quote.text+'»</p><p><strong>'+OVA.quote.author+'</strong></p><p>'+OVA.quote.note+'</p>'};},
  exit:function(){return {title:'Guardar y salir',html:'<p>Se enviará tu avance al aula virtual y se cerrará la sesión de este recurso.</p><div style="display:flex;gap:.7rem;flex-wrap:wrap"><button type="button" class="pill" id="exit-yes">Guardar y salir</button><button type="button" class="btn-ln" id="exit-no" style="border-color:var(--ink)">Seguir en el recurso</button></div>',onOpen:function(b){
      $('#exit-no',b).addEventListener('click',closeModal);
      $('#exit-yes',b).addEventListener('click',function(){
        endSession(); $('#modal-title').textContent='Avance guardado';
        $('#modal-body').innerHTML='<p>Tu avance quedó registrado. Ya puedes cerrar este recurso. Para continuar, ábrelo de nuevo desde el aula.</p><button type="button" class="pill" id="exit-ok">Entendido</button>';
        $('#exit-ok').addEventListener('click',closeModal); $('#modal-title').focus();
      });
    }};}
};
function initModals(){
  document.addEventListener('click',function(e){
    var t=e.target.closest?e.target.closest('[data-modal]'):null; if(!t)return;
    var m=MODALS[t.getAttribute('data-modal')]; if(m){ var c=m(); openModal(c.title,c.html,c); }
  });
  $('#ev-more').addEventListener('click',function(){ var c=MODALS.more(); openModal(c.title,c.html,c); });
  $('#ev-quote').addEventListener('click',function(){ var c=MODALS.quote(); openModal(c.title,c.html,c); });
  $('#modal-close').addEventListener('click',closeModal);
  $('#modal').addEventListener('click',function(e){ if(e.target===$('#modal'))closeModal(); });
}
function endSession(){
  if(Scorm.isFinished())return;
  save(true); var st=Scorm.get('cmi.core.lesson_status');
  Scorm.terminate((st==='passed'||st==='completed'||st==='failed')?'':'suspend');
  $('#cerrada').hidden=false; renderTech();
}

/* ================= FONDO ================= */
function buildTape(){
  var s='',y; for(y=1600;y<=2000;y+=50)s+='<span>'+y+'</span>'; $('#tape').innerHTML=s;
}

/* ================= INICIO ================= */
function init(){
  Scorm.init();
  try{ var raw=Scorm.get('cmi.suspend_data'); if(raw){ var o=JSON.parse(raw); if(o&&o.v===2)deepAssign(state,o); } }catch(e){}
  state.i=Math.max(0,Math.min(N-1,state.i||0));
  try{ var qp=parseInt(new URLSearchParams(location.search).get('pantalla'),10); if(qp>=1&&qp<=N)state.i=qp-1; }catch(e){}  /* ?pantalla=3 abre el hito 3 (la plataforma lo usa para comparar) */
  if(Scorm.isMock())$('#vista-previa').hidden=false;
  $('#h1').textContent=OVA.meta.title; $('#crumb-course').textContent=OVA.meta.course; $('#crumb-unit').textContent=OVA.meta.unit;
  document.title=OVA.meta.title;
  buildOdometer(); buildTape(); buildRibbon(); initModals(); initScrub();
  $('#prev').addEventListener('click',function(){ goNode(state.i-1,{user:true}); });
  $('#next').addEventListener('click',function(){ goNode(state.i+1,{user:true}); });
  $('#play').addEventListener('click',function(){ setPlay($('#play').getAttribute('aria-pressed')!=='true'); });
  Scorm.onLog(function(){renderTech();});
  goNode(state.i,{silent:true,force:true});
  window.addEventListener('pagehide',function(){ if(!Scorm.isFinished())endSession(); });
  window.addEventListener('beforeunload',function(){ if(!Scorm.isFinished())endSession(); });
  save(true);
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();

</script>
