<!--
  PLANTILLA OVA · LÍNEA DE TIEMPO · TARJETAS · SCORM 1.2
  Ficha de la plantilla (para el registro de plantillas):
  - Cuándo usarla: contenido que se cuenta como secuencia de años o hitos fechados (5 a 12 hitos), con un texto corto por hito.
  - Cuándo NO usarla: procesos sin fechas, comparaciones, contenido numérico o actividades con calificación.
  - Qué hace: carrusel de tarjetas, una por hito, cada una con su color y un motivo animado. Se navega con las flechas, arrastrando,
    tocando una tarjeta vecina, con la lista de años de abajo o con la reproducción automática.
    Registra estado (completado al visitar todos los años), tiempo y avance en Moodle (SCORM 1.2). No califica.
  - Contenido: todo sale del bloque JSON #ova-content (meta, quote, nodes[]: año, textos, motivo). Los colores salen de la paleta
    de la formación (meta.nivel o ?nivel=): color base y oscuro; los hitos alternan tonos claro, base y oscuro.
  - Motivos disponibles: tablilla, dados, barras, estado, parcelas, regresion, correlacion, chi, calor.
  - Diseño: tarjetas de color plano (blanco, color base y oscuro de la formación) sobre fondo blanco; sin lima ni grises de fondo.
  - Un solo archivo, sin recursos externos (numeral 4.6 de las especificaciones técnicas).

  CAMPOS DEL JSON (bloque #ova-content)
  meta.title: texto, obligatorio (título visible)
  meta.course: texto, opcional (no se muestra)
  meta.unit: texto, opcional (no se muestra)
  meta.source: texto, opcional (se cita en «Más detalle»)
  meta.nivel: texto, opcional: tecnologia | profesional | especializacion | doctorado (por defecto tecnologia; también ?nivel=)
  quote.text: texto, opcional (si falta no sale el botón «Una idea para llevar»); frase corta, ver límites de la formación en la guía
  quote.author: texto, opcional
  quote.note: texto, opcional; 1 o 2 frases, ver límites de la formación en la guía
  nodes: lista, obligatorio; 5 a 12 hitos (ver límites de la formación en la guía)
  nodes[].id: texto, obligatorio (se guarda como ubicación del avance)
  nodes[].year: número o null, obligatorio (null si el hito no tiene año)
  nodes[].hoy: verdadero/falso, opcional (el hito usa el año actual)
  nodes[].label: texto, obligatorio (texto del botón de la lista de años)
  nodes[].yearLabel: texto, obligatorio (nombre del hito cuando no tiene año)
  nodes[].display: texto, opcional (texto grande cuando year es null)
  nodes[].era: texto, opcional (etapa; ficha de la tarjeta)
  nodes[].title: texto, obligatorio; unas 3 a 8 palabras
  nodes[].text: texto, obligatorio; unas 25 a 50 palabras (ver límites de la formación en la guía)
  nodes[].themes: lista de textos, opcional (etiquetas de la tarjeta)
  nodes[].motif: texto, obligatorio: tablilla | dados | barras | estado | parcelas | regresion | correlacion | chi | calor
  nodes[].alt: texto, opcional (descripción del dibujo)
  nodes[].detail: texto, opcional (primer párrafo de «Más detalle»)
  nodes[].bullets: lista, opcional (puede ir vacía)
  nodes[].bullets[].when: texto (marca del renglón)
  nodes[].bullets[].text: texto (descripción del renglón)
  nodes[].tone: texto, opcional: claro | base | oscuro (fija el tono de la tarjeta)
  textos: ninguna
-->

/* ---------- Estructura ---------- */
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;font-family:var(--font);background:#FFFFFF;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;background:#FFFFFF;overflow:hidden}
.top{display:flex;align-items:center;gap:1rem;padding:.8rem clamp(1rem,3.4vw,2.8rem)}
.titulo{flex:1 1 auto;min-width:0;font-size:clamp(.95rem,1.5vw,1.2rem);font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:.6rem;font-size:.88rem;font-weight:700;white-space:nowrap}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;transition:background .3s var(--ease),transform .3s var(--ease)}
.dots i[data-v="1"]{background:currentColor}
.dots i[data-c="1"]{transform:scale(1.35)}
.tools{display:flex;gap:.5rem;flex:none}
.tools .ico{display:none}
@media (max-width:760px){.tools .lbl{display:none}.tools .ico{display:inline}.dots{display:none}.titulo{font-size:.9rem}}

/* ---------- Carrusel ---------- */
.stage{position:relative;min-height:0;overflow:hidden;touch-action:pan-y;user-select:none}
.card{--on:var(--bg);position:absolute;left:50%;top:50%;width:min(74vw,1020px);height:min(calc(100% - 1.4rem),600px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(.8rem,2.4vw,2.4rem);align-items:center;
  padding:clamp(1.1rem,3vw,2.6rem);border-radius:28px;background:var(--bg);color:var(--fg);overflow:hidden;cursor:default;
  transition:transform .65s var(--ease),opacity .5s var(--ease)}
.card.lado{cursor:pointer}
.card.blanca{border:2px solid var(--ink)}
.card.lado .ev-text,.card.lado .chips,.card.lado .ev-actions,.card.lado .medal{visibility:hidden}
.card::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:var(--soft);right:-14%;top:-34%;pointer-events:none}
.card>*{position:relative}
.c-copy{display:flex;flex-direction:column;gap:.7rem;min-width:0}
.yr{font-size:clamp(2.6rem,min(9vw,17vh),6.6rem);font-weight:700;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums;margin-left:-.04em}
.yr.txt{font-size:clamp(2.4rem,min(7.4vw,14vh),5.4rem);letter-spacing:-.05em}
.ev-title{font-size:clamp(1.2rem,2.6vw,2.2rem);font-weight:700;letter-spacing:-.035em;line-height:1.06;text-wrap:balance;max-width:30ch;margin:0}
.ev-text{font-size:clamp(.9rem,1.15vw,1.08rem);line-height:1.55;max-width:54ch;margin:0}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.chips li{border:2px solid currentColor;border-radius:999px;padding:.05rem .85rem;font-weight:700;font-size:.85rem}
.ev-actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.2rem}
.card .pill{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card .pill:hover{background:transparent;color:var(--fg)}
.card .btn-ln{border-color:var(--fg);color:var(--fg)}
.card .btn-ln:hover{background:var(--fg);color:var(--bg)}
.card :focus-visible{outline-color:var(--fg)}
.medal{justify-self:center;width:min(100%,min(40vh,340px));aspect-ratio:1;border-radius:50%;background:var(--soft);position:relative;display:grid;place-items:center}
.medal::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px dashed currentColor;opacity:.4}
.medal svg{width:84%;height:84%;overflow:visible}
.flecha{position:absolute;top:50%;transform:translateY(-50%);z-index:15;width:48px;height:48px;min-height:48px;padding:0 0 .2rem;border-radius:50%;font-size:2rem;line-height:1;display:grid;place-items:center;background:#FFFFFF}
.toast{z-index:20}
.flecha.ant{left:clamp(.4rem,1.6vw,1.4rem)}
.flecha.sig{right:clamp(.4rem,1.6vw,1.4rem)}
@media (max-width:820px){
  .card{width:86vw;grid-template-columns:1fr;align-content:center}
  .medal{display:none}
  .flecha{display:none}
  .card::before{width:90%}
}
@media (max-height:640px){
  .card{padding:1rem 1.4rem}
  .ev-text{font-size:.9rem;line-height:1.45}
  .c-copy{gap:.45rem}
  .medal{width:min(100%,min(36vh,300px))}
}

/* ---------- Lista de años ---------- */
.bajo{display:flex;align-items:center;gap:.7rem;padding:.4rem clamp(1rem,3.4vw,2.8rem) calc(.8rem + env(safe-area-inset-bottom,0px))}
.rail{flex:1 1 auto;min-width:0;display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;padding:.3rem 2px;list-style:none;margin:0}

.yb:hover{background:#F2F3F5}

.modal-head{background:var(--bg);color:var(--fg);padding:1rem 1.3rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}

.quote{font-size:1.6rem;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.toast{position:absolute;left:50%;top:4.6rem;transform:translateX(-50%);z-index:5;background:var(--fg);color:var(--on);padding:.4rem 1.2rem;border-radius:999px;font-weight:700;animation:toast .6s var(--ease) both}

@keyframes toast{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translateX(-50%)}}
.toast{z-index:20;top:4.2rem}

  if(opts.user)setPlay(false);
  var wasDone=state.done;
  if(visitedCount()>=N&&!state.done){ state.done=1; var t=$('#toast'); t.hidden=false; setTimeout(function(){t.hidden=true;},3600); announce('Recorrido completo: visitaste los '+N+' años.'); }
  evaluate();
  if(state.done&&!wasDone)save(true); else save();
}
function setPlay(on){
  clearInterval(playT); playT=null;
  var b=$('#play'); if(!b)return;
  var was=b.getAttribute('aria-pressed')==='true';
  b.setAttribute('aria-pressed',on?'true':'false'); $('#play-t').textContent=on?'Pausar viaje':'Reproducir viaje'; $('.pp',b).textContent=on?'❚❚':'▶';
  if(on){
    if(state.i>=N-1)goNode(0,{auto:true});
    var ms=parseInt(b.getAttribute('data-play-ms'),10)||CONFIG.playMs;
    playT=setInterval(function(){ if(state.i<N-1){goNode(state.i+1,{auto:true});}else{setPlay(false);} },ms);
    announce('Viaje iniciado. Pulsa Pausar viaje para detenerlo.');
  } else if(was){ announce('Viaje en pausa.'); }
}

/* ================= VENTANAS EMERGENTES ================= */
var lastOpener=null;
function openModal(title,html){
  setPlay(false);
  var dlg=$('#modal'); $('#modal-title').textContent=title; $('#modal-body').innerHTML=html;
  lastOpener=document.activeElement;
  dlg.onclose=function(){ var o=lastOpener; if(o&&o.focus&&document.contains(o))setTimeout(function(){o.focus();},0); };
  if(dlg.showModal){ try{dlg.showModal();}catch(e){dlg.setAttribute('open','');} } else { dlg.setAttribute('open',''); }
  $('#modal-title').focus();
}
function closeModal(){ var dlg=$('#modal'); if(dlg.close&&dlg.open){dlg.close();}else{dlg.removeAttribute('open'); if(dlg.onclose)dlg.onclose();} }
function helpHTML(){
  return '<ul class="bul"><li>Usa las flechas de los lados, <strong>Año anterior</strong> y <strong>Año siguiente</strong>, o arrastra las tarjetas. También puedes pulsar la tarjeta que asoma a un lado.</li><li>La lista de abajo te lleva directo a cualquier año.</li><li><strong>Reproducir viaje</strong> recorre los años solo; pulsa <strong>Pausar viaje</strong> cuando quieras. También se pausa al abrir una ventana.</li><li>Con el teclado, las flechas izquierda y derecha cambian de año.</li><li><strong>Más detalle</strong> abre información adicional del año que estás viendo.</li></ul>';
}
function openMore(){
  var n=NODES[state.i], y=nodeYear(n), h=n.detail?'<p>'+esc(n.detail)+'</p>':'';
  if(n.bullets&&n.bullets.length)h+='<ul class="bl">'+n.bullets.map(function(b){return '<li><b>'+esc(b.when)+'</b><span>'+esc(b.text)+'</span></li>';}).join('')+'</ul>';
  var pie=[]; if(n.era)pie.push('Etapa: '+esc(n.era)+'.'); if(OVA.meta.source)pie.push('Fuente: '+esc(OVA.meta.source)+'.');
  if(pie.length)h+='<p style="color:var(--muted)">'+pie.join(' ')+'</p>';
  openModal((n.hoy?'Hoy':(y?String(y):n.yearLabel))+': '+n.title,h);
}
function openQuote(){
  openModal('Una idea para llevar','<p class="quote">«'+esc(OVA.quote.text)+'»</p>'+(OVA.quote.author?'<p><strong>'+esc(OVA.quote.author)+'</strong></p>':'')+(OVA.quote.note?'<p>'+esc(OVA.quote.note)+'</p>':''));
}
function endSession(){
  if(Scorm.isFinished())return;
  save(true); var st=Scorm.get('cmi.core.lesson_status');
  Scorm.terminate((st==='passed'||st==='completed'||st==='failed')?'':'suspend');
}

/* ================= EVENTOS ================= */
function initEvents(){
  $('#track').addEventListener('click',function(e){
    var c=e.target.closest?e.target.closest('.card'):null; if(!c)return;
    var k=parseInt(c.getAttribute('data-k'),10);
    if(k!==state.i){ goNode(k,{user:true}); return; }
    if(e.target.closest('.c-more'))openMore();
    else if(e.target.closest('.c-quote'))openQuote();
  });
  $('#rail').addEventListener('click',function(e){ var b=e.target.closest?e.target.closest('.yb'):null; if(b)goNode(parseInt(b.getAttribute('data-k'),10),{user:true}); });
  $('#prev').addEventListener('click',function(){ goNode(state.i-1,{user:true}); });
  $('#next').addEventListener('click',function(){ goNode(state.i+1,{user:true}); });
  $('#play').addEventListener('click',function(){ setPlay($('#play').getAttribute('aria-pressed')!=='true'); });
  document.addEventListener('click',function(e){ var t=e.target.closest?e.target.closest('[data-modal="help"]'):null; if(t)openModal('Ayuda',helpHTML()); });
  $('#modal-close').addEventListener('click',closeModal);
  $('#modal').addEventListener('click',function(e){ if(e.target===$('#modal'))closeModal(); });
  document.addEventListener('keydown',function(e){
    if($('#modal').open)return;
    if(e.key==='ArrowLeft'){ e.preventDefault(); goNode(state.i-1,{user:true}); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); goNode(state.i+1,{user:true}); }
  });
  /* arrastrar o deslizar */
  var st=$('#stage'), x0=null, y0=null;
  st.addEventListener('pointerdown',function(e){ if(e.target.closest&&e.target.closest('button'))return; x0=e.clientX; y0=e.clientY; });
  function fin(e){ if(x0===null)return; var dx=e.clientX-x0, dy=e.clientY-y0; x0=null; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){ goNode(state.i+(dx<0?1:-1),{user:true}); } }
  st.addEventListener('pointerup',fin); st.addEventListener('pointercancel',function(){x0=null;});
}

/* ================= INICIO ================= */
function init(){
  Scorm.init();
  try{ var raw=Scorm.get('cmi.suspend_data'); if(raw){ var o=JSON.parse(raw); if(o&&o.v===2)deepAssign(state,o); } }catch(e){}
  state.i=Math.max(0,Math.min(N-1,state.i||0));
  var ttl=OVA.meta.title||document.title||''; $('#h1').textContent=ttl; $('#titulo').textContent=ttl; if(OVA.meta.title)document.title=OVA.meta.title;
  buildCards(); buildRail(); initEvents();
  goNode(state.i,{silent:true,force:true});
  window.addEventListener('pagehide',function(){ if(!Scorm.isFinished())endSession(); });
  window.addEventListener('beforeunload',function(){ if(!Scorm.isFinished())endSession(); });
  save(true);
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();

</script>
</body>
</html>
