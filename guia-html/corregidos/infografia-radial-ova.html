<title>{{TITULO}}</title>
<!--
  PLANTILLA OVA · INFOGRAFÍA RADIAL · SCORM 1.2
  Ficha de la plantilla (para el registro de plantillas):
  - Cuándo usarla: un tema que se explica en 4 a 8 bloques que se leen en cualquier orden, pero que forman un conjunto (un ciclo, un modelo, un marco).
  - Cuándo NO usarla: secuencias con fechas (usar línea de tiempo), comparaciones numéricas o actividades con calificación.
  - Qué hace: una rueda con un sector por bloque y el tema en el centro. El estudiante pulsa un sector (o usa Anterior y Continuar) y a la derecha
    aparece su explicación: idea central, tres puntos clave y una pregunta para pensar. El sector activo se separa de la rueda,
    los visitados se marcan y el centro cuenta el avance. Registra estado (completado al visitar todos los bloques), tiempo y avance en Moodle (SCORM 1.2). No califica.
  - Contenido: todo sale del bloque JSON #ova-content (meta, bloques[]: número, nombre, idea, párrafos, puntos, pregunta, ícono).
    El contenido que trae es de ejemplo para validar el formato. Los colores salen de la formación (meta.nivel o ?nivel= en la dirección; por defecto tecnologia): base y oscuro de la formación, alternados en tres tonos (claro, base, oscuro).
  - Íconos disponibles: libro, lupa, balanza, grafica, objetivo, validar, lista.
  - Un solo archivo, sin recursos externos (numeral 4.6 de las especificaciones técnicas).

  CAMPOS DEL JSON
  - meta: objeto, obligatorio.
  - meta.title: texto, obligatorio (título del recurso; ver límites de la formación en la guía).
  - meta.tema: texto, opcional (rótulo pequeño en el centro de la rueda).
  - meta.hub: texto, opcional (nombre en el centro de la rueda; si falta usa meta.title).
  - meta.source: texto, opcional (nota interna; no se muestra).
  - meta.nivel: texto, opcional; valores: tecnologia, profesional, especializacion, doctorado (por defecto tecnologia; también 'licenciatura' como alias de profesional).
  - bloques: lista de objetos, obligatorio; de 4 a 8 bloques (cada uno es un sector de la rueda).
  - bloques[].id: texto, opcional.
  - bloques[].nombre: texto, obligatorio (nombre del sector; ver límites de la formación en la guía).
  - bloques[].icono: texto, opcional; uno de: libro, lupa, balanza, grafica, objetivo, validar, lista (si falta o no existe usa lista).
  - bloques[].idea: texto, opcional (idea central).
  - bloques[].p1: texto, obligatorio (primer párrafo; ver límites de la formación en la guía).
  - bloques[].p2: texto, opcional (segundo párrafo).
  - bloques[].puntos: lista de objetos, opcional; hasta 3 puntos clave.
  - bloques[].puntos[].t: texto, obligatorio dentro de cada punto (término en negrita).
  - bloques[].puntos[].d: texto, opcional (explicación del punto).
  - bloques[].pregunta: texto, opcional (pregunta para pensar).
  textos: ninguna
-->
<style>
:root{
  /* Paleta DIEPO por formación: el script fija --brand, --nav y derivadas (ver NIVELES). Cada sector alterna tonos (ver TONOS). */
  --bg:#FFFFFF; --fg:var(--nav,#142749); --on:#FFFFFF; --acc:var(--brand,#00665F); --soft:rgba(20,39,73,.08);
  --paper:#FFFFFF; --text:var(--nav,#142749); --muted:rgba(20,39,73,.72); --line:#C8C8C8; --ink:var(--nav,#142749); --pip:var(--brand,#00665F);
  /* Tipografía provisional: se reemplaza cuando COEST/GEVIP confirmen la fuente oficial */
  --font:'Montserrat','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;font-family:var(--font);background:var(--ink);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.paper :focus-visible,dialog :focus-visible{outline-color:var(--ink)}
h2[tabindex="-1"]:focus,#modal-title:focus,.stage:focus{outline:none}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:.75rem;top:-4rem;background:var(--ink);color:#fff;padding:.6rem 1rem;z-index:100;border-radius:999px;font-weight:700}
.skip:focus{top:.75rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.btn-ln,.pill{font:inherit;font-weight:700;min-height:44px;padding:.35rem 1.2rem;border-radius:999px;cursor:pointer;border:2px solid var(--fg);transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}
.btn-ln{background:transparent;color:inherit}
.btn-ln:hover,.pill:hover{background:var(--fg);color:var(--on)}
.pill{background:var(--fg);color:var(--on)}
.pill:hover{background:transparent;color:var(--fg)}
.btn-ln:active,.pill:active{transform:scale(.96)}
.pill:disabled,.btn-ln:disabled{opacity:.35;cursor:not-allowed;transform:none}
.pill .pp{display:inline-block;width:1.1em;text-align:center;margin-right:.4em}

/* ---------- Estructura ---------- */
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;font-family:var(--font);background:#FFFFFF;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);background:#FFFFFF;overflow:hidden}
.top{display:flex;align-items:center;gap:1rem;padding:.7rem clamp(1rem,3vw,2.4rem)}
.titulo{flex:1 1 auto;min-width:0;font-size:clamp(1.05rem,1.9vw,1.5rem);font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:.6rem;font-size:.88rem;font-weight:700;white-space:nowrap}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;transition:background .3s var(--ease),transform .3s var(--ease)}
.dots i[data-v="1"]{background:currentColor}
.dots i[data-c="1"]{transform:scale(1.35)}
.tools{display:flex;gap:.5rem;flex:none}
.tools .ico{display:none}
@media (max-width:760px){.tools .lbl{display:none}.tools .ico{display:inline}.dots{display:none}}

.main{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);gap:clamp(.8rem,2.2vw,1.8rem);padding:0 clamp(1rem,3vw,2.4rem) clamp(.8rem,2vw,1.3rem);min-height:0}

/* ---------- Rueda ---------- */
.grafico{position:relative;min-height:0;display:grid;place-items:center}
.grafico svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.sec{cursor:pointer;outline:none;transform-box:view-box;transform-origin:50% 50%;
  transform:translate(calc(var(--ox) * var(--pop,0px)),calc(var(--oy) * var(--pop,0px)));transition:transform .5s var(--ease)}
.sec:hover{--pop:9px}
.sec.act{--pop:18px}
.sec path{fill:var(--c);stroke:var(--sk,#FFFFFF);stroke-width:3;transition:filter .3s var(--ease)}
.sec:hover path{filter:brightness(1.12)}
.sec.act path{stroke:var(--ink);stroke-width:4}
.sec:focus-visible path{stroke:var(--ink);stroke-width:5;stroke-dasharray:10 6}
.sec text{fill:var(--cf);font-family:var(--font);pointer-events:none;text-anchor:middle}
.sec .num{font-size:25px;font-weight:700;letter-spacing:-.02em}
.sec .nom{font-size:12.5px;font-weight:700}
.sec use{color:var(--cf);pointer-events:none}
.marca circle.fondo{fill:#FFFFFF;stroke:var(--ink);stroke-width:2.5}
.marca .ok{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .4s var(--ease)}
.marca .ping{fill:var(--ca,var(--brand,#00665F));opacity:1;transition:opacity .3s var(--ease)}
.marca .onda{fill:none;stroke:var(--ca,var(--brand,#00665F));stroke-width:3;opacity:0}
.sec[data-v="1"] .marca .ok{opacity:1}
.sec[data-v="1"] .marca .ping,.sec[data-v="1"] .marca .onda{opacity:0;animation:none}
.centro-fondo{fill:var(--ink)}
.centro-txt{fill:#FFFFFF;font-family:var(--font);text-anchor:middle}
.aro-pista{fill:none;stroke:var(--ink);stroke-opacity:.15;stroke-width:7}
.aro{fill:none;stroke:var(--c,var(--brand,#00665F));stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:300px 300px;transition:stroke-dashoffset .8s var(--ease),stroke .5s var(--ease)}
.aro-giro{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:3 11;opacity:.55;transform-origin:300px 300px}
@media (prefers-reduced-motion:no-preference){
  .sec{animation:secEntra .9s var(--ease) both;animation-delay:calc(var(--i) * 100ms + 150ms)}
  .centro{animation:centroEntra .9s var(--ease) both}
  .aro-giro{animation:giro 46s linear infinite}
  .marca .onda{animation:onda 2.2s ease-out infinite;animation-delay:calc(var(--i) * 280ms)}
  .sec:not([data-v="1"]) .marca .ping{animation:latido 2.2s ease-in-out infinite;animation-delay:calc(var(--i) * 280ms)}
}
@keyframes secEntra{from{opacity:0;transform:scale(.4) rotate(-28deg)}}
@keyframes centroEntra{from{opacity:0;transform:scale(.5)}}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes onda{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.marca circle,.marca path{transform-box:fill-box;transform-origin:center}
.pista{position:absolute;left:50%;bottom:.1rem;transform:translateX(-50%);background:var(--ink);color:#FFFFFF;border-radius:999px;padding:.3rem 1rem;font-weight:700;font-size:.85rem;white-space:nowrap;pointer-events:none;transition:opacity .5s var(--ease);z-index:2}
.pista.oculto{opacity:0}

/* ---------- Panel del bloque ---------- */
.panel{--c:var(--brand,#00665F);--cf:#FFFFFF;--ca:var(--brand,#00665F);--caf:#FFFFFF;display:flex;flex-direction:column;min-height:0;border:2px solid var(--ink);border-radius:24px;overflow:hidden;background:#FFFFFF}
.pn-cab{background:var(--c);color:var(--cf);border-bottom:2px solid var(--ink);padding:clamp(.55rem,1.2vw,.9rem) clamp(1.1rem,2.2vw,1.8rem);display:flex;align-items:center;gap:clamp(.8rem,1.6vw,1.2rem);transition:background .5s var(--ease),color .5s var(--ease)}
.pn-num{flex:none;width:clamp(44px,4.6vw,58px);aspect-ratio:1;border-radius:50%;background:var(--cf);color:var(--c);display:grid;place-items:center;font-size:clamp(1.15rem,2vw,1.6rem);font-weight:700;letter-spacing:-.03em}
.pn-t small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.9}
.pn-t h2{margin:.05rem 0 0;font-size:clamp(1.15rem,2vw,1.65rem);letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.pn-cuerpo{--fs:1;flex:1 1 auto;min-height:0;overflow:hidden;padding:clamp(.8rem,1.5vw,1.2rem) clamp(1.1rem,2.2vw,1.8rem);display:flex;flex-direction:column;gap:calc(var(--fs) * clamp(.5rem,1vw,.8rem))}
.idea{border-left:5px solid var(--ca);padding:.05rem 0 .05rem .85rem}
.idea b{display:block;font-size:calc(var(--fs) * .7rem);letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.idea span{display:block;font-size:calc(var(--fs) * clamp(1rem,1.4vw,1.22rem));font-weight:700;line-height:1.3}
.txt{margin:0;font-size:calc(var(--fs) * clamp(.95rem,1.22vw,1.12rem));line-height:1.55}
.puntos{display:flex;flex-direction:column;gap:calc(var(--fs) * .45rem);margin:0;padding:0;list-style:none}
.punto{display:flex;gap:.65rem;align-items:flex-start;font-size:calc(var(--fs) * clamp(.92rem,1.16vw,1.08rem));line-height:1.45}
.punto i{flex:none;font-style:normal;width:calc(var(--fs) * 24px);height:calc(var(--fs) * 24px);border-radius:50%;background:var(--ca);color:var(--caf);display:grid;place-items:center;font-size:calc(var(--fs) * .78rem);font-weight:700;margin-top:.1rem}
.punto b{font-weight:700}
.pregunta{display:flex;gap:.6rem;align-items:flex-start;border-top:2px solid var(--ink);padding-top:calc(var(--fs) * .55rem);font-size:calc(var(--fs) * clamp(.92rem,1.16vw,1.08rem));line-height:1.4}
.pregunta i{flex:none;font-style:normal;width:calc(var(--fs) * 24px);height:calc(var(--fs) * 24px);border-radius:50%;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;font-weight:700;font-size:calc(var(--fs) * .9rem)}
.pregunta p{margin:0}
.pregunta p b{color:var(--ink)}
.pn-pie{flex:none;display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.5rem clamp(1.1rem,2.2vw,1.8rem);border-top:2px solid var(--ink)}
.pn-pie .pasos{font-size:.88rem;font-weight:700}
.pn-pie .btn-ln,.pn-pie .pill{min-height:42px}
.pn-pie .flecha-dr::after{content:" \2192"}
.pn-pie .flecha-iz::before{content:"\2190 "}
.panel.entra .pn-cab .pn-num{animation:pop .7s var(--ease) both}
.panel.entra .pn-t{animation:desliza .6s var(--ease) both}
.panel.entra .pn-cuerpo>*{animation:sube .6s var(--ease) both;animation-delay:calc(var(--k,0) * 90ms + 120ms)}
.panel.entra .punto{animation:sube .55s var(--ease) both;animation-delay:calc(var(--j,0) * 110ms + 380ms)}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-30deg)}}
@keyframes desliza{from{opacity:0;transform:translateX(24px)}}
@keyframes sube{from{opacity:0;transform:translateY(16px)}}
@keyframes dibuja{from{opacity:0;transform:scale(.5) rotate(-12deg)}}
@media (max-width:900px){
  .pn-cuerpo{overflow:auto;scrollbar-width:none}
  .pn-cuerpo::-webkit-scrollbar{display:none}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,.8fr) minmax(0,1.2fr)}
  .grafico{overflow:hidden}
  .grafico svg{padding:10px}
  .pista{display:none}
}

/* ---------- Ventanas emergentes ---------- */
dialog{border:0;padding:0;border-radius:28px;width:min(620px,94vw);max-width:94vw;background:var(--paper);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog[open]{animation:dlgIn .5s var(--ease)}
@keyframes dlgIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
dialog::backdrop{background:color-mix(in srgb,var(--ink) 55%,transparent);backdrop-filter:blur(6px)}
.modal-in{display:flex;flex-direction:column;max-height:88vh;max-height:88dvh}
.modal-head{background:var(--bg);color:var(--fg);padding:1rem 1.3rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.modal-head h2{font-size:1.3rem;letter-spacing:-.02em}
.modal-head .btn-ln{min-height:40px;padding:.15rem 1rem;border-color:var(--fg)}
.modal-head .btn-ln:hover{background:var(--fg);color:var(--on)}
.modal-body{padding:1.1rem 1.3rem 1.4rem;overflow:auto;display:flex;flex-direction:column;gap:.8rem}
.modal-body .pill{align-self:flex-start}
.modal-body ul.bul{list-style:disc;padding-left:1.2rem;display:grid;gap:.35rem}
.bl{display:grid;gap:.1rem}
.bl li{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.7rem;padding:.4rem 0;border-top:1px solid var(--line);line-height:1.35}
.bl li:first-child{border-top:0}
.bl b{font-variant-numeric:tabular-nums}
.quote{font-size:1.6rem;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.toast{position:absolute;left:50%;top:4.6rem;transform:translateX(-50%);z-index:5;background:var(--fg);color:var(--on);padding:.4rem 1.2rem;border-radius:999px;font-weight:700;animation:toast .6s var(--ease) both}
.toast[hidden]{display:none}
@keyframes toast{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translateX(-50%)}}
.toast{z-index:20;top:4.2rem}
</style>

<a class="skip" href="#grafico">Saltar al contenido</a>
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<h1 class="sr-only" id="h1"></h1>

<div class="app" id="app">
  <header class="top">
    <p class="titulo" id="titulo"></p>
    <div class="prog">
      <div class="dots" id="dots" role="progressbar" aria-label="Bloques visitados" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"></div>
      <span id="prog-text">0 de 7</span>
    </div>

  <div id="toast" class="toast" role="status" hidden>Recorrido completo</div>

</div>

    <div class="modal-body" id="modal-body"></div>
  </div>
</dialog>

<script type="application/json" id="ova-content">/*CONTENIDO*/
{
 "meta": {
  "title": "Innovar para servir mejor",
  "nivel": "tecnologia",
  "tema": "Servicio policial",
  "hub": "Innovar para servir mejor",
  "source": "Contenido de ejemplo para validar el formato de infografía radial"
 },
 "bloques": [
  {
   "id": "b1", "nombre": "Fundamentación conceptual", "icono": "libro",
   "idea": "Innovar es mejorar el servicio a partir de lo que las personas necesitan, en pasos pequeños que se revisan con evidencia.",
   "p1": "La agilidad nace de un acuerdo entre profesionales del desarrollo de software, el Manifiesto Ágil (2001), que propone valorar a las personas y su colaboración, entregar algo que funciona, trabajar de la mano con quien recibe el servicio y responder al cambio. Aunque surgió en el software, sus ideas sirven en cualquier servicio que se pueda mejorar poco a poco.",
   "p2": "En este recurso no se trata de copiar rutinas de otras organizaciones, sino de comprender cómo una mejora pequeña puede ayudar a las personas usuarias y cómo comprobar si de verdad ayudó.",
   "puntos": [
    {"t": "Colaborar.", "d": "Quien presta el servicio y quien lo recibe construyen la mejora juntos."},
    {"t": "Entregar valor.", "d": "Se prefiere una mejora pequeña y útil ahora a un plan perfecto que llega tarde."},
    {"t": "Adaptarse.", "d": "Lo que se aprende al probar cambia el siguiente paso."}
   ],
   "pregunta": "¿Qué necesidad concreta se observa en tu servicio y cómo podría atenderse mejor?"
  },
  {
   "id": "b2", "nombre": "Desarrollo analítico", "icono": "lupa",
   "idea": "Un problema bien descrito se puede medir, discutir y mejorar; uno vago solo genera opiniones.",
   "p1": "Antes de proponer una solución conviene entender el problema. Describirlo con precisión significa responder cuatro preguntas: quién lo vive, dónde y cuándo ocurre, con qué frecuencia y qué efecto tiene en el servicio. Las respuestas salen de observar, escuchar a las personas involucradas y revisar los registros disponibles.",
   "p2": "En la Scrum Guide (2020) esta idea se refleja en el Product Backlog: una lista ordenada de todo lo que podría mejorarse, que se revisa y se reordena a medida que se aprende.",
   "puntos": [
    {"t": "Personas afectadas.", "d": "Quién lo vive y cómo lo percibe: su voz importa tanto como las cifras."},
    {"t": "Lugar, momento y frecuencia.", "d": "Un problema que se repite en el mismo sitio o a la misma hora ya da pistas."},
    {"t": "Efecto en el servicio.", "d": "Qué se deja de lograr o se demora por esta causa."}
   ],
   "pregunta": "¿Qué datos necesitas para describir el problema sin suponer nada?"
  },
  {
   "id": "b3", "nombre": "Análisis comparativo", "icono": "balanza",
   "idea": "Comparar evita cambiar por moda y ayuda a elegir con razones.",
   "p1": "Con el problema claro, se compara la forma actual de trabajar con las alternativas posibles. No se parte de cero: primero se reconoce lo que ya funciona y se conserva; luego se identifica lo que estorba y se propone cambiarlo.",
   "p2": "Cada alternativa se pesa por su costo (tiempo, personas, recursos) y por su beneficio para quien recibe el servicio. Una opción sencilla y probada puede valer más que una novedosa pero difícil de sostener.",

(function(){

    catch(e){ return null; }

    };

function partir(txt,max){
  var pal=txt.split(' '), lin=[], act='';
  pal.forEach(function(p){ if((act+' '+p).trim().length>max&&act){ lin.push(act); act=p; } else { act=(act+' '+p).trim(); } });

}

  var changed=(i!==state.i)||opts.force;
  state.i=i; state.vis[i]=1;
  if(changed)pintarPanel(B[i],i);
  renderProgress();
  if(opts.user)$('#pista').classList.add('oculto');
  if(!opts.silent&&changed)announce('Bloque '+(i+1)+': '+B[i].nombre+'.');
  var wasDone=state.done;
  if(visitedCount()>=N&&!state.done){ state.done=1; var t=$('#toast'); t.hidden=false; setTimeout(function(){t.hidden=true;},3600); announce('Recorrido completo: visitaste los '+N+' bloques.'); }
  evaluate();
  if(state.done&&!wasDone)save(true); else save();
}

/* ================= VENTANAS EMERGENTES ================= */
var lastOpener=null;
function openModal(title,html){
  var dlg=$('#modal'); $('#modal-title').textContent=title; $('#modal-body').innerHTML=html;
  lastOpener=document.activeElement;
  dlg.onclose=function(){ var o=lastOpener; if(o&&o.focus&&document.contains(o))setTimeout(function(){o.focus();},0); };
  if(dlg.showModal){ try{dlg.showModal();}catch(e){dlg.setAttribute('open','');} } else { dlg.setAttribute('open',''); }
  $('#modal-title').focus();
}
function closeModal(){ var dlg=$('#modal'); if(dlg.close&&dlg.open){dlg.close();}else{dlg.removeAttribute('open'); if(dlg.onclose)dlg.onclose();} }
function helpHTML(){
  return '<ul class="bul"><li><strong>Pulsa un sector</strong> de la rueda: se separa del resto y a la derecha aparece su explicación.</li><li>Con <strong>Anterior</strong> y <strong>Continuar</strong>, o con las flechas del teclado, recorres los bloques en orden.</li><li>Los sectores que ya viste quedan marcados con una palomita; los que faltan laten suavemente.</li><li>El anillo del centro se llena a medida que avanzas y muestra cuántos bloques llevas.</li></ul>';
}
function endSession(){
  if(Scorm.isFinished())return;
  save(true); var st=Scorm.get('cmi.core.lesson_status');
  Scorm.terminate((st==='passed'||st==='completed'||st==='failed')?'':'suspend');
}

/* ================= EVENTOS ================= */
function initEventos(){
  var r=$('#rueda');
  r.addEventListener('click',function(e){ var g=e.target.closest?e.target.closest('.sec'):null; if(g)goBloque(parseInt(g.getAttribute('data-k'),10),{user:true}); });
  r.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    var g=e.target.closest?e.target.closest('.sec'):null; if(g){ e.preventDefault(); goBloque(parseInt(g.getAttribute('data-k'),10),{user:true}); }
  });
  $('#prev').addEventListener('click',function(){ goBloque(state.i-1,{user:true}); });
  $('#next').addEventListener('click',function(){ goBloque(state.i+1,{user:true}); });
  document.addEventListener('click',function(e){ var t=e.target.closest?e.target.closest('[data-modal="help"]'):null; if(t)openModal('Ayuda',helpHTML()); });
  $('#modal-close').addEventListener('click',closeModal);
  $('#modal').addEventListener('click',function(e){ if(e.target===$('#modal'))closeModal(); });
  document.addEventListener('keydown',function(e){
    if($('#modal').open)return;
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); goBloque(state.i-1,{user:true}); }
    else if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); goBloque(state.i+1,{user:true}); }
  });
}

/* ================= INICIO ================= */
function init(){
  Scorm.init();
  try{ var raw=Scorm.get('cmi.suspend_data'); if(raw){ var o=JSON.parse(raw); if(o&&o.v===1)deepAssign(state,o); } }catch(e){}
  state.i=Math.max(0,Math.min(N-1,state.i||0));
  var TIT=OVA.meta.title||''; $('#h1').textContent=TIT; $('#titulo').textContent=TIT; if(TIT)document.title=TIT;
  if(!N)return;
  var dots=$('#dots'); dots.innerHTML=''; for(var k=0;k<N;k++)dots.appendChild(document.createElement('i')); dots.setAttribute('aria-valuemax',N);
  construirRueda(); initEventos();
  window.addEventListener('resize',ajustarTexto);
  if(visitedCount()>1)$('#pista').classList.add('oculto');
  goBloque(state.i,{silent:true,force:true});
  window.addEventListener('pagehide',function(){ if(!Scorm.isFinished())endSession(); });
  window.addEventListener('beforeunload',function(){ if(!Scorm.isFinished())endSession(); });
  save(true);
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();

</script>
</body>
