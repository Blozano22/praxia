<title>{{TITULO}}</title>
<!--
  PLANTILLA OVA · LÍNEA DE TIEMPO A ESCALA · SCORM 1.2
  Ficha de la plantilla (para el registro de plantillas):
  - Cuándo usarla: contenido que se cuenta como secuencia de años o hitos fechados (5 a 12 hitos), con un texto corto por hito.
  - Cuándo NO usarla: procesos sin fechas, comparaciones, contenido numérico o actividades con calificación.
  - Qué hace: una línea de tiempo larga y a escala (la distancia entre hitos es la distancia real entre años), con las etapas
    como franjas de color. El estudiante la arrastra, pulsa un año, usa las flechas o el minimapa; al soltar, la línea se
    detiene en el hito más cercano y abajo aparece su explicación. Los hitos visitados se marcan; los que faltan, no.
    Registra estado (completado al visitar todos los años), tiempo y avance en Moodle (SCORM 1.2). No califica.
  - Contenido: todo sale del bloque JSON #ova-content (meta, quote, nodes[]: año, textos, motivo). Las etapas salen del campo era
    (hitos seguidos con la misma etapa forman una franja). Los colores salen de la paleta de la formación (meta.nivel o ?nivel=): cada etapa alterna tonos claro, base y oscuro.
  - Motivos disponibles: tablilla, dados, barras, estado, parcelas, regresion, correlacion, chi, calor.
  - Un solo archivo, sin recursos externos (numeral 4.6 de las especificaciones técnicas).

  CAMPOS DEL JSON (#ova-content)
  - meta.nivel: texto, opcional; tecnologia | profesional | especializacion | doctorado (acepta licenciatura como alias de profesional); por defecto tecnologia. También se lee de ?nivel= en la dirección.
  - meta.title: texto, obligatorio; título visible del recurso. Ver límites de la formación en la guía.
  - meta.course: texto, opcional.
  - meta.unit: texto, opcional.
  - meta.source: texto, opcional; se muestra como fuente en «Más detalle».
  - quote.text: texto, opcional; frase de «Una idea para llevar» (si falta el bloque quote, el botón no aparece). Ver límites de la formación en la guía.
  - quote.author: texto, opcional.
  - quote.note: texto, opcional.
  - nodes: lista, obligatorio; 5 a 12 hitos. Cada hito:
  - nodes[].id: texto, obligatorio; identificador único del hito (n0, n1...).
  - nodes[].year: número o null, obligatorio; año del hito (null en «Antes» y «Hoy»; la distancia entre hitos es a escala).
  - nodes[].hoy: verdadero/falso, opcional; true marca el hito final «Hoy» (usa el año actual).
  - nodes[].label: texto, opcional.
  - nodes[].yearLabel: texto, opcional; nombre del hito si no tiene año.
  - nodes[].display: texto, opcional; rótulo corto sobre la línea cuando no hay año (ej. Antes).
  - nodes[].era: texto, obligatorio; etapa. Hitos seguidos con la misma etapa forman una franja de color.
  - nodes[].title: texto, obligatorio; título del hito. Ver límites de la formación en la guía.
  - nodes[].text: texto, obligatorio; explicación corta del hito. Ver límites de la formación en la guía.
  - nodes[].themes: lista de textos, opcional; etiquetas (chips) del hito; en el ejemplo, 1 por hito.
  - nodes[].motif: texto, opcional; dibujo del hito: tablilla, dados, barras, estado, parcelas, regresion, correlacion, chi, calor.
  - nodes[].alt: texto, opcional; texto alternativo del dibujo.
  - nodes[].detail: texto, opcional; frase de «Más detalle».
  - nodes[].bullets: lista, opcional (puede ser []); cada elemento con when (texto) y text (texto); el ejemplo trae hasta 6 en un hito.
  textos: ninguna
-->
<style>
:root{
  /* Paleta por formación: el script fija --brand (base) y --nav (oscuro) según meta.nivel; aquí van los respaldos. */
  --bg:#FFFFFF; --fg:var(--nav,#142749); --on:#FFFFFF; --acc:var(--brand,#00665F); --soft:color-mix(in srgb,var(--nav,#142749) 8%,transparent);
  --paper:#FFFFFF; --text:var(--nav,#142749); --muted:color-mix(in srgb,var(--nav,#142749) 72%,transparent); --line:#C8C8C8; --ink:var(--nav,#142749); --pip:var(--brand,#00665F);
  /* Tipografía provisional: se reemplaza cuando COEST/GEVIP confirmen la fuente oficial */
  --font:'Century Gothic','CenturyGothic','Apple Gothic','Futura','Avenir Next','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;font-family:var(--font);background:var(--ink);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.paper :focus-visible,dialog :focus-visible{outline-color:var(--ink)}
h2[tabindex="-1"]:focus,#modal-title:focus,.stage:focus{outline:none}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:.75rem;top:-4rem;background:var(--ink);color:#fff;padding:.6rem 1rem;z-index:100;border-radius:999px;font-weight:700}
.skip:focus{top:.75rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.btn-ln,.pill{font:inherit;font-weight:700;min-height:44px;padding:.35rem 1.2rem;border-radius:999px;cursor:pointer;border:2px solid var(--fg);transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}
.btn-ln{background:transparent;color:inherit}
.btn-ln:hover,.pill:hover{background:var(--fg);color:var(--on)}
.pill{background:var(--fg);color:var(--on)}
.pill:hover{background:transparent;color:var(--fg)}
.btn-ln:active,.pill:active{transform:scale(.96)}
.pill:disabled,.btn-ln:disabled{opacity:.35;cursor:not-allowed;transform:none}
.pill .pp{display:inline-block;width:1.1em;text-align:center;margin-right:.4em}
/* animaciones de los motivos */
@media (prefers-reduced-motion:no-preference){
  .m-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:mdraw 1.1s var(--ease) calc(var(--dl,0ms) + 320ms) forwards}
  .m-pop{transform-box:fill-box;transform-origin:center;animation:mpop .65s var(--ease) calc(var(--dl,0ms) + 320ms) both}
  .m-grow{transform-box:fill-box;transform-origin:bottom;animation:mgrow .85s var(--ease) calc(var(--dl,0ms) + 320ms) both}
  .m-fade{animation:mfade .7s var(--ease) calc(var(--dl,0ms) + 320ms) both}
  .m-pulse{transform-box:fill-box;transform-origin:center;animation:mpulse 2.4s ease-out 1.5s infinite}
}
@keyframes mdraw{to{stroke-dashoffset:0}}
@keyframes mpop{from{transform:scale(0) rotate(-24deg);opacity:0}to{transform:none;opacity:1}}
@keyframes mgrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}


/* ---------- Estructura ---------- */
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;font-family:var(--font);background:#FFFFFF;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;background:#FFFFFF;overflow:hidden}
.top{display:flex;align-items:center;gap:1rem;padding:.7rem clamp(1rem,3vw,2.4rem)}
.titulo{flex:1 1 auto;min-width:0;font-size:clamp(.95rem,1.5vw,1.2rem);font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:.6rem;font-size:.88rem;font-weight:700;white-space:nowrap}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;transition:background .3s var(--ease),transform .3s var(--ease)}
.dots i[data-v="1"]{background:currentColor}
.dots i[data-c="1"]{transform:scale(1.35)}
.tools{display:flex;gap:.5rem;flex:none}
.tools .ico{display:none}
@media (max-width:760px){.tools .lbl{display:none}.tools .ico{display:inline}.dots{display:none}.titulo{font-size:.9rem}}

/* ---------- Línea de tiempo a escala ---------- */
.stage{position:relative;min-height:0;overflow:hidden;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.viewport{position:absolute;left:0;right:0;top:0;bottom:44px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none}
.viewport.arrastrando{cursor:grabbing}
.track{--ay:calc(38px + (100% - 38px - 26px) / 2);--tl:34px;position:absolute;left:0;top:0;height:100%;will-change:transform;transition:transform .7s var(--ease)}
.track.libre{transition:none}
.banda{position:absolute;top:0;bottom:0;overflow:hidden}
.banda::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.12}
.banda.sin-tinte::before{display:none}
.banda::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.banda-et{position:absolute;left:16px;top:8px;max-width:calc(100% - 24px);padding:.1rem .8rem;border-radius:999px;background:var(--c);color:var(--cf);font-size:.8rem;font-weight:700;white-space:nowrap;transition:transform .7s var(--ease)}
.track.libre .banda-et{transition:none}
.eje{position:absolute;left:0;right:0;top:var(--ay);height:6px;margin-top:-3px;background:var(--ink);border-radius:3px}
.corte{position:absolute;top:var(--ay);transform:translate(-50%,-50%);width:34px;height:34px;background:#FFFFFF;display:grid;place-items:center;font-weight:700;font-size:1.3rem;letter-spacing:-.15em;color:var(--ink)}
.regla{position:absolute;bottom:3px;font-size:.72rem;font-weight:700;opacity:.7;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.regla::before{content:"";position:absolute;left:50%;bottom:100%;margin-bottom:2px;width:2px;height:7px;background:var(--ink);opacity:.7}
.lapso{position:absolute;top:var(--ay);transform:translate(-50%,calc(-100% - 10px));font-size:.74rem;font-weight:700;white-space:nowrap;background:#FFFFFF;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:0 .55rem;opacity:.9}
.evs{position:absolute;inset:0;margin:0;padding:0;list-style:none}
.ev{position:absolute;top:var(--ay);width:0;height:0}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:30px;height:30px;min-height:0;border-radius:50%;border:3px solid var(--ink);background:#FFFFFF;cursor:pointer;padding:0;z-index:3;transition:transform .3s var(--ease),background .3s var(--ease)}
.pin::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--c);opacity:0;transition:opacity .3s var(--ease)}
.ev[data-v="1"] .pin{background:var(--c);border-color:var(--ink)}
.pin:hover{transform:translate(-50%,-50%) scale(1.15)}
.ev[aria-current="step"] .pin{transform:translate(-50%,-50%) scale(1.4);background:var(--c);box-shadow:0 0 0 5px #FFFFFF,0 0 0 8px var(--ink)}
.tallo{position:absolute;left:-1px;width:2px;background:var(--ink);opacity:.55}
.ev.arriba .tallo{bottom:18px;height:var(--tl)}
.ev.abajo .tallo{top:18px;height:var(--tl)}
.et{position:absolute;left:0;width:150px;transform:translateX(-50%);text-align:center;font-size:.8rem;line-height:1.25;cursor:pointer;border:0;background:none;color:var(--ink);font-family:inherit;padding:0}
.ev.arriba .et{bottom:calc(20px + var(--tl))}
.ev.abajo .et{top:calc(20px + var(--tl))}
.et{text-shadow:0 0 5px #FFFFFF,0 0 5px #FFFFFF,0 0 2px #FFFFFF}
.et b{display:block;font-size:1.05rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.et span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:400}
@media (max-height:700px){.track{--tl:18px}}
.ev[aria-current="step"] .et{font-weight:700}
.ev[aria-current="step"] .et span{font-weight:700}
.cue{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);z-index:6;background:var(--ink);color:#FFFFFF;border-radius:999px;padding:.35rem 1.1rem;font-weight:700;font-size:.9rem;white-space:nowrap;pointer-events:none;transition:opacity .5s var(--ease)}
.cue.oculto{opacity:0}
@media (prefers-reduced-motion:no-preference){.cue:not(.oculto) span{display:inline-block;animation:vaiven 1.8s ease-in-out infinite}}
@keyframes vaiven{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.flecha{position:absolute;top:calc(50% - 22px);z-index:6;width:44px;height:44px;min-height:44px;padding:0 0 .2rem;border-radius:50%;font-size:1.8rem;line-height:1;display:grid;place-items:center;background:#FFFFFF}
.flecha.ant{left:.6rem}
.flecha.sig{right:.6rem}
.mini{position:absolute;left:clamp(1rem,3vw,2.4rem);right:clamp(1rem,3vw,2.4rem);bottom:6px;height:32px;cursor:pointer;touch-action:none}
.mini::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--ink);opacity:.35;border-radius:2px}
.mini i{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#FFFFFF;border:2px solid var(--ink)}
.mini i[data-v="1"]{background:var(--c)}
.mini i[data-c="1"]{transform:scale(1.5)}
.mini .ventana{position:absolute;top:2px;bottom:2px;border:2px solid var(--ink);border-radius:8px;background:color-mix(in srgb,var(--nav,#142749) 8%,transparent);pointer-events:none;transition:left .7s var(--ease)}
.mini.libre .ventana{transition:none}
@media (max-width:820px){.flecha{display:none}.et{width:118px;font-size:.72rem}.et b{font-size:.95rem}}

/* ---------- Explicación del hito ---------- */
.panel{--c:var(--brand,#00665F);--cf:#FFFFFF;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:clamp(.8rem,2vw,1.6rem);align-items:stretch;padding:clamp(.7rem,1.6vw,1.2rem) clamp(1rem,3vw,2.4rem) calc(.8rem + env(safe-area-inset-bottom,0px));background:#FFFFFF;max-height:46vh}
.panel .barra{border-radius:7px;background:var(--c)}
.p-cuerpo{display:flex;flex-direction:column;gap:.45rem;min-width:0;justify-content:center}
.p-cab{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap}
.p-anio{font-size:clamp(2.2rem,5.2vw,3.6rem);font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.p-titulo{font-size:clamp(1.1rem,2.2vw,1.7rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:0;text-wrap:balance}
.p-texto{font-size:clamp(.88rem,1.1vw,1.04rem);line-height:1.5;max-width:70ch;margin:0}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.chips li{border:2px solid var(--ink);border-radius:999px;padding:.02rem .8rem;font-weight:700;font-size:.82rem}
.p-ctl{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.2rem}
.p-ctl .sep{flex:1 1 auto}
.p-ctl .btn-ln,.p-ctl .pill{min-height:42px}
.medal{align-self:center;width:min(30vh,200px);aspect-ratio:1;border-radius:50%;background:var(--soft);position:relative;display:grid;place-items:center;color:var(--ink)}
.medal::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px dashed var(--ink);opacity:.35}
.medal svg{width:84%;height:84%;overflow:visible}
.panel.entra .p-cuerpo>*{animation:sube .55s var(--ease) both;animation-delay:calc(var(--k,0) * 70ms)}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (max-width:820px){.panel{grid-template-columns:10px minmax(0,1fr);overflow:auto;scrollbar-width:none}.panel::-webkit-scrollbar{display:none}.medal{display:none}.p-ctl .sep{display:none}}
@media (max-height:640px){.p-texto{font-size:.84rem;line-height:1.4}.p-cuerpo{gap:.3rem}.medal{width:min(26vh,150px)}}

/* ---------- Ventanas emergentes ---------- */
dialog{border:0;padding:0;border-radius:28px;width:min(620px,94vw);max-width:94vw;background:var(--paper);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog[open]{animation:dlgIn .5s var(--ease)}
@keyframes dlgIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
dialog::backdrop{background:color-mix(in srgb,var(--ink) 55%,transparent);backdrop-filter:blur(6px)}
.modal-in{display:flex;flex-direction:column;max-height:88vh;max-height:88dvh}
.modal-head{background:var(--bg);color:var(--fg);padding:1rem 1.3rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.modal-head h2{font-size:1.3rem;letter-spacing:-.02em}
.modal-head .btn-ln{min-height:40px;padding:.15rem 1rem;border-color:var(--fg)}
.modal-head .btn-ln:hover{background:var(--fg);color:var(--on)}
.modal-body{padding:1.1rem 1.3rem 1.4rem;overflow:auto;display:flex;flex-direction:column;gap:.8rem}
.modal-body .pill{align-self:flex-start}
.modal-body ul.bul{list-style:disc;padding-left:1.2rem;display:grid;gap:.35rem}
.bl{display:grid;gap:.1rem}
.bl li{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.7rem;padding:.4rem 0;border-top:1px solid var(--line);line-height:1.35}
.bl li:first-child{border-top:0}
.bl b{font-variant-numeric:tabular-nums}
.quote{font-size:1.6rem;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.toast{position:absolute;left:50%;top:4.6rem;transform:translateX(-50%);z-index:5;background:var(--fg);color:var(--on);padding:.4rem 1.2rem;border-radius:999px;font-weight:700;animation:toast .6s var(--ease) both}
.toast[hidden]{display:none}
@keyframes toast{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translateX(-50%)}}
.toast{z-index:20;top:4.2rem}
</style>

    return s+'<path class="m-draw" pathLength="1" style="--dl:900ms" d="M32 190 C60 186 70 90 108 84 C150 78 160 170 212 190" fill="none" stroke="var(--acc)" stroke-width="7" stroke-linecap="round"/>'; },

    var s='',c,r,hx=5,hy=2;
    for(r=0;r<6;r++)for(c=0;c<8;c++){ var d=Math.hypot(c-hx,(r-hy)*1.2), o=Math.max(.12,1-d/4.2); s+='<rect class="m-pop" style="--dl:'+Math.round(d*90)+'ms" x="'+(14+c*27)+'" y="'+(40+r*27)+'" width="23" height="23" rx="6" fill="var(--acc)" fill-opacity="'+o.toFixed(2)+'" stroke="currentColor" stroke-opacity=".35" stroke-width="2"/>'; }
    var px=14+hx*27+11.5, py=40+hy*27+11.5;
    return s+'<circle class="m-pulse" cx="'+px+'" cy="'+py+'" r="12" fill="none" stroke="currentColor" stroke-width="4"/><circle class="m-pop" style="--dl:900ms" cx="'+px+'" cy="'+py+'" r="9" fill="#fff" stroke="currentColor" stroke-width="4"/>'; }
};

/* ================= CONSTRUCCIÓN ================= */
var vw=0, pos=0, pulsoMini=false;
function construir(){
  var tr=$('#track'); tr.style.width=W+'px';
  /* franjas de etapa */
  var bs='';
  ETAPAS.forEach(function(e,k){
    var izq=(k===0)?0:Math.round((NODES[ETAPAS[k-1].hasta].x+NODES[e.desde].x)/2);
    var der=(k===ETAPAS.length-1)?W:Math.round((NODES[e.hasta].x+NODES[ETAPAS[k+1].desde].x)/2);
    var col=TONO[e.tono];
    bs+='<div class="banda'+(e.tono==='oscuro'?' sin-tinte':'')+'" style="left:'+izq+'px;width:'+(der-izq)+'px;--c:'+col.c+';--cf:'+col.cf+'"><span class="banda-et">'+esc(e.clave)+'</span></div>';
  });
  $('#bandas').innerHTML=bs;
  /* regla de años, corte del eje y distancia entre hitos */
  var d='', y;
  for(y=Math.ceil(Y0/50)*50;y<=NOW;y+=50){ d+='<span class="regla" style="left:'+(PAD+SALTO+(y-Y0)*K)+'px">'+y+'</span>'; }
  d+='<span class="corte" style="left:'+(PAD+SALTO/2)+'px">//</span>';
  for(var k=1;k<N;k++){
    var a=NODES[k-1], b=NODES[k];
    if(esAntes(a))continue;
    var dy=nodeYear(b)-nodeYear(a);
    if((b.x-a.x)>=120)d+='<span class="lapso" style="left:'+Math.round((a.x+b.x)/2)+'px">'+dy+(dy===1?' año':' años')+'</span>';
  }
  $('#detalles').innerHTML=d;
  /* hitos */
  var h='';
  NODES.forEach(function(n,i){
    var lado=(i%2===0)?'arriba':'abajo', y2=nodeYear(n);
    h+='<li class="ev '+lado+'" data-k="'+i+'" style="left:'+n.x+'px;--c:'+n.c+'">'
      +'<span class="tallo" aria-hidden="true"></span>'
      +'<button type="button" class="et" tabindex="-1" aria-hidden="true"><b>'+esc(n.hoy?'Hoy':(y2?String(y2):(n.display||n.label||'')))+'</b><span>'+esc(n.title)+'</span></button>'
      +'<button type="button" class="pin" aria-label="'+esc(nodeName(n)+': '+n.title)+'"></button></li>';
  });
  $('#evs').innerHTML=h;
  /* minimapa y progreso */
  var m='<div class="ventana" id="ventana"></div>';
  NODES.forEach(function(n,i){ m+='<i data-k="'+i+'" style="left:'+(n.x/W*100)+'%;--c:'+n.c+'"></i>'; });
  $('#mini').innerHTML=m;
  var dots=$('#dots'); dots.innerHTML=''; for(var q=0;q<N;q++)dots.appendChild(document.createElement('i')); dots.setAttribute('aria-valuemax',N);
}

/* ================= MOVIMIENTO ================= */
function medir(){ vw=$('#viewport').clientWidth; }
function limitar(p){ return Math.max(0,Math.min(Math.max(0,W-vw),p)); }
function mover(p,anim){
  pos=limitar(p);
  var tr=$('#track'), mn=$('#mini');
  tr.classList.toggle('libre',!anim||REDUCED); mn.classList.toggle('libre',!anim||REDUCED);
  tr.style.transform='translateX('+(-pos)+'px)';
  var v=$('#ventana'); v.style.left=(pos/W*100)+'%'; v.style.width=(Math.min(1,vw/W)*100)+'%';
  /* las etiquetas de las franjas se quedan a la vista mientras la franja siga en pantalla */
  $$('.banda').forEach(function(b){
    var izq=parseFloat(b.style.left), ancho=parseFloat(b.style.width), et=$('.banda-et',b);
    var dx=Math.max(0,Math.min(ancho-et.offsetWidth-32,pos-izq+8));
    et.style.transform='translateX('+dx+'px)';
  });
}
function centrar(i,anim){ mover(NODES[i].x-vw/2,anim); }
function masCercano(){ var c=pos+vw/2, mejor=0, md=1e9; NODES.forEach(function(n,i){ var d=Math.abs(n.x-c); if(d<md){md=d;mejor=i;} }); return mejor; }
function ocultarPista(){ $('#cue').classList.add('oculto'); }

/* ================= HITO ACTUAL ================= */
function pintarPanel(n){
  var p=$('#panel'), y=nodeYear(n);
  p.style.setProperty('--c',n.c); p.style.setProperty('--cf',n.cf);
  p.style.setProperty('--acc',n.acc); p.style.setProperty('--soft',rgba(n.acc,.14)); p.style.setProperty('--pip',n.acc);
  $('#p-anio').textContent=n.hoy?String(NOW):(y?String(y):(n.display||n.label||''));
  $('#p-titulo').innerHTML='<span class="sr-only">'+esc(nodeName(n))+'. </span>'+esc(n.title);
  $('#p-texto').textContent=n.text||'';
  $('#p-chips').innerHTML=[n.era].concat(n.themes||[]).filter(Boolean).map(function(t){return '<li>'+esc(t)+'</li>';}).join('');
  $('#idea').hidden=(n.id!==NODES[N-1].id)||!(OVA.quote&&OVA.quote.text);
  var m=$('#medal'); m.setAttribute('aria-label',n.alt||''); m.innerHTML=MOTIFS[n.motif]?'<svg viewBox="0 0 240 240" aria-hidden="true" focusable="false">'+MOTIFS[n.motif]()+'</svg>':'';
  p.classList.remove('entra'); void p.offsetWidth; p.classList.add('entra');
}
function renderProgress(){
  var d=visitedCount();
  $$('#dots i').forEach(function(el,k){ el.setAttribute('data-v',state.vis[k]?'1':'0'); el.setAttribute('data-c',k===state.i?'1':'0'); });
  var pr=$('#dots'); pr.setAttribute('aria-valuenow',d); pr.setAttribute('aria-valuetext',d+' de '+N+' años visitados');
  $('#prog-text').textContent=d+' de '+N;
  $$('#evs .ev').forEach(function(e,k){ e.setAttribute('data-v',state.vis[k]?'1':'0'); if(k===state.i){e.setAttribute('aria-current','step');}else{e.removeAttribute('aria-current');} });
  $$('#mini i').forEach(function(e,k){ e.setAttribute('data-v',state.vis[k]?'1':'0'); e.setAttribute('data-c',k===state.i?'1':'0'); });
  $('#prev').disabled=$('#prev2').disabled=(state.i===0); $('#next').disabled=$('#next2').disabled=(state.i===N-1);
  $('#prev').style.opacity=state.i===0?'.35':'1'; $('#next').style.opacity=state.i===N-1?'.35':'1';
}
function evaluate(){
  var all=(visitedCount()>=N), prev=Scorm.get('cmi.core.lesson_status');
  if(all){ Scorm.set('cmi.core.lesson_status','completed'); }
  else if(!prev||prev==='not attempted'){ Scorm.set('cmi.core.lesson_status','incomplete'); }
}
function goNode(i,opts){
  opts=opts||{};
  i=Math.max(0,Math.min(N-1,i));
  var changed=(i!==state.i)||opts.force;
  state.i=i; state.vis[i]=1;
  var n=NODES[i];
  centrar(i,!opts.silent);
  if(changed)pintarPanel(n);
  renderProgress();
  if(!opts.silent&&changed)announce(nodeName(n)+': '+n.title+'.');
  if(opts.user){ setPlay(false); ocultarPista(); }
  var wasDone=state.done;
  if(visitedCount()>=N&&!state.done){ state.done=1; var t=$('#toast'); t.hidden=false; setTimeout(function(){t.hidden=true;},3600); announce('Recorrido completo: visitaste los '+N+' años.'); }
  evaluate();
  if(state.done&&!wasDone)save(true); else save();
}
function setPlay(on){
  clearInterval(playT); playT=null;
  var b=$('#play'); if(!b)return;
  var was=b.getAttribute('aria-pressed')==='true';
  b.setAttribute('aria-pressed',on?'true':'false'); $('#play-t').textContent=on?'Pausar viaje':'Reproducir viaje'; $('.pp',b).textContent=on?'❚❚':'▶';
  if(on){
    ocultarPista();
    if(state.i>=N-1)goNode(0,{auto:true});
    var ms=parseInt(b.getAttribute('data-play-ms'),10)||CONFIG.playMs;
    playT=setInterval(function(){ if(state.i<N-1){goNode(state.i+1,{auto:true});}else{setPlay(false);} },ms);
    announce('Viaje iniciado. Pulsa Pausar viaje para detenerlo.');
  } else if(was){ announce('Viaje en pausa.'); }
}

/* ================= VENTANAS EMERGENTES ================= */
var lastOpener=null;
function openModal(title,html){
  setPlay(false);
  var dlg=$('#modal'); $('#modal-title').textContent=title; $('#modal-body').innerHTML=html;
  lastOpener=document.activeElement;
  dlg.onclose=function(){ var o=lastOpener; if(o&&o.focus&&document.contains(o))setTimeout(function(){o.focus();},0); };
  if(dlg.showModal){ try{dlg.showModal();}catch(e){dlg.setAttribute('open','');} } else { dlg.setAttribute('open',''); }
  $('#modal-title').focus();
}
function closeModal(){ var dlg=$('#modal'); if(dlg.close&&dlg.open){dlg.close();}else{dlg.removeAttribute('open'); if(dlg.onclose)dlg.onclose();} }
function helpHTML(){
  return '<ul class="bul"><li><strong>Arrastra la línea</strong> hacia los lados: al soltar se detiene en el año más cercano y abajo aparece lo que pasó.</li><li>También puedes <strong>pulsar un año</strong>, usar las flechas de los lados, <strong>Anterior</strong> y <strong>Siguiente</strong>, o pulsar el minimapa de abajo.</li><li>La distancia entre los años es real: cuanto más separados están, más tiempo pasó entre ellos. Los números sobre la línea cuentan esos años.</li><li>Los años que ya viste quedan rellenos.</li><li><strong>Reproducir viaje</strong> recorre los años solo; pulsa <strong>Pausar viaje</strong> cuando quieras. Con el teclado, las flechas izquierda y derecha cambian de año.</li></ul>';
}
function openMore(){
  var n=NODES[state.i], y=nodeYear(n), h=n.detail?'<p>'+esc(n.detail)+'</p>':'';
  if(n.bullets&&n.bullets.length)h+='<ul class="bl">'+n.bullets.map(function(b){return '<li><b>'+esc(b.when)+'</b><span>'+esc(b.text)+'</span></li>';}).join('')+'</ul>';
  h+='<p style="color:var(--muted)">Etapa: '+esc(n.era||'')+'.'+((OVA.meta&&OVA.meta.source)?' Fuente: '+esc(OVA.meta.source)+'.':'')+'</p>';
  openModal((n.hoy?'Hoy':(y?String(y):(n.yearLabel||n.label||'')))+': '+n.title,h);
}
function openQuote(){
  var q=OVA.quote||{};
  openModal('Una idea para llevar','<p class="quote">«'+esc(q.text||'')+'»</p>'+(q.author?'<p><strong>'+esc(q.author)+'</strong></p>':'')+(q.note?'<p>'+esc(q.note)+'</p>':''));
}
function endSession(){
  if(Scorm.isFinished())return;
  save(true); var st=Scorm.get('cmi.core.lesson_status');
  Scorm.terminate((st==='passed'||st==='completed'||st==='failed')?'':'suspend');
}

/* ================= EVENTOS ================= */
function initEventos(){
  var vp=$('#viewport'), x0=null, pos0=0, movido=false, ruedaT=null;
  function suelta(){ if(x0===null)return; var fue=movido; x0=null; vp.classList.remove('arrastrando'); if(fue){ goNode(masCercano(),{user:true}); } }
  vp.addEventListener('pointerdown',function(e){ if(e.button>0)return; x0=e.clientX; pos0=pos; movido=false; });
  window.addEventListener('pointermove',function(e){
    if(x0===null)return;
    var dx=e.clientX-x0;
    if(!movido&&Math.abs(dx)>6){ movido=true; vp.classList.add('arrastrando'); ocultarPista(); setPlay(false); }
    if(movido)mover(pos0-dx,false);
  });
  window.addEventListener('pointerup',suelta); window.addEventListener('pointercancel',suelta);
  vp.addEventListener('click',function(e){
    if(movido){ movido=false; e.preventDefault(); return; }
    var ev=e.target.closest?e.target.closest('.ev'):null; if(ev)goNode(parseInt(ev.getAttribute('data-k'),10),{user:true});
  },true);
  vp.addEventListener('wheel',function(e){
    e.preventDefault(); ocultarPista(); setPlay(false);
    mover(pos+(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY),false);
    clearTimeout(ruedaT); ruedaT=setTimeout(function(){ goNode(masCercano(),{user:true}); },220);
  },{passive:false});
  /* minimapa */
  var mn=$('#mini');
  function irA(e){ var r=mn.getBoundingClientRect(); var f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); mover(f*W-vw/2,false); }
  mn.addEventListener('pointerdown',function(e){ pulsoMini=true; ocultarPista(); setPlay(false); irA(e); });
  window.addEventListener('pointermove',function(e){ if(pulsoMini)irA(e); });
  window.addEventListener('pointerup',function(){ if(!pulsoMini)return; pulsoMini=false; goNode(masCercano(),{user:true}); });
  $('#prev').addEventListener('click',function(){ goNode(state.i-1,{user:true}); });
  $('#next').addEventListener('click',function(){ goNode(state.i+1,{user:true}); });
  $('#prev2').addEventListener('click',function(){ goNode(state.i-1,{user:true}); });
  $('#next2').addEventListener('click',function(){ goNode(state.i+1,{user:true}); });
  $('#play').addEventListener('click',function(){ setPlay($('#play').getAttribute('aria-pressed')!=='true'); });
  $('#mas').addEventListener('click',openMore);
  $('#idea').addEventListener('click',openQuote);
  document.addEventListener('click',function(e){ var t=e.target.closest?e.target.closest('[data-modal="help"]'):null; if(t)openModal('Ayuda',helpHTML()); });
  $('#modal-close').addEventListener('click',closeModal);
  $('#modal').addEventListener('click',function(e){ if(e.target===$('#modal'))closeModal(); });
  document.addEventListener('keydown',function(e){
    if($('#modal').open)return;
    if(e.key==='ArrowLeft'){ e.preventDefault(); goNode(state.i-1,{user:true}); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); goNode(state.i+1,{user:true}); }
  });
  window.addEventListener('resize',function(){ medir(); centrar(state.i,false); });
}

/* ================= INICIO ================= */
function init(){
  Scorm.init();
  try{ var raw=Scorm.get('cmi.suspend_data'); if(raw){ var o=JSON.parse(raw); if(o&&o.v===2)deepAssign(state,o); } }catch(e){}
  state.i=Math.max(0,Math.min(N-1,state.i||0));
  var TIT=(OVA.meta&&OVA.meta.title)||''; $('#h1').textContent=TIT; $('#titulo').textContent=TIT; if(TIT)document.title=TIT;
  construir(); medir(); initEventos();
  if(state.i>0||visitedCount()>1)ocultarPista();
  goNode(state.i,{silent:true,force:true});
  window.addEventListener('pagehide',function(){ if(!Scorm.isFinished())endSession(); });
  window.addEventListener('beforeunload',function(){ if(!Scorm.isFinished())endSession(); });
  save(true);
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();

</script>
</body>
