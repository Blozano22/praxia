<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio virtual: mesa de servicio al cliente</title>
<style>:root{
  --bg:#f2f5f3;--card:#fff;--ink:#14201b;--muted:#56665f;
  --brand:#0f4d3a;--brand2:#0a3328;--brand3:#b8912f;--accent:#c9a227;
  --ok:#1f7a4d;--okbg:#e3f1e9;--bad:#a63a32;--badbg:#f7e6e4;--line:#d6dfda;
  --radius:12px;--shadow:0 1px 2px rgba(10,51,40,.08),0 6px 18px rgba(10,51,40,.07);
  --grad:linear-gradient(90deg,var(--brand2),var(--mid));
  --tint:#e8eeec;--tint2:#eef3f0;--line2:#b9c7c0;--mid:#1f5c47;--accent-light:#e9d9a1;--accent-dark:#b8901f;--accent-soft:#f7f1dc;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--fs:17px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);line-height:1.6;font-size:var(--fs);background:var(--bg);overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 56px}
/* ---- Cabecera institucional ---- */
.hero{position:relative;background:linear-gradient(180deg,var(--brand2),var(--brand));color:#fff;padding:40px 16px 52px;border-bottom:5px solid var(--accent)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 18px);pointer-events:none}
.hero .in{position:relative;max-width:1040px;margin:0 auto;z-index:1}
.tag{display:inline-block;border:1px solid rgba(255,255,255,.45);padding:4px 12px;border-radius:4px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-light)}
.hero h1{margin:.7rem 0 .4rem;font-size:clamp(1.7rem,4.4vw,2.5rem);line-height:1.15;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0;max-width:740px;opacity:.93;font-size:1.08rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.meta span{background:rgba(255,255,255,.1);border-left:3px solid var(--accent);padding:4px 12px;font-size:.85rem}
/* ---- Secciones y tarjetas ---- */
section.sec{margin-top:34px}
h2{font-size:1.4rem;margin:0 0 14px;color:var(--brand2);font-weight:700;display:flex;align-items:center;gap:10px}
h2:before{content:"";width:5px;height:24px;background:var(--accent);flex:none}
h3{margin:.2rem 0 .4rem;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.grid{display:grid;gap:18px}
/* ---- Botones ---- */
.btn{font:inherit;cursor:pointer;border:2px solid var(--brand);border-radius:8px;padding:10px 22px;background:var(--brand);color:#fff;font-weight:600;letter-spacing:.01em;transition:background .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--brand2);border-color:var(--brand2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--brand)}
.btn.sec:hover:not(:disabled){background:var(--tint)}
.btn.warn{background:var(--accent);border-color:var(--accent);color:#1b1500}
.btn.warn:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ---- Retroalimentación ---- */
.fb{border-radius:8px;padding:12px 16px;margin-top:12px;border-left:5px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb.info{background:var(--tint);border-color:var(--brand)}
.fb b:first-child{display:block;margin-bottom:2px}
/* ---- Ventana emergente ---- */
.overlay{position:fixed;inset:0;background:rgba(8,28,22,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:12px;border-top:5px solid var(--accent);max-width:600px;width:100%;max-height:92vh;overflow:auto;padding:24px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal .x{position:absolute;top:10px;right:12px;border:0;background:var(--tint2);border-radius:6px;width:36px;height:36px;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--brand2)}
/* ---- Formularios y barras ---- */
.bar{height:10px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);width:0;transition:width .4s}
textarea,select,input[type=text]{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink)}
textarea:focus,select:focus,input[type=text]:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,77,58,.18)}
textarea{min-height:92px;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:var(--brand)}
label{font-weight:600}
/* ---- Ilustraciones ---- */
.art svg{width:100%;height:auto;display:block;border-radius:8px}
.art img{width:100%;display:block;border-radius:8px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:6px;background:var(--brand);color:#fff;font-weight:700;font-size:.9rem;flex:none}
.muted{color:var(--muted)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{margin-top:44px;padding:0 16px 34px;text-align:center;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.hero{background:#fff;color:#000}.btn{display:none}}
@media(max-width:600px){body{font-size:16.5px}.card{padding:16px}.hero{padding:28px 16px 40px}}
/* ---- Interacción obligatoria: bloqueos, avance, avisos ---- */
.gated>:not(.veil){display:none!important}
.gated>.veil{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line2);background:repeating-linear-gradient(135deg,var(--tint2),var(--tint2) 12px,var(--tint) 12px,var(--tint) 24px);border-radius:var(--radius);padding:26px 18px;color:var(--brand2);font-weight:600}
.veil h3{margin:6px 0 4px;font-size:1.15rem}
.veil p{margin:0;font-weight:400;color:var(--muted)}
.unlocked{animation:unl .5s}
@keyframes unl{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brand2);color:#fff;padding:10px 20px;border-radius:8px;border-left:5px solid var(--accent);z-index:90;transition:opacity .5s;max-width:92vw;text-align:center;box-shadow:var(--shadow);font-weight:600}
.toast.out{opacity:0}
.hud{position:fixed;top:12px;right:12px;z-index:60;background:var(--brand2);color:#fff;font-weight:600;font-size:.9rem;padding:6px 14px;border-radius:6px;border-left:4px solid var(--accent);box-shadow:var(--shadow)}
.hud.pop{animation:hudpop .35s}
@keyframes hudpop{50%{transform:scale(1.12)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{font-size:.9rem;color:var(--muted);margin:6px 0 0}
/* Iconos de contenido en tono neutro (evita aspecto infantil) */
.ico,.hot span,.lh .ic,.dot,.stepper li>span,.cust .av,.scn-i{filter:grayscale(1) contrast(1.05)}
/* Ventana emergente compacta: evita desplazamiento */
.modal{max-width:640px;padding:20px 24px;max-height:96vh}
.modal h3{margin:0 40px 8px 0;font-size:1.2rem}
.modal .art svg{height:84px;border-radius:6px}
.modal p{margin:.4rem 0}
.modal .fb{margin-top:8px;padding:10px 14px}
.modal .fb .hint{display:none}
.modal .reto .opt,.modal .opt{padding:8px 14px;margin:5px 0}
.opt:disabled,.reto .opt:disabled{color:var(--ink)}
.modal .row{margin-top:8px!important}
@media(max-height:760px){.modal .art{display:none}}
/* Ventana emergente: encabezado institucional, sin ilustración recortada */
.modal .art{display:none}
.modal h3{background:var(--brand2);color:#fff;margin:-20px -24px 14px;padding:16px 60px 16px 24px;font-size:1.1rem;border-radius:7px 7px 0 0}
.modal .x{background:rgba(255,255,255,.15);color:#fff;top:9px}
.modal .x:hover{background:rgba(255,255,255,.28)}
.modal .opt{border-radius:8px}
.modal .row{justify-content:flex-end}

/* Acordeón de secciones */
section.sec{scroll-margin-top:12px}
.ab[hidden]{display:none}
.ah{display:block;width:100%;font:inherit;text-align:left;cursor:pointer;border:0;background:none;padding:0;color:var(--brand2)}
.ah.open{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:700;margin:0 0 14px}
.ah.open:before{content:'';width:5px;height:24px;background:var(--accent);flex:none}
.ah.lock,.ah.done,.ah.idle{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 18px;border-radius:var(--radius);gap:0}
.ah.lock{border:2px dashed var(--line2);background:repeating-linear-gradient(135deg,var(--tint2),var(--tint2) 12px,var(--tint) 12px,var(--tint) 24px);cursor:not-allowed}
.ah.done{border:2px solid var(--ok);background:var(--okbg)}
.ah.idle{border:2px solid var(--brand);background:#fff}
.ah.done:hover,.ah.idle:hover{filter:brightness(.97)}
.ah .ic{font-size:1.5rem;line-height:1.2}
.ah.done .ic{color:var(--ok);font-weight:800}
.ah.idle .ic{color:var(--brand);font-size:1.1rem}
.ah .tt{font-weight:700;font-size:1.05rem}
.ah .st{font-size:.9rem;color:var(--muted);font-weight:400}
</style>
<style>
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font:inherit;cursor:pointer;border:2px solid var(--brand);background:#fff;color:var(--brand2);border-radius:10px 10px 0 0;padding:8px 16px;font-weight:700}
.tabs button.on{background:var(--brand);color:#fff}
.tabs button.vis:not(.on){border-color:var(--ok);background:var(--okbg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:8px}
.ctl div{background:#e8eeec;border-radius:10px;padding:8px 12px;font-size:.93rem}
.stepper{display:flex;gap:8px;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 14px}
.stepper li{flex:1 1 140px;border:2px solid #ccd6d1;border-radius:12px;padding:8px 12px;background:#fff;font-weight:600;display:flex;gap:8px;align-items:center}
.stepper li.cur{border-color:var(--accent);background:#f7f1dc}
.stepper li.ok{border-color:var(--ok);background:var(--okbg)}
.stepper li.lock{opacity:.55}
.cust{display:grid;grid-template-columns:auto 1fr 220px;gap:14px;align-items:center;margin-bottom:14px}
.cust .av{width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;filter:none!important}
.bub{background:#e8eeec;border-radius:16px 16px 16px 4px;padding:10px 14px;position:relative;font-style:italic}
.mood b{display:block;font-size:.85rem}
.mood .bar>i{transition:width .6s,background .6s}
.mood .em{font-size:1.8rem}
.lab{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;align-items:start}
.desk{background:linear-gradient(160deg,#2a2563,#3b2bb5);color:#fff;border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.desk h3{margin:0 0 4px;color:#fff}
.desk .sub{opacity:.75;font-size:.85rem;margin:0 0 10px}
.ticket{background:#fbfaf3;color:var(--ink);border-radius:10px;padding:10px 14px;border-left:8px solid var(--accent)}
.ticket .it{padding:8px 0;border-bottom:1px dashed #e6dcc0}
.ticket .it:last-child{border:0}
.ticket .top2{display:flex;gap:10px;align-items:flex-start}
.ticket .top2 label{flex:1;font-weight:400;display:flex;gap:10px;align-items:flex-start}
.ticket input{width:22px;height:22px;margin-top:1px}
.ticket .insp{font:inherit;cursor:pointer;border:1.5px solid var(--brand);background:#fff;color:var(--brand2);border-radius:8px;padding:2px 8px;font-size:.85rem}
.ticket .det{margin:6px 0 0 32px;font-size:.9rem;color:#5a4a1a;background:#f1e8c4;border-radius:8px;padding:5px 10px}
.ticket .rel{background:#efe3b0;border-radius:6px;padding:0 4px;font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{font:inherit;text-align:left;cursor:pointer;border:2px solid #c3cfc9;background:#fff;border-radius:12px;padding:12px 14px}
.opt.sel{border-color:var(--brand);background:#e6eeea;box-shadow:0 0 0 3px rgba(15,77,58,.2)}
.opt:disabled{cursor:default}
.ord{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.ord li{display:flex;gap:10px;align-items:center;border:2px solid #c3cfc9;border-radius:12px;padding:8px 12px;background:#fff}
.ord li span.n{font-weight:800;color:var(--brand2)}
.ord li .t{flex:1}
.ord button{border:1px solid #c3cfc9;background:#f3f6fa;border-radius:8px;width:36px;height:34px;cursor:pointer;font-size:1rem}
.res .fila{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.lik{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:6px;align-items:center;margin:6px 0;font-size:.95rem}
.lik input{width:20px;height:20px;justify-self:center}
@media(max-width:760px){.lab{grid-template-columns:1fr}.cust{grid-template-columns:auto 1fr}.cust .mood{grid-column:1/-1}.lik{grid-template-columns:1fr 1fr 1fr}.lik>span:first-child{grid-column:1/-1;font-weight:600}}
</style>
</head>
<body>
<!--
  PLANTILLA · Laboratorio virtual + Simulación de caso
  Interacción obligatoria: briefing en 3 pestañas → inspeccionar cada dato del ticket → decisiones en secuencia,
  con una clienta cuyo estado de ánimo reacciona a cada decisión.
  Rangos: 1 reto · 3–6 pasos · 2–4 puntos de decisión · retroalimentación por paso 25–40 palabras · 10–15 min.
  Verifique con: node validar.js
-->
<header class="hero"><div class="in" id="hero"></div></header>
<main class="wrap">
  <section class="sec" id="intro" aria-labelledby="t-intro"></section>
  <section class="sec" id="lab" aria-labelledby="t-lab"></section>
  <section class="sec" id="fin" aria-labelledby="t-fin" hidden></section>
</main>
<footer id="foot"></footer>

      "retroMal": "Ese mensaje no comprueba la conformidad del cliente. Debe informar la solución con una fecha concreta y preguntar si está de acuerdo. Cerrar sin confirmar o dar respuestas vagas deja el caso abierto y genera nuevos reclamos.",
      "resumen": "Comprobar la conformidad con la clienta",
      "cliente": {
        "ok": "«Gracias, estoy de acuerdo con la solución.»",
        "mal": "«No me quedó claro qué va a pasar con mi pedido.»"
      }
    }
  ],
  "resultado": {
    "alto": "Resultado sobresaliente: resolvió el caso con criterio en casi todas las etapas. Puede aplicar este procedimiento en solicitudes reales.",
    "medio": "Resultado aceptable: logró avanzar, pero algunas decisiones necesitaron corrección. Repita el laboratorio para afianzar los criterios.",
    "bajo": "Resultado inicial: varias decisiones requieren práctica. Repita el laboratorio con calma y apóyese en la retroalimentación de cada etapa."
  },
  "autoevaluacion": {
    "titulo": "Autoevaluación",
    "afirmaciones": [
      "Puedo identificar los datos relevantes de una solicitud.",
      "Sé clasificar un caso según su tipo y prioridad.",
      "Puedo ordenar las acciones para resolver y comunicar la solución."
    ],
    "niveles": [
      "Aún no",
      "Con ayuda",
      "Sí, con seguridad"
    ],
    "pregunta": "¿En qué situación concreta de su trabajo aplicaría lo practicado en este laboratorio?"
  },
  "cliente": {
    "saludo": "«Mi pedido llegó incompleto y mañana tengo reunión. ¿Pueden ayudarme?»",
    "nombre": "Marta Gómez"
  }
}</script>
<script>/* Utilidades compartidas por todas las plantillas */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='class')e.className=v;
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});
  return e;
}
const CFG=JSON.parse(document.getElementById('contenido').textContent);
const words=t=>(t||'').trim().split(/\s+/).filter(Boolean).length;
const norm=t=>(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function store(k,v){
  try{
    const key='ova:'+CFG.id+':'+k;
    if(v===undefined)return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key,JSON.stringify(v));
  }catch(e){return null}
}
function hero(){
  document.title=CFG.titulo;
  $('#hero').append(
    h('span',{class:'tag'},CFG.tipo),
    h('h1',{},CFG.titulo),
    ...(CFG.subtitulo?[h('p',{},CFG.subtitulo)]:[]),
    h('div',{class:'meta'},(CFG.meta||[]).map(m=>h('span',{},m)))
  );
  const f=$('#foot');
  if(f)f.textContent=CFG.pie||'Recurso educativo digital · plantilla reutilizable';
}
let _gid=0;
function art(icon,hue,img){
  const d=h('div',{class:'art','aria-hidden':'true'});
  if(img){d.append(h('img',{src:img,alt:''}));return d}
  const id='g'+(++_gid);
  d.innerHTML='<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a3328"/><stop offset="1" stop-color="#1f5c47"/></linearGradient><pattern id="'+id+'p" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern></defs><rect width="400" height="200" fill="url(#'+id+')"/><rect width="400" height="200" fill="url(#'+id+'p)"/><path d="M200 36l62 20v50c0 38-27 62-62 76-35-14-62-38-62-76V56z" fill="none" stroke="#c9a227" stroke-width="3"/><path d="M200 58l40 13v35c0 25-17 41-40 51-23-10-40-26-40-51V71z" fill="#c9a227" fill-opacity=".14" stroke="#c9a227" stroke-opacity=".6" stroke-width="1.5"/><rect x="0" y="192" width="400" height="8" fill="#c9a227"/></svg>';
  return d;
}
function modal(title,body){
  const prev=document.activeElement;
  const close=()=>{ov.remove();document.removeEventListener('keydown',esc);if(prev&&prev.focus)prev.focus()};
  const esc=ev=>{if(ev.key==='Escape')close()};
  const x=h('button',{class:'x','aria-label':'Cerrar ventana',onclick:close},'×');
  const ov=h('div',{class:'overlay',role:'dialog','aria-modal':'true','aria-label':title,onclick:ev=>{if(ev.target===ov)close()}},
    h('div',{class:'modal'},x,h('h3',{},title),body,h('div',{class:'row',style:'margin-top:14px'},h('button',{class:'btn sec',onclick:close},'Cerrar'))));
  document.body.append(ov);document.addEventListener('keydown',esc);x.focus();
  return close;
}
function fb(kind,title,text){return h('div',{class:'fb '+kind,role:'status'},h('b',{},title),text)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function download(name,text){
  const a=h('a',{href:URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),download:name});
  document.body.append(a);a.click();a.remove();
}

/* ---- Interacción obligatoria: avisos, confeti, puntos y bloqueo de secciones ---- */
function toast(msg){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const t=h('div',{class:'toast',role:'status'},msg);document.body.append(t);
  setTimeout(()=>t.classList.add('out'),2300);setTimeout(()=>t.remove(),2900);
}
function burst(){}
let _pts=0,_hud=null;
function addPts(n,why){
  _pts+=n;
  if(!_hud){_hud=h('div',{class:'hud','aria-live':'polite'});document.body.append(_hud)}
  _hud.textContent=''+_pts+' puntos';_hud.classList.remove('pop');void _hud.offsetWidth;_hud.classList.add('pop');
  if(why)toast('+'+n+' · '+why);
}
/* ---- Secciones principales tipo acordeón: bloqueada → abierta → completada (se puede reabrir) ---- */
const topLevel=el=>el.parentElement&&el.parentElement.matches('main.wrap')&&el.classList.contains('sec');
function accWrap(el){
  if(el._acc||el.hidden)return;
  const t=el.querySelector(':scope>h2');
  const title=t?t.textContent:'';
  if(t)t.remove();
  const ab=h('div',{class:'ab'});
  while(el.firstChild)ab.append(el.firstChild);
  const hd=h('button',{class:'ah',type:'button',id:t&&t.id||null});
  el.append(hd,ab);
  el._acc={locked:false,done:false,open:true,msg:'',title,hd,ab};
  hd.onclick=()=>{
    const a=el._acc;
    if(a.locked){toast('🔒 '+a.msg);hd.classList.add('shake');setTimeout(()=>hd.classList.remove('shake'),400);return}
    a.open?(a.open=false,accRender(el)):accOpen(el);
  };
  accRender(el);
}
function accRender(el){
  const a=el._acc;if(!a)return;
  const st=a.locked?'lock':a.open?'open':a.done?'done':'idle';
  a.hd.className='ah '+st;
  a.hd.setAttribute('aria-expanded',String(a.open));
  a.hd.replaceChildren(...(st==='open'?[h('span',{class:'tt'},a.title)]:[
    h('span',{class:'ic','aria-hidden':'true'},st==='lock'?'🔒':st==='done'?'✔':'▶'),
    h('span',{class:'tt'},a.title),
    h('span',{class:'st'},st==='lock'?a.msg:st==='done'?'Completada · toque para abrir':'En curso · toque para abrir')]));
  a.ab.hidden=!a.open;
}
function accOpen(el){
  accWrap(el);const a=el._acc;if(!a)return;
  a.locked=false;
  const all=[...el.parentElement.children].filter(x=>x._acc);
  const k=all.indexOf(el);
  all.forEach((x,j)=>{if(x===el)return;x._acc.open=false;if(j<k&&!x._acc.locked)x._acc.done=true;accRender(x)});
  a.open=true;accRender(el);
  setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),120);
}
function accAll(){$$('main.wrap>section.sec').forEach(accWrap)}
function gate(el,msg){
  if(topLevel(el)){accWrap(el);const a=el._acc;a.locked=true;a.open=false;a.msg=msg;accRender(el);return}
  el.classList.add('gated');el.setAttribute('inert','');
  const t=el.querySelector(':scope>h2');
  el._veil=h('div',{class:'veil'},h('div',{},h('div',{style:'font-size:2rem','aria-hidden':'true'},'🔒'),t?h('h3',{},t.textContent):null,h('p',{},msg)));
  el.append(el._veil);
}
function ungate(el,msg){
  if(topLevel(el)){if(!el._acc||!el._acc.locked)return;accOpen(el);toast('🔓 '+(msg||'Sección desbloqueada'));return}
  if(!el._veil)return;
  el._veil.remove();el._veil=null;el.removeAttribute('inert');el.classList.remove('gated');el.classList.add('unlocked');
  toast('🔓 '+(msg||'Sección desbloqueada'));
}
</script>
<script>
hero();
const E=CFG.etapas,T=CFG.ticket,CL=CFG.cliente;
const labSec=$('#lab');

/* ---- Briefing: 3 pestañas que hay que leer ---- */
(function(){
  const paneles=[
    ['Situación y objetivo',()=>h('div',{},h('p',{},CFG.contexto),h('h3',{},'Objetivo'),h('p',{},CFG.objetivo))],
    ['Condiciones',()=>h('div',{},h('ul',{},CFG.condiciones.map(c=>h('li',{},c))),h('h3',{},'▶ Instrucciones iniciales'),h('p',{},CFG.instrucciones))],
    ['Controles',()=>h('div',{},h('p',{},'Estos son los controles que usará en el laboratorio:'),h('div',{class:'ctl'},CFG.controles.map(c=>h('div',{},c.texto))))]
  ];
  const vis=new Set();
  const body=h('div',{class:'card',role:'tabpanel','aria-live':'polite'});
  const cnt=h('p',{class:'hint'});
  const go=h('button',{class:'btn warn',disabled:true,onclick:()=>{go.disabled=true;go.textContent='✔ Briefing completo';addPts(10,'Briefing leído');ungate(labSec,'¡Laboratorio desbloqueado!')}},'Iniciar laboratorio');
  const tb=h('div',{class:'tabs',role:'tablist'},paneles.map((p,i)=>h('button',{role:'tab',onclick:()=>sel(i)},p[0])));
  function sel(i){
    vis.add(i);$$('button',tb).forEach((b,k)=>{b.className=(k===i?'on ':'')+(vis.has(k)?'vis':'');b.setAttribute('aria-selected',String(k===i))});
    body.replaceChildren(paneles[i][1]());
    cnt.textContent='Pestañas leídas: '+vis.size+' de '+paneles.length;
    go.disabled=vis.size<paneles.length||go.textContent.startsWith('✔');
  }
  $('#intro').append(h('h2',{id:'t-intro'},'Briefing del reto'),tb,body,cnt,h('div',{class:'row',style:'margin-top:10px'},go));
  sel(0);
})();

/* ---- Laboratorio ---- */
let cur=0,st,sel,orden,marks,insp,mood,chkBtn;
const stepper=h('ol',{class:'stepper','aria-label':'Etapas del laboratorio'});
const desk=h('div',{class:'desk'});
const panel=h('div',{class:'panel','aria-live':'polite'});
const bub=h('div',{class:'bub'});
const moodBar=h('div',{class:'bar','aria-hidden':'true'},h('i'));
const moodEm=h('span',{class:'em','aria-hidden':'true'});
const moodTxt=h('b',{},'Estado de ánimo de la clienta');
labSec.append(h('h2',{id:'t-lab'},'Área de trabajo'),
  h('div',{class:'card cust'},h('div',{class:'av','aria-hidden':'true'},'MG'),h('div',{},h('b',{},CL.nombre),bub),h('div',{class:'mood'},moodTxt,h('div',{class:'row',style:'flex-wrap:nowrap'},moodEm,h('div',{style:'flex:1'},moodBar)))),
  stepper,h('div',{class:'lab'},desk,panel));
function setMood(delta,text){
  if(delta!=null)mood=Math.max(0,Math.min(100,mood+delta));
  const i=$('i',moodBar);i.style.width=mood+'%';i.style.background=mood<35?'#b3261e':mood<60?'#f4a100':'#1b7f4b';
  moodEm.textContent=mood<35?'':mood<60?'':mood<85?'':'';
  if(text)bub.textContent=text;
}
function reset(){
  st=E.map(()=>({ok:false,tries:0}));cur=0;sel=null;marks=new Set();orden=null;insp=new Set();mood=20;
  $('#fin').hidden=true;setMood(0,CL.saludo);render();if(labSec._acc&&!labSec._acc.locked)accOpen(labSec);
}
function renderStepper(){
  stepper.replaceChildren(...E.map((e,i)=>h('li',{class:st[i].ok?'ok':i===cur?'cur':i>cur?'lock':'','aria-current':i===cur?'step':null},h('span',{'aria-hidden':'true'},st[i].ok?'✅':i>cur?'🔒':e.icono),(i+1)+'. '+e.nombre,e.decision?h('small',{class:'muted',title:'Punto de decisión'},' ◆'):null)));
}
function renderDesk(){
  const body=h('div',{class:'ticket'});
  const done=st[0].ok,active=cur===0&&!done;
  T.datos.forEach(d=>{
    if(active){
      const cb=h('input',{type:'checkbox',id:d.id,disabled:!insp.has(d.id),'aria-label':d.texto});cb.checked=marks.has(d.id);
      cb.onchange=()=>{cb.checked?marks.add(d.id):marks.delete(d.id)};
      const det=h('div',{class:'det',hidden:!insp.has(d.id)},d.detalle);
      const bi=h('button',{class:'insp',disabled:insp.has(d.id),onclick:()=>{insp.add(d.id);det.hidden=false;cb.disabled=false;bi.disabled=true;bi.textContent='✔ Visto';addPts(2);
        if(chkBtn&&E[cur].clave==='observar')chkBtn.disabled=insp.size<T.datos.length;
        if(insp.size===T.datos.length)toast('Ya puede marcar los datos relevantes y comprobar.')}},insp.has(d.id)?'✔ Visto':'Inspeccionar');
      body.append(h('div',{class:'it'},h('div',{class:'top2'},h('label',{for:d.id},cb,d.texto),bi),det));
    }else body.append(h('div',{class:'it'},h('span',{class:d.relevante?'rel':''},d.texto)));
  });
  desk.replaceChildren(h('h3',{},''+T.titulo),h('p',{class:'sub'},active?'1) Inspeccione cada dato (). 2) Marque solo los relevantes.':'Datos relevantes resaltados.'),body);
}
function render(){
  renderStepper();renderDesk();
  const e=E[cur],out=h('div',{'aria-live':'polite'});
  const box=h('div');
  box.append(h('h3',{style:'margin-top:0'},'Etapa '+(cur+1)+': '+e.nombre+(e.decision?' (punto de decisión)':'')),h('p',{},e.instruccion));
  let get;
  if(e.clave==='observar'){
    box.append(h('p',{class:'hint'},'🔒 «Comprobar» se habilita cuando inspeccione los '+T.datos.length+' datos del ticket.'));
    get=()=>{const rel=T.datos.filter(d=>d.relevante).map(d=>d.id).sort().join(),m=[...marks].sort().join();return rel===m};
  }else if(e.opciones){
    const bs=e.opciones.map((o,j)=>h('button',{class:'opt'+(sel===j?' sel':''),'aria-pressed':String(sel===j),onclick:()=>{sel=j;bs.forEach((b,k)=>{b.classList.toggle('sel',k===j);b.setAttribute('aria-pressed',String(k===j))})}},o.texto));
    box.append(h('div',{class:'opts'},bs));
    get=()=>sel==null?null:e.opciones[sel].ok;
  }else if(e.acciones){
    if(!orden){orden=e.acciones.map((_,i)=>i);do{orden=shuffle(orden)}while(orden.every((v,i)=>v===i))}
    const ul=h('ol',{class:'ord'});
    const draw=()=>{ul.replaceChildren(...orden.map((v,pos)=>h('li',{},
      h('span',{class:'n'},(pos+1)+'.'),h('span',{class:'t'},e.acciones[v]),
      h('button',{'aria-label':'Subir acción',disabled:pos===0,onclick:()=>{[orden[pos-1],orden[pos]]=[orden[pos],orden[pos-1]];draw()}},'▲'),
      h('button',{'aria-label':'Bajar acción',disabled:pos===orden.length-1,onclick:()=>{[orden[pos+1],orden[pos]]=[orden[pos],orden[pos+1]];draw()}},'▼'))))};
    draw();box.append(ul);
    get=()=>orden.every((v,i)=>v===i);
  }
  const bChk=h('button',{class:'btn',onclick:()=>{
    const r=get();
    if(r===null){out.replaceChildren(fb('bad','Falta su selección','Elija una opción antes de comprobar.'));return}
    if(e.clave==='observar'&&marks.size===0){out.replaceChildren(fb('bad','Falta su selección','Marque al menos un dato en el ticket antes de comprobar.'));return}
    st[cur].tries++;
    if(r){
      const first=st[cur].tries===1;
      st[cur].ok=true;bChk.disabled=true;renderStepper();renderDesk();
      setMood(first?25:12,e.cliente.ok);addPts(first?10:5,first?'¡A la primera!':'Corregido');
      out.replaceChildren(fb('ok','✔ Correcto · '+(first?'a la primera':'tras corregir'),e.retroOk),
        h('div',{class:'row',style:'margin-top:10px'},h('button',{class:'btn',onclick:()=>{cur<E.length-1?(cur++,sel=null,render()):final()}},cur<E.length-1?'Continuar a la siguiente etapa →':'Ver resultado final')));
    }else{setMood(-10,e.cliente.mal);panel.classList.add('shake');setTimeout(()=>panel.classList.remove('shake'),400);out.replaceChildren(fb('bad','✘ Aún no · puede corregir y volver a intentarlo',e.retroMal))}
  }},'Comprobar');
  if(e.clave==='observar')bChk.disabled=insp.size<T.datos.length;
  chkBtn=bChk;
  box.append(h('div',{class:'row'},bChk),out);
  panel.replaceChildren(box);
}
function final(){
  const pts=st.reduce((s,x)=>s+(x.tries===1?2:1),0),max=E.length*2,pct=pts/max;
  const k=pct>=0.85?'alto':pct>=0.6?'medio':'bajo';
  if(k==='alto')burst();
  const f=$('#fin');f.hidden=false;f._acc=null;
  f.replaceChildren(h('h2',{id:'t-fin'},'Resultado final'),
    h('div',{class:'card res'},
      h('h3',{style:'margin-top:0'},'Puntaje: '+pts+' de '+max+' ('+Math.round(pct*100)+' %) · Ánimo final de la clienta: '+moodEm.textContent),
      h('div',{class:'bar','aria-hidden':'true'},h('i',{style:'width:'+pct*100+'%'})),
      fb(k==='alto'?'ok':k==='medio'?'info':'bad','Valoración',CFG.resultado[k]),
      h('h3',{},'Aciertos y aspectos por mejorar'),
      ...E.map((e,i)=>h('div',{class:'fila'},h('span',{'aria-hidden':'true'},st[i].tries===1?'✅':''),h('div',{},h('b',{},e.nombre+': '),e.resumen+'. ',
        h('span',{class:st[i].tries===1?'':'muted'},st[i].tries===1?'Acierto a la primera.':'Requirió '+st[i].tries+' intentos: conviene repasar este criterio.')))),
      h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn',onclick:()=>{reset();labSec.scrollIntoView({behavior:'smooth'})}},'⟲ Repetir el laboratorio'))),
    autoeval());
  accWrap(f);accOpen(f);
}
function autoeval(){
  const A=CFG.autoevaluacion,val=A.afirmaciones.map(()=>null);
  const out=h('div',{'aria-live':'polite'});
  const rows=A.afirmaciones.map((a,i)=>h('div',{class:'lik',role:'radiogroup','aria-label':a},h('span',{},a),
    A.niveles.map((n,j)=>h('label',{style:'display:flex;flex-direction:column;align-items:center;font-weight:400;font-size:.8rem'},h('input',{type:'radio',name:'au'+i,value:j,onchange:()=>val[i]=j}),n))));
  const ta=h('textarea',{'aria-label':A.pregunta,placeholder:'Escriba su respuesta…'});
  return h('div',{class:'card',style:'margin-top:16px'},h('h3',{style:'margin-top:0'},''+A.titulo),
    ...rows,h('label',{style:'display:block;margin-top:10px'},A.pregunta),ta,
    h('div',{class:'row',style:'margin-top:10px'},h('button',{class:'btn',onclick:()=>{
      if(val.some(v=>v==null)){out.replaceChildren(fb('bad','Falta responder','Valore las tres afirmaciones para ver su resumen.'));return}
      const bajos=A.afirmaciones.filter((a,i)=>val[i]<2);
      out.replaceChildren(bajos.length?fb('info','Resumen de su autoevaluación','Conviene reforzar: '+bajos.join(' ')+' Repita el laboratorio para practicar estos puntos.'):fb('ok','Resumen de su autoevaluación','Se siente seguro en los tres criterios. Aplique lo practicado en su próxima atención real y compártalo con su equipo.'));
    }},'Ver mi autoevaluación')),out);
}
reset();
gate(labSec,'Lea las 3 pestañas del briefing para desbloquear el laboratorio.');
accAll();
</script>
