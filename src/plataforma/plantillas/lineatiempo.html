<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITULO}}</title>
<!--
  PLANTILLA · lineatiempo
  CAMPOS DEL JSON (sacados del contenido de ejemplo; los límites de palabras de cada formación están en la guía de plantillas):
    id  texto
    tipo  texto
    codigo  texto
    clase  texto
    unidadNum  número
    tag  texto
    titulo  texto
    chips  lista (0 elementos en el ejemplo)
    pie  texto
    info  objeto
    tituloSecuencia  texto
    intro  texto
    eventos  lista (5 elementos en el ejemplo)
      .fecha  texto
      .titulo  texto
      .texto  texto
      .cambio  texto
      .img  texto
    comparar  texto
    actividad  vacío
  FORMACIÓN: el JSON puede traer "nivel" (tecnologia, profesional, especializacion o doctorado) o la dirección ?nivel=; sin nivel se usa Tecnológico.
  TEXTOS: los títulos de interfaz son fijos y genéricos en el HTML; claves de "textos" ajustables: ninguna.
-->
<style>/*CSS*/</style>
<style>
/* ===== Línea de tiempo · diseño 1: eje vertical azul noche con todos los momentos + hoja de lectura a pantalla completa ===== */
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{padding:0;height:100dvh;overflow:hidden;background:#fff;color:var(--nav);line-height:1.5}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
.so{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);background:#fff;overflow:hidden}

/* Barra superior */
.top{display:flex;align-items:center;gap:16px;padding:8px clamp(14px,2.4vw,32px);border-bottom:2px solid var(--nav)}
.tt{flex:1 1 auto;min-width:0;font-size:clamp(.95rem,1.4vw,1.2rem);font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.pg .bar{width:clamp(70px,11vw,150px)}
.tools{display:flex;gap:8px;flex:none}
.tools .btn{min-height:44px;padding:4px 16px;font-size:.82rem}
.tools .ico{display:none}

/* Cuerpo: eje + hoja */
.main{display:grid;grid-template-columns:minmax(250px,31%) minmax(0,1fr);min-height:0}
.rail{background:var(--nav);color:#fff;min-height:0;display:flex;padding:10px 0}
.rail ol{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;isolation:isolate}
.rail li{position:relative;flex:1 0 46px;min-height:0;display:flex}
.rail li:not(:last-child)::before{content:"";position:absolute;z-index:1;left:30px;width:4px;top:50%;bottom:-50%;background:var(--brand2);transition:background-color .3s var(--ease)}
.rail li.seg::before{background:var(--cyan)}
.rb{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin:0;padding:0 14px;border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:44px}
.rb::before{content:"";position:absolute;z-index:0;inset:2px 10px 2px 6px;border-radius:14px;background:transparent;transition:background-color .25s var(--ease)}
.rail li.on .rb::before{background:var(--brand)}
.rail li.on .rb::after{content:"";position:absolute;z-index:2;left:0;top:50%;width:5px;height:24px;margin-top:-12px;border-radius:3px;background:var(--lime)}
@media (hover:hover){.rail li:not(.on):not(.lk) .rb:hover::before{background:var(--brand2)}}
.rb:focus-visible{outline:3px solid #fff;outline-offset:-3px;border-radius:14px}
.nd{position:relative;z-index:3;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);color:#fff;font-weight:800;font-size:.92rem;font-variant-numeric:tabular-nums;background:var(--nav);
  transition:transform .25s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.rail li.vista .nd{background:var(--cyan);border-color:var(--cyan);color:var(--cyan-ink)}
.rail li.on .nd{background:#fff;border-color:#fff;color:var(--nav);transform:scale(1.12)}
.rail li.lk .nd{border-style:dashed;background:var(--nav);color:#fff}
.rail li.lk .rb{cursor:not-allowed;opacity:.62}
.rt{position:relative;z-index:2;min-width:0;display:flex;flex-direction:column;gap:1px}
.rd{font-size:clamp(.88rem,1.15vw,1.05rem);font-weight:800;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.rn{font-size:clamp(.8rem,.85vw,1rem);line-height:1.28;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rail ol.tight .rn{-webkit-line-clamp:1}
.rail ol.nano .rn{display:none}

/* Hoja de lectura */
.sheet{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);padding:clamp(14px,3vh,30px) clamp(18px,3.4vw,48px) clamp(12px,2.4vh,24px);overflow:hidden;background:#fff}
.sheet>*{position:relative;z-index:1}
.big{position:absolute!important;z-index:0!important;right:clamp(10px,2.4vw,34px);top:-2vh;font-size:clamp(7rem,30vh,17rem);line-height:1;font-weight:800;letter-spacing:-.06em;color:var(--tint);pointer-events:none;user-select:none;font-variant-numeric:tabular-nums}
.dt{font-size:clamp(1.5rem,4.6vh,2.6rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;color:var(--brand);overflow-wrap:anywhere}
.ti{font-size:clamp(1.3rem,4.2vh,2.4rem);font-weight:800;line-height:1.1;letter-spacing:-.02em;color:var(--nav);text-wrap:balance;max-width:26ch}
.ti:focus{outline:none}
.bd{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(14px,2.4vw,32px)}
.sheet.conimg .bd{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.tx{min-height:0;overflow:auto;max-width:68ch;font-size:19px;line-height:1.55}
.tx p{margin:0 0 .75em;font-size:inherit}
.im{align-self:center;justify-self:center;width:100%;max-height:100%;object-fit:cover;border-radius:var(--r-card);border:2px solid var(--nav)}
.cam{display:flex;gap:14px;align-items:baseline;padding:12px 18px;border-radius:var(--r-card);background:var(--brand);color:var(--on-brand,#fff);max-width:76ch}
.cam b{flex:none;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.cam p{font-size:clamp(.92rem,1.1vw,1.02rem);font-weight:600;line-height:1.4}
.ct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ct .sp{flex:1 1 auto}
.ahint{font-size:.8rem;font-weight:700;color:var(--muted)}
.hint{font-size:.86rem;font-weight:700;color:var(--brand);transition:opacity .6s var(--ease)}
.hint.off{opacity:0}
.sheet.ent>:not(.big){animation:rise .42s var(--ease) both;animation-delay:calc(var(--k,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.app.shake .sheet{animation:sacude .28s var(--ease)}
@keyframes sacude{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Celular: el eje pasa arriba, en horizontal */
@media (max-width:760px){
  .tools .lbl{display:none}.tools .ico{display:inline}.tools .btn{padding:4px 14px}
  .pg .bar{display:none}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{padding:8px 0}
  .rail ol{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 8px}
  .rail li{flex:0 0 74px}
  .rail li:not(:last-child)::before{left:50%;top:26px;bottom:auto;width:100%;height:4px}
  .rb{flex-direction:column;justify-content:flex-start;gap:4px;padding:6px 2px;text-align:center}
  .rb::before{inset:0 2px;border-radius:12px}
  .rail li.on .rb::after{left:50%;top:auto;bottom:2px;margin:0 0 0 -12px;width:24px;height:4px}
  .rt .rn{display:none}
  .rd{font-size:.72rem}
  .sheet{overflow:auto;padding:16px 16px 18px}
  .big{font-size:7rem}
  .sheet.conimg .bd{grid-template-columns:minmax(0,1fr)}
  .tx{overflow:visible;font-size:17px}
  .bd{flex:none}
  .cam{flex-direction:column;gap:2px}
  .ct{position:sticky;bottom:0;background:#fff;padding:8px 0}
}
@media (prefers-reduced-motion:reduce){.sheet.ent>:not(.big),.app.shake .sheet{animation:none!important}}
</style>
<style>/*TEMA*/</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1 class="tt" id="tt"></h1>
    <div class="pg"><div class="bar" id="bar" role="progressbar" aria-label="Momentos revisados" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><i></i></div><span id="pt"></span></div>
    <div class="tools" role="group" aria-label="Herramientas">
      <button type="button" class="btn sec" id="bAyuda" aria-label="Ayuda"><span class="lbl">Ayuda</span><span class="ico" aria-hidden="true">?</span></button>
      <button type="button" class="btn sec" id="bReini" aria-label="Reiniciar recurso"><span class="lbl">Reiniciar</span><span class="ico" aria-hidden="true">&#8634;</span></button>
    </div>
  </header>
  <div class="main">
    <nav class="rail" aria-label="Momentos de la línea de tiempo"><ol id="ln"></ol></nav>
    <section class="sheet" id="sheet" aria-live="polite"></section>
  </div>
</div>
<div id="live" class="so" role="status" aria-live="polite" aria-atomic="true"></div>
<script type="application/json" id="contenido">/*CONTENIDO*/</script>
<script>/*TEMAJS*/</script>
<script>/*LIB*/</script>
<script>
document.title=CFG.titulo;
const E=(CFG.eventos||[]).filter(e=>e.fecha||e.texto);
const N=E.length;
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
let cur=0;const vistos=new Set(FREE?E.map((_,i)=>i):[0]);
const canOpen=i=>!LOCK||vistos.has(i)||vistos.has(i-1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const anuncia=t=>{const l=$('#live');if(l){l.textContent='';setTimeout(()=>l.textContent=t,40)}};
const etiqueta=(e,i)=>e.fecha||('Momento '+(i+1));
let items=[],actHost=null,bAct=null,bAnt=null,bSig=null,aviso=null,hintEl=null;

/* ---- ajuste del texto: el más grande que quepa en su espacio ---- */
function fit(el,max,min){
  el.style.fontSize=max+'px';let s=max;
  while(s>min&&el.scrollHeight>el.clientHeight+1){s-=1;el.style.fontSize=s+'px'}
}
/* Un solo tamaño para todos los hitos: el mayor que cabe en el hito con más texto */
let TAM=0;
function ajusta(){
  const tx=$('#tx');if(!tx||!N)return;
  if(innerWidth<=760){tx.style.fontSize='';TAM=0}
  else{
    let t=99;
    for(let i=0;i<N;i++){llena(i);fit(tx,t===99?clamp(Math.round(innerHeight*.04),17,30):t,14);t=Math.min(t,parseFloat(tx.style.fontSize))}
    TAM=t;llena(cur);tx.style.fontSize=TAM+'px';
  }
  const ol=$('#ln');ol.classList.remove('tight','nano');
  const hRow=items.length?ol.clientHeight/N:99;
  if(hRow<70)ol.classList.add('tight');
  if(hRow<50)ol.classList.add('nano');
}

/* ---- actividad opcional: vista propia que se abre desde la hoja ---- */
function montaActividad(){
  if(!CFG.actividad)return;
  actHost=h('div',{hidden:true});document.body.append(actHost);
  actividadUI(actHost,CFG.actividad);
}
function abreActividad(){
  if(!actHost)return;
  const b=actHost.querySelector('.lanz .btn');
  if(b){b.click();return}
  const nodos=[...actHost.childNodes];
  const cierra=()=>{ov.remove();document.body.style.overflow='';document.removeEventListener('keydown',esc);nodos.forEach(n=>actHost.append(n));if(bAct)bAct.focus()};
  const esc=e=>{if(e.key==='Escape')cierra()};
  const ov=h('div',{class:'vact',role:'dialog','aria-modal':'true','aria-label':'Actividad'},h('div',{class:'hoja'},...nodos,h('div',{class:'pieact'},h('span',{class:'sp'}),h('button',{class:'btn sec',type:'button',onclick:cierra},'← Volver al recurso'))));
  document.body.append(ov);document.body.style.overflow='hidden';document.addEventListener('keydown',esc);
}
const hayCapa=()=>!!document.querySelector('.vact,.overlay');

/* ---- construcción ---- */
function arma(){
  $('#tt').textContent=CFG.tituloSecuencia||CFG.titulo;
  const sheet=$('#sheet');
  if(!N){sheet.append(h('p',{class:'dt'},'Esta línea de tiempo todavía no tiene momentos. Agréguelos en el editor.'));return}
  const ol=$('#ln');
  items=E.map((e,i)=>{
    const n=h('b',{},String(i+1));
    const nd=h('span',{class:'nd','aria-hidden':'true'},n);
    const rb=h('button',{type:'button',class:'rb',id:'rb'+i,'aria-label':etiqueta(e,i)+(e.titulo?': '+e.titulo:''),onclick:()=>sel(i),
      onkeydown:ev=>{const d=ev.key==='ArrowDown'?1:ev.key==='ArrowUp'?-1:0;if(d&&items[i+d]){ev.preventDefault();items[i+d].rb.focus()}}},
      nd,h('span',{class:'rt'},h('span',{class:'rd'},etiqueta(e,i)),e.titulo?h('span',{class:'rn'},e.titulo):null));
    const li=h('li',{},rb);ol.append(li);return{li,rb,n};
  });
  /* hoja de lectura */
  const big=h('span',{class:'big','aria-hidden':'true',id:'big'});
  bAnt=h('button',{class:'btn sec',type:'button',onclick:()=>ir(-1)},'◂ Anterior');
  bSig=h('button',{class:'btn',type:'button',onclick:()=>ir(1)},'Siguiente ▸');
  const ct=h('div',{class:'ct',style:'--k:5'},bAnt,bSig);
  if(!CFG.actividad){hintEl=h('span',{class:'hint'},'Elige un momento en el eje o pulsa Siguiente.');ct.append(hintEl)}
  if(CFG.actividad){
    bAct=h('button',{class:'btn',type:'button',onclick:abreActividad,'aria-describedby':'ahint'},'Ir a la actividad →');
    aviso=h('span',{class:'ahint',id:'ahint'},'Se habilita al ver todos los momentos.');
    ct.append(h('span',{class:'sp'}),aviso,bAct);
  }
  sheet.append(big,h('p',{class:'dt',id:'dt',style:'--k:0'}),h('h2',{class:'ti',id:'ti',tabindex:'-1',style:'--k:1'}),
    h('div',{class:'bd',style:'--k:2'},h('div',{class:'tx',id:'tx'}),h('div',{id:'imw'})),h('div',{id:'camw',style:'--k:3'}),ct);
  setTimeout(()=>{if(hintEl)hintEl.classList.add('off')},8000);
}
function pinta(i,anim){
  const s=$('#sheet');
  llena(i);
  if(TAM)$('#tx').style.fontSize=TAM+'px';
  s.classList.remove('ent');if(anim&&!REDUCED){void s.offsetWidth;s.classList.add('ent')}
}
function llena(i){
  const e=E[i],s=$('#sheet');
  $('#big').textContent=String(i+1).padStart(2,'0');
  $('#dt').textContent=etiqueta(e,i);
  $('#ti').replaceChildren(h('span',{class:'so'},'Momento '+(i+1)+'. '),e.titulo||'');
  $('#ti').hidden=!e.titulo;
  $('#tx').replaceChildren(...String(e.texto||'').split(/\n+/).filter(Boolean).map(t=>h('p',{},t)));
  $('#tx').scrollTop=0;
  const w=$('#imw');w.replaceChildren(...(e.img?[h('img',{class:'im',src:e.img,alt:''})]:[]));w.hidden=!e.img;
  s.classList.toggle('conimg',!!e.img);
  $('#camw').replaceChildren(...(e.cambio?[h('div',{class:'cam'},h('b',{},'¿Qué cambió?'),h('p',{},e.cambio))]:[]));
}
function upd(){
  if(!N)return;
  items.forEach((x,i)=>{
    const on=i===cur,lk=!canOpen(i);
    x.li.classList.toggle('on',on);x.li.classList.toggle('vista',vistos.has(i));x.li.classList.toggle('lk',lk);
    x.li.classList.toggle('seg',vistos.has(i)&&vistos.has(i+1));
    if(on)x.rb.setAttribute('aria-current','step');else x.rb.removeAttribute('aria-current');
    lk?x.rb.setAttribute('aria-disabled','true'):x.rb.removeAttribute('aria-disabled');
    x.n.textContent=lk?'🔒':vistos.has(i)&&!on?'✓':String(i+1);
  });
  const bar=$('#bar');bar.setAttribute('aria-valuemax',N);bar.setAttribute('aria-valuenow',vistos.size);
  $('i',bar).style.width=(vistos.size/N*100)+'%';
  $('#pt').textContent=vistos.size+' de '+N;
  bAnt.disabled=cur===0;bSig.disabled=cur===N-1;
  const todos=vistos.size===N;
  if(bAct){bAct.disabled=!todos;aviso.hidden=todos}
  if(todos)ovaCompleto();
}
function sel(i){
  if(!canOpen(i)){
    toast('🔒 Revise primero el momento anterior.');
    if(!REDUCED){const a=$('#app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}
    return}
  if(hintEl)hintEl.classList.add('off');
  if(i===cur&&$('#dt').textContent)return;
  cur=i;vistos.add(i);
  ovaUbicacion('hito-'+(i+1));
  pinta(i,true);upd();
  anuncia(etiqueta(E[i],i)+': '+(E[i].titulo||''));
}
function ir(d){const j=cur+d;if(j<0||j>=N)return;sel(j);items[j].rb.focus({preventScroll:true})}
function reiniciar(){
  vistos.clear();(FREE?E.map((_,i)=>i):[0]).forEach(i=>vistos.add(i));cur=0;
  if(N){pinta(0,false);upd();if(hintEl)hintEl.classList.remove('off')}
  toast('Recurso reiniciado');
}
function ayuda(){
  const li=t=>h('li',{style:'list-style:disc'},t);
  modal('Ayuda',h('ul',{style:'margin:0;padding-left:1.2rem;display:grid;gap:6px'},
    li('Pulse un momento del eje para leer su información.'),
    li('Use Anterior y Siguiente, o las flechas del teclado, para recorrerlos en orden.'),
    li('Los momentos con ✓ ya los revisó.'+(LOCK?' Cada momento se habilita al ver el anterior.':'')),
    CFG.actividad?li('Al revisar todos los momentos se habilita la actividad.'):null));
}
$('#bAyuda').addEventListener('click',ayuda);
$('#bReini').addEventListener('click',reiniciar);
document.addEventListener('keydown',e=>{
  if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||hayCapa())return;
  const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  if(e.key==='ArrowRight'){e.preventDefault();ir(1)}else if(e.key==='ArrowLeft'){e.preventDefault();ir(-1)}
});
addEventListener('resize',ajusta);
arma();
if(N){
  vistos.add(0);ovaUbicacion('hito-1');pinta(0,false);upd();ajusta();
  let rw=0;if(window.ResizeObserver)new ResizeObserver(()=>{const w=$('#sheet').clientWidth+'x'+$('#sheet').clientHeight;if(w!==rw){rw=w;ajusta()}}).observe($('#sheet'));
}
montaActividad();
</script>
</body>
</html>
