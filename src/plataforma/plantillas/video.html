<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITULO}}</title>
<style>/*CSS*/</style>
<style>
/* ===== Video · escenario de color a pantalla completa + panel de escenas y transcripción ===== */
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#fff}
body{font-size:16px;line-height:1.5}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;background:#fff}
.mn{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,32%)}
.stage{--sbg:var(--nav);--sfg:#fff;position:relative;min-width:0;min-height:0;overflow:hidden;color:var(--sfg);background:var(--sbg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:2vh;padding:clamp(14px,3.2vh,34px) clamp(16px,2.8vw,44px);background-size:cover;background-position:center;font-size:clamp(14px,2.6vh,24px);transition:background-color .4s var(--ease)}
.stage[data-c="1"]{--sbg:var(--brand)}
.stage[data-c="2"]{--sbg:var(--mid)}
.stage[data-c="3"]{--sbg:var(--brand2)}
.stage[data-c="4"]{--sbg:var(--cyan);--sfg:var(--cyan-ink)}
.stage .shade{position:absolute;inset:0;background:var(--nav);opacity:0;pointer-events:none}
.stage.img .shade{opacity:.55}
.stage>*{position:relative}
.scn{justify-self:start;font-size:.6em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;border:2px solid currentColor;padding:.35em 1.1em;border-radius:var(--r-pill)}
.mid{min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:.6em}
.mid h2{margin:0;color:inherit;font-size:3.3em;line-height:1.05;font-weight:800;letter-spacing:-.025em;text-wrap:balance;max-width:16ch;overflow-wrap:anywhere;animation:rise .45s var(--ease) both}
.mid h2:before{display:none}
.mid p{margin:0;max-width:40ch;font-size:1.25em;font-weight:600;line-height:1.5;animation:rise .45s var(--ease) .08s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sub{background:#fff;color:var(--nav);border-radius:var(--r-card);padding:.7em 1.2em;font-weight:700;font-size:1em;line-height:1.45;min-height:3.4em;display:flex;align-items:center;max-height:34vh;overflow:hidden}
.sub.off{visibility:hidden}
.poster{position:absolute!important;inset:0;background:var(--nav);display:flex;flex-direction:column;gap:2vh;align-items:center;justify-content:center;padding:24px;z-index:2;color:#fff;text-align:center}
.poster[hidden]{display:none}
.poster h2{color:#fff;margin:0;font-size:clamp(1.6rem,7vh,3.6rem);line-height:1.1;font-weight:800;letter-spacing:-.02em;text-wrap:balance;max-width:20ch}
.poster h2:before{display:none}
.poster p{margin:0;font-weight:700;font-size:1rem;opacity:.92}
.poster .btn{background:#fff;border-color:#fff;color:var(--nav)}
.poster .btn:hover:not(:disabled){background:var(--cyan);border-color:var(--cyan);color:var(--cyan-ink)}
.poster .btn.sec{background:transparent;color:#fff;border-color:#fff}
.poster .btn.sec:hover:not(:disabled){background:#fff;color:var(--nav)}
.big{width:clamp(64px,13vh,104px);height:clamp(64px,13vh,104px);border-radius:50%;border:0;background:#fff;color:var(--nav);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease),background-color .2s var(--ease)}
.big svg{width:42%;height:42%;margin-left:8%}
.big:hover{transform:scale(1.06);background:var(--cyan);color:var(--cyan-ink)}
.big:active{transform:scale(.94)}
.pr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* panel derecho */
.rp{min-width:0;min-height:0;overflow:hidden;background:#fff;color:var(--nav);padding:clamp(14px,3vh,30px) clamp(14px,1.8vw,26px);display:flex;flex-direction:column;gap:1.1em;font-size:clamp(14px,2.7vh,23px);border-left:1.5px solid var(--line)}
.rp h1{margin:0;font-size:1.5em;line-height:1.15;font-weight:800;letter-spacing:-.015em;text-wrap:balance;color:var(--nav)}
.rp .ri{margin:0;font-size:.95em;line-height:1.5;border-left:.3em solid var(--brand);padding-left:.8em;font-weight:600}
.rp h3{margin:0;font-size:.68em;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--brand)}
.lst{display:flex;flex-direction:column;gap:.5em;min-height:0}
.it{flex:none;font:inherit;text-align:left;cursor:pointer;border:2px solid var(--nav);background:#fff;color:var(--nav);border-radius:var(--r-card);padding:.55em 1em;min-height:44px;display:block;width:100%;transition:background-color .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}
.it:hover:not([aria-disabled="true"]){background:var(--tint)}
.it:active{transform:scale(.985)}
.it b{display:flex;align-items:center;gap:.6em;font-size:1em;font-weight:800;line-height:1.3}
.it.vis b:after{content:"✓";margin-left:auto;font-size:.9em}
.it.on{background:var(--nav);color:#fff}
.it.on.vis b:after{content:none}
.it.on b:before{content:"";flex:none;width:.6em;height:.6em;border-radius:50%;background:var(--lime)}
.it .tx{display:none;margin:.4em 0 0;font-size:.92em;line-height:1.55;font-weight:500}
.it.on .tx{display:block;animation:rise .35s var(--ease) both}
.it[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
/* controles */
.ct{display:flex;align-items:center;gap:clamp(6px,1vw,12px);padding:8px clamp(12px,2vw,28px);border-top:1.5px solid var(--line);background:#fff;flex-wrap:nowrap}
.ct .btn{flex:none;padding:6px 16px;font-size:.82rem;white-space:nowrap}
.ct .ico{width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ct .ico svg{width:18px;height:18px}
.pg{flex:1 1 120px;height:12px;background:var(--tint);border-radius:var(--r-pill);overflow:hidden;cursor:pointer;position:relative;min-width:60px}
.pg:before{content:"";position:absolute;inset:-16px 0}
.pg i{display:block;height:100%;width:0;background:var(--nav);border-radius:var(--r-pill);transition-property:width;transition-timing-function:linear}
.tm{font-weight:800;color:var(--nav);font-size:.85rem;min-width:5.6em;text-align:center;font-variant-numeric:tabular-nums}
.btn[aria-pressed="true"]{background:var(--nav);color:#fff;border-color:var(--nav)}
.btn[aria-pressed="false"]{background:transparent;color:var(--nav)}
@media(max-width:900px){.ct .lb{display:none}.ct .btn.tg{width:44px;padding:0}}
@media(max-width:760px){
  .mn{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;overflow-y:auto}
  .stage{font-size:15px;gap:8px;padding:12px 16px;min-height:42dvh}
  .mid{overflow:visible}.sub{max-height:none}
  .mid h2{font-size:2em}.mid p{font-size:1em}
  .rp{overflow:visible;border-left:0;border-top:1.5px solid var(--line);font-size:15px}
  .tm{display:none}
  .ct{gap:6px;padding:6px 10px;flex-wrap:wrap}
  .ct .pg{order:-1;flex:1 1 100%;margin:4px 0}
}
</style>
<style>/*TEMA*/</style>
</head>
<body>
<div id="app">
  <div class="mn">
    <section class="stage" id="stage" aria-label="Video"></section>
    <aside class="rp" id="rp"></aside>
  </div>
  <div class="ct" id="ct" role="group" aria-label="Controles del video"></div>
</div>
<div hidden id="act"></div>
<script type="application/json" id="contenido">/*CONTENIDO*/</script>
<script>/*TEMAJS*/</script>
<script>/*LIB*/</script>
<script>
document.title=CFG.titulo;
const E=CFG.escenas||[];
const IC={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg>',re:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',cc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 11.5a2 2 0 1 0 0 1M15 11.5a2 2 0 1 0 0 1"/></svg>',vo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>'};
const cues=[];let acc=0;
E.forEach((e,i)=>{const d=Math.max(3,words(e.narracion)/2.2)+0.8;cues.push({i,d,t0:acc});acc+=d});
const TOTAL=acc||1;
const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const vis=new Set();let fin=false,actGate=null;
/* Tamaño de texto UNIFORME en todas las escenas (solo escritorio): se mide cada escena y se usa el menor tamaño que hace caber a todas. */
const FSU={};
const mob=()=>matchMedia('(max-width:760px)').matches;
const ovf=el=>el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1;
function busca(el){el.style.fontSize='';const pb=el.style.paddingBottom;el.style.paddingBottom=(parseFloat(getComputedStyle(el).paddingBottom)+8)+'px';let f=parseFloat(getComputedStyle(el).fontSize),n=0;el.style.fontSize=f+'px';while((el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)&&f>11&&n++<80){f-=.5;el.style.fontSize=f+'px'}el.style.paddingBottom=pb;return f}
function fit(el,key){if(!el)return;if(mob()||!FSU[key]){el.style.fontSize='';return}let f=FSU[key],n=0;el.style.fontSize=f+'px';while(ovf(el)&&f>11&&n++<80){f-=.5;el.style.fontSize=f+'px'}FSU[key]=f}

function abrirAct(){const l=$('.lanz button',$('#act'));if(l){l.click();return}const o=$('#actv');if(o)o.hidden=false}

(function(){
  const stageEl=$('#stage'),rp=$('#rp'),ct=$('#ct');
  if(!E.length){stageEl.append(h('div',{class:'mid'},h('p',{},'Este recurso todavía no tiene escenas. Agréguelas en el editor.')));return}
  let k=-1,playing=false,timer=null,cc=true,voice=false,maxReach=0;
  const shade=h('div',{class:'shade'});
  const scn=h('span',{class:'scn'});
  const mid=h('div',{class:'mid'});
  const sub=h('div',{class:'sub',role:'status','aria-live':'off'});
  const bPlay=h('button',{class:'big','aria-label':'Reproducir video',onclick:()=>{fin||k<0?start(0):toggle()}});bPlay.innerHTML=IC.play;
  const poster=h('div',{class:'poster'},h('h2',{},CFG.titulo),bPlay,h('p',{},E.length+' escenas · aprox. '+fmt(TOTAL)+' min'));
  stageEl.append(shade,scn,mid,sub,poster);
  const pgI=h('i');
  const pg=h('div',{class:'pg',role:'slider','aria-label':'Progreso','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':'0',tabindex:'0',onclick:e=>{const r=pg.getBoundingClientRect();seek((e.clientX-r.left)/r.width*TOTAL)},onkeydown:e=>{if(e.key==='ArrowRight'&&k<E.length-1)go(k+1);if(e.key==='ArrowLeft'&&k>0)go(k-1)}},pgI);
  const time=h('span',{class:'tm'},'0:00 / '+fmt(TOTAL));
  const bTog=h('button',{class:'btn',type:'button',onclick:()=>{fin||k<0?start(0):toggle()}});
  const bRe=h('button',{class:'btn sec ico',type:'button',onclick:()=>start(0),'aria-label':'Reiniciar'});bRe.innerHTML=IC.re;
  const bCC=h('button',{class:'btn sec tg',type:'button','aria-pressed':'true','aria-label':'Subtítulos',onclick:()=>{cc=!cc;sub.classList.toggle('off',!cc);bCC.setAttribute('aria-pressed',cc)}});bCC.innerHTML=IC.cc+'<span class="lb">&nbsp;Subtítulos</span>';
  const bVo=h('button',{class:'btn sec tg',type:'button','aria-pressed':'false','aria-label':'Narración con voz',onclick:()=>{
    if(!('speechSynthesis' in window)){toast('Su navegador no ofrece voz; use los subtítulos.');return}
    voice=!voice;bVo.setAttribute('aria-pressed',voice);
    if(playing){clearTimeout(timer);speechSynthesis.cancel();cue(k)}
  }});bVo.innerHTML=IC.vo+'<span class="lb">&nbsp;Voz</span>';
  [bCC,bVo].forEach(b=>{b.style.display='inline-flex';b.style.alignItems='center';b.style.justifyContent='center'});
  const bAct=CFG.actividad?h('button',{class:'btn',type:'button',disabled:LOCK,title:LOCK?'Vea el video completo para continuar':'',onclick:abrirAct},'Ir a la actividad →'):null;
  ct.append(...[bTog,bRe,pg,time,bCC,bVo,bAct].filter(Boolean));
  /* panel derecho */
  const lst=h('div',{class:'lst',role:'list'});
  const items=E.map((e,i)=>h('button',{type:'button',class:'it',role:'listitem',onclick:()=>go(i)},h('b',{},e.titulo||('Escena '+(i+1))),h('p',{class:'tx'},e.narracion||'')));
  items.forEach(b=>lst.append(b));
  rp.append(...[h('h1',{},CFG.titulo),(CFG.info&&CFG.info.resultado)?h('p',{class:'ri'},CFG.info.resultado):null,h('h3',{},'Escenas y transcripción'),lst].filter(Boolean));
  function go(i){if(LOCK&&i>maxReach){toast('Vea las escenas en orden.');return}start(i)}
  const setPlay=p=>{playing=p;bPlay.innerHTML=p?IC.pause:IC.play;bTog.innerHTML=(p?IC.pause:IC.play)+'<span>&nbsp;'+(p?'Pausar':'Reproducir')+'</span>';bTog.style.display='inline-flex';bTog.style.alignItems='center';$$('svg',bTog).forEach(s=>{s.style.width='16px';s.style.height='16px'})};
  setPlay(false);
  function escena(i){
    const e=E[i];
    scn.textContent='Escena '+(i+1)+' de '+E.length;
    mid.replaceChildren(h('h2',{},e.titulo||('Escena '+(i+1))),e.visual?h('p',{},e.visual):null);
    stageEl.style.backgroundImage=e.img?'url('+e.img+')':'';stageEl.classList.toggle('img',!!e.img);stageEl.dataset.c=i%5;
    sub.textContent=e.narracion;
    items.forEach((b,n)=>{b.classList.toggle('on',n===i);b.classList.toggle('vis',vis.has(n));b.setAttribute('aria-current',n===i?'true':'false');b.setAttribute('aria-disabled',String(LOCK&&n>maxReach))});
  }
  const ajusta=()=>{fit(mid,'mid');fit(rp,'rp');fit(sub,'sub')};
  function medir(){
    for(const x in FSU)delete FSU[x];if(mob())return;
    const m={mid:99,rp:99,sub:99};
    E.forEach((_,i)=>{escena(i);m.mid=Math.min(m.mid,busca(mid));m.rp=Math.min(m.rp,busca(rp));m.sub=Math.min(m.sub,busca(sub))});
    Object.assign(FSU,m);escena(Math.max(k,0));ajusta();
  }
  let rz=null;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(medir,150)});
  function cue(i){
    clearTimeout(timer);if('speechSynthesis' in window)speechSynthesis.cancel();
    if(i>=cues.length){finish();return}
    k=i;maxReach=Math.max(maxReach,i);vis.add(i);const q=cues[i],e=E[i];
    poster.hidden=true;fin=false;
    escena(i);
    pgI.style.transitionDuration='0s';pgI.style.width=(q.t0/TOTAL*100)+'%';void pgI.offsetWidth;
    if(playing){pgI.style.transitionDuration=q.d+'s';pgI.style.width=((q.t0+q.d)/TOTAL*100)+'%'}
    pg.setAttribute('aria-valuenow',Math.round(q.t0/TOTAL*100));
    time.textContent=fmt(q.t0)+' / '+fmt(TOTAL);
    ovaUbicacion('e'+(i+1));
    ajusta();
    if(!playing)return;
    if(voice&&'speechSynthesis' in window){
      const u=new SpeechSynthesisUtterance(e.narracion);u.lang='es-ES';
      let done=false;const nx=()=>{if(!done){done=true;clearTimeout(timer);if(playing)cue(i+1)}};
      u.onend=nx;u.onerror=nx;speechSynthesis.speak(u);timer=setTimeout(nx,q.d*1000+8000);
    }else timer=setTimeout(()=>cue(i+1),q.d*1000);
  }
  function start(i){setPlay(true);cue(i)}
  function toggle(){
    if(playing){setPlay(false);clearTimeout(timer);if('speechSynthesis' in window)speechSynthesis.cancel();pgI.style.transitionDuration='0s';pgI.style.width=(cues[k].t0/TOTAL*100)+'%'}
    else{setPlay(true);cue(Math.max(k,0))}
  }
  function seek(t){let i=0;cues.forEach((q,n)=>{if(q.t0<=t)i=n});if(LOCK&&i>maxReach)i=maxReach;start(i)}
  function finish(){
    setPlay(false);fin=true;k=cues.length-1;
    pgI.style.transitionDuration='0s';pgI.style.width='100%';time.textContent=fmt(TOTAL)+' / '+fmt(TOTAL);
    items.forEach((b,n)=>b.classList.toggle('vis',vis.has(n)));
    if(vis.size===E.length){ovaCompleto();if(bAct)bAct.disabled=false}
    poster.hidden=false;
    poster.replaceChildren(h('h2',{},'Fin del video'),h('div',{class:'pr'},h('button',{class:'btn sec',type:'button',onclick:()=>start(0)},'Ver de nuevo'),bAct?h('button',{class:'btn',type:'button',disabled:bAct.disabled,onclick:abrirAct},'Ir a la actividad →'):null));
  }
  medir();cue(0);clearTimeout(timer);poster.hidden=false;
  if(FREE&&bAct)bAct.disabled=false;
})();

if(CFG.actividad){
  const hostA=h('div');$('#act').append(hostA);
  actividadUI(hostA,CFG.actividad);
  if(!$('.lanz',hostA)){
    const ov=h('div',{id:'actv',hidden:true,style:'position:fixed;inset:0;z-index:70;background:#fff;overflow:auto;padding:clamp(14px,3vw,36px)'},h('div',{style:'max-width:860px;margin:0 auto'},hostA,h('div',{style:'margin-top:14px'},h('button',{class:'btn sec',type:'button',onclick:()=>{ov.hidden=true}},'← Volver al video'))));
    document.body.append(ov);$('#act').hidden=true;
  }
}
</script>
</body>
</html>
