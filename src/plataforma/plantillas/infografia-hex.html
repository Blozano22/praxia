<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITULO}}</title>
<style>/*CSS*/</style>
<style>
:root{--t0:var(--brand);--f0:#fff;--t1:var(--mid);--f1:#fff;--t2:var(--cyan);--f2:var(--cyan-ink);--t3:var(--brand2);--f3:#fff;--t4:var(--nav);--f4:#fff}
.t0{--c:var(--t0);--f:var(--f0)}.t1{--c:var(--t1);--f:var(--f1)}.t2{--c:var(--t2);--f:var(--f2)}.t3{--c:var(--t3);--f:var(--f3)}.t4{--c:var(--t4);--f:var(--f4)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;padding:0;background:#fff;color:var(--nav);font-family:var(--font);line-height:1.5;font-size:16px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font-family:inherit}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:clamp(.6rem,1.6vw,1.4rem);padding:clamp(.4rem,1vh,.8rem) clamp(1rem,3vw,2.4rem);min-height:clamp(54px,8.5vh,70px);border-bottom:2px solid var(--line)}
.tt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tt .kk{font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.tt h1{font-size:clamp(1.05rem,1.9vw,1.55rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance;color:var(--nav)}
.prog{flex:none;display:flex;align-items:center;gap:.6rem;font-size:.88rem;font-weight:800;white-space:nowrap}
.dots{display:flex;gap:5px}
.dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--nav);transition:background-color .3s var(--ease),transform .3s var(--ease)}
.dots i.on{background:var(--nav)}
.dots i.ac{transform:scale(1.35)}
.tools{flex:none;display:flex;gap:.5rem}
.tools .btn.off,.tools .btn.off:hover{opacity:.5;background:var(--nav);border-color:var(--nav);color:#fff;cursor:not-allowed}
.ic{display:inline-flex;width:1.2em;height:1.2em;flex:none;vertical-align:middle}
.ic svg{width:100%;height:100%}
.ay p{margin:0 0 .6rem;line-height:1.6}
.ay p:last-child{margin:0}
.lima{display:inline-block;flex:none;width:13px;height:13px;border-radius:50%;background:var(--lime);border:2px solid var(--nav)}
.chl{display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:var(--nav);border-radius:999px;padding:2px 11px;font-size:.68rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.ckm{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--nav);color:var(--nav);flex:none}
.ckm svg{width:12px;height:12px}
.pista{display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem;font-weight:700;color:var(--nav)}
/* Texto de lectura: se escala solo (--k) hasta llenar el espacio sin cortarse */
.cuerpo{--k:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:calc(var(--k)*clamp(.5rem,1.4vh,.95rem))}
.txt{font-size:calc(var(--k)*clamp(.94rem,.55vw + .55vh,1.15rem));line-height:1.55}
.sub{font-size:calc(var(--k)*clamp(1rem,.6vw + .6vh,1.22rem));font-weight:800;line-height:1.3}
.idea{border-left:6px solid var(--c);padding:.15rem 0 .15rem .9rem}
.idea b{display:block;font-size:calc(var(--k)*.7rem);letter-spacing:.1em;text-transform:uppercase;color:var(--nav)}
.idea span{display:block;font-size:calc(var(--k)*clamp(1rem,.7vw + .5vh,1.28rem));font-weight:800;line-height:1.3}
.fu{align-self:flex-start;border:2px solid var(--line);border-radius:999px;padding:2px 13px;font-size:calc(var(--k)*.82rem);color:var(--nav)}
.pts{display:flex;flex-direction:column;gap:calc(var(--k)*.45rem)}
.pts li{display:flex;gap:.65rem;align-items:flex-start;font-size:calc(var(--k)*clamp(.92rem,.5vw + .5vh,1.1rem));line-height:1.45}
.pts li i{flex:none;font-style:normal;width:calc(var(--k)*26px);height:calc(var(--k)*26px);border-radius:50%;background:var(--c);color:var(--f);display:grid;place-items:center;font-size:calc(var(--k)*.78rem);font-weight:800}
.nv{flex:none;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.nv .pp{font-size:.88rem;font-weight:800}
.pistaf{position:absolute;left:50%;bottom:clamp(.8rem,2vh,1.4rem);transform:translateX(-50%);z-index:5;display:flex;gap:.5rem;align-items:center;background:var(--nav);color:#fff;border-radius:999px;padding:.45rem 1.1rem;font-weight:700;font-size:.9rem;box-shadow:0 8px 22px rgba(20,39,73,.3);animation:pop .5s var(--ease) both;transition:opacity .45s;pointer-events:none;max-width:92vw}
.pistaf.x{opacity:0}
@keyframes sube{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.en .cuerpo>*{animation:sube .5s var(--ease) both;animation-delay:calc(var(--j,0)*70ms + 60ms)}
@media(max-width:760px){.dots{display:none}.top{padding:.4rem 1rem;gap:.5rem}.tools .btn{padding:6px 14px}}

/* Infografía de panal: introducción a la izquierda, hexágonos que encajan a la derecha; cada uno abre su lectura */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(1rem,2.6vw,2.4rem);padding:clamp(.6rem,1.8vh,1.2rem) clamp(1rem,3vw,2.4rem) clamp(.7rem,2vh,1.3rem)}
.intro{--k:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--k)*clamp(.7rem,2vh,1.3rem))}
.intro .de{font-size:calc(var(--k)*clamp(1.05rem,.9vw + .7vh,1.4rem));font-weight:700;line-height:1.45;letter-spacing:-.005em}
.intro .rl{border-left:6px solid var(--brand);padding:.1rem 0 .1rem .9rem}
.intro .rl b{display:block;font-size:calc(var(--k)*.7rem);letter-spacing:.1em;text-transform:uppercase}
.intro .rl span{display:block;font-size:calc(var(--k)*clamp(.95rem,.5vw + .5vh,1.12rem));line-height:1.5;margin-top:2px}
.intro .dt{background:var(--brand2);color:#fff;border-radius:20px;padding:calc(var(--k)*clamp(.8rem,2vh,1.3rem)) clamp(1rem,1.8vw,1.5rem)}
.intro .dt b{display:block;font-size:calc(var(--k)*.7rem);letter-spacing:.12em;text-transform:uppercase;opacity:.9;margin-bottom:.25rem}
.intro .dt span{display:block;font-size:calc(var(--k)*clamp(.95rem,.55vw + .5vh,1.15rem));line-height:1.5}
.intro .pista{margin-top:.2rem}
.intro .pista .ic{width:1.5em;height:1.5em}
.hive{position:relative;min-height:0;min-width:0}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.hxw{position:absolute}
.hxw:has(.hx:focus-visible){filter:drop-shadow(0 0 2px var(--nav)) drop-shadow(0 0 2px var(--nav)) drop-shadow(0 0 2px var(--nav))}
.hx{position:relative;width:100%;height:100%;border:0;cursor:pointer;background:var(--c);color:var(--f);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;padding:0 17%;text-align:center;transition:transform .2s var(--ease),filter .2s var(--ease)}
.hx:hover:not(.lk){transform:scale(1.05)}
.hx:active:not(.lk){transform:scale(.96)}
.hx.lk{background:var(--tint);color:var(--nav);cursor:not-allowed}
.hx .nu{font-size:1.7rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.hx .ti{font-size:.86rem;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.hx img{width:42px;height:42px;object-fit:contain}
.hx .ck{position:absolute;top:11%;left:50%;margin-left:-11px}
.hx .lm{position:absolute;top:10%;right:27%}
.hxc{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--nav);color:#fff;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);font-weight:800;font-size:1.1rem;line-height:1.2;letter-spacing:-.01em}
.hxc>div{padding:0 38px}
.cm{display:none;text-align:center;font-weight:800;margin:.4rem 0 0}
/* Lectura de un hexágono */
.ov{position:fixed;inset:0;z-index:70;background:rgba(20,39,73,.62);display:grid;place-items:center;padding:clamp(.6rem,3vw,2rem);animation:vIn .2s var(--ease) both}
@keyframes vIn{from{opacity:0}to{opacity:1}}
.hoja{width:min(880px,100%);height:min(88dvh,640px);display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:#fff;border:2px solid var(--nav);animation:hIn .3s var(--ease) both}
@keyframes hIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.hoja .cab{flex:none;display:flex;align-items:center;gap:clamp(.8rem,1.6vw,1.2rem);background:var(--c);color:var(--f);padding:clamp(.6rem,1.6vh,1rem) clamp(1.1rem,2.2vw,1.8rem)}
.hoja .num{flex:none;width:clamp(40px,4.4vw,56px);aspect-ratio:1;border-radius:50%;background:var(--f);color:var(--c);display:grid;place-items:center;font-size:clamp(1.05rem,1.8vw,1.5rem);font-weight:800}
.hoja .cab h2{flex:1;min-width:0;font-size:clamp(1.15rem,2.2vw,1.75rem);font-weight:800;letter-spacing:-.025em;line-height:1.1;color:inherit;text-wrap:balance}
.hoja .cerrar{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;font-size:1.5rem;line-height:1;cursor:pointer;transition:background-color .2s var(--ease),color .2s var(--ease)}
.hoja .cerrar:hover{background:var(--f);color:var(--c)}
.hoja .cuerpo{flex:1 1 auto;padding:clamp(.8rem,2vh,1.4rem) clamp(1.1rem,2.2vw,1.8rem)}
.hoja .nv{padding:.55rem clamp(1.1rem,2.2vw,1.8rem);border-top:2px solid var(--nav)}
@media(max-width:760px){
  .main{display:block;overflow:auto}
  .intro{overflow:visible;justify-content:flex-start;margin-bottom:.8rem}
  .cm{display:block}
  .hoja{height:min(92dvh,720px);border-radius:18px}
  .hoja .cuerpo{overflow:auto}
}

<div class="app">
  <header class="top">

    <div class="prog" id="prog"></div>
    <div class="tools"><button class="btn sm" id="bAct" type="button">Ir a la actividad</button><button class="btn sec sm" id="bAy" type="button">Ayuda</button></div>
  </header>
  <main class="main" id="main">
    <section class="intro" id="intro"></section>
    <section class="hive" id="hive" aria-label="Panal de bloques"><div class="stage" id="stage"></div></section>
  </main>
</div>

<script>
const SV={
  mano:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.2a5 5 0 0 1-4-2L4.5 15a1.6 1.6 0 0 1 2.4-2L9 15"/></svg>',
  cand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const ico=(k,c)=>{const s=h('span',{class:'ic'+(c?' '+c:''),'aria-hidden':'true'});s.innerHTML=SV[k];return s};
const okm=()=>{const s=h('span',{class:'ckm','aria-hidden':'true'});s.innerHTML=SV.ok;return s};
const pars=t=>String(t||'').split(/\n+/).filter(Boolean);
const quieto=matchMedia('(prefers-reduced-motion:reduce)').matches;
const movil=()=>innerWidth<760;
/* Escala el texto de un panel (variable --k) para que llene el espacio y no se corte; en celular se desliza sin barra */
function ajusta(el){
  if(!el)return;
  if(movil()){el.style.setProperty('--k','1');return}
  let k=1.3;el.style.setProperty('--k',k);
  while(el.scrollHeight>el.clientHeight+1&&k>.62){k=Math.round((k-.04)*100)/100;el.style.setProperty('--k',k)}
}
/* Escala UNIFORME: prueba el contenido de todos los bloques en el mismo panel y usa el menor --k,
   para que el texto tenga el mismo tamaño en todos los bloques (se recalcula si cambia el tamaño del panel) */
const _K={};
function kUniforme(clave,el,gen,n,sobra){
  if(!el)return;
  sobra=sobra||(e=>e.scrollHeight>e.clientHeight+1);
  if(movil()){el.style.setProperty('--k','1');return}
  const W=el.clientWidth,H=el.clientHeight,c=_K[clave];
  if(c&&c.w===W&&H>=c.h-2){el.style.setProperty('--k',c.k);let k=c.k;while(sobra(el)&&k>.62){k=Math.round((k-.04)*100)/100;el.style.setProperty('--k',k)}return}
  const orig=[...el.childNodes];let kmin=1.3;
  for(let i=0;i<n;i++){
    el.replaceChildren(...gen(i));let k=kmin;el.style.setProperty('--k',k);
    while(sobra(el)&&k>.62){k=Math.round((k-.04)*100)/100;el.style.setProperty('--k',k)}
    kmin=Math.min(kmin,k);
  }
  el.replaceChildren(...orig);el.style.setProperty('--k',kmin);_K[clave]={w:W,h:H,k:kmin};
}
/* Texto de un bloque: subtítulo, párrafos (o lista si empiezan con «- »), idea central y fuente */
function cuerpoB(b,ult){
  const out=[];let lista=null;
  if(b.subtitulo)out.push(h('p',{class:'sub'},b.subtitulo));
  pars(b.texto).forEach(t=>{
    const m=/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/.exec(t);
    if(m){if(!lista){lista=h('ul',{class:'pts'});out.push(lista)}lista.append(h('li',{},h('i',{'aria-hidden':'true'},String(lista.children.length+1)),h('span',{},m[1])))}
    else{lista=null;out.push(h('p',{class:'txt'},t))}
  });
  if(b.idea)out.push(h('div',{class:'idea'},h('b',{},'Idea central'),h('span',{},b.idea)));
  if(b.fuente)out.push(h('span',{class:'fu'},b.fuente));
  if(ult&&CFG.fuentes)out.push(h('span',{class:'fu'},'Fuentes: '+CFG.fuentes));
  out.forEach((e,j)=>e.style.setProperty('--j',j));
  return out;
}
/* Pista inicial: aparece unos segundos y se apaga sola o al primer toque */
function pistaInicial(txt){
  const p=h('div',{class:'pistaf',role:'note'},ico('mano'),h('span',{},txt));$('.app').append(p);
  const q=()=>{p.classList.add('x');setTimeout(()=>p.remove(),500)};
  setTimeout(q,7000);addEventListener('pointerdown',q,{once:true});addEventListener('keydown',q,{once:true});
}
/* La actividad opcional vive en la barra superior: el botón se habilita al visitar todo el contenido */
function montaActividad(A){
  const host=h('div',{style:'display:none'});document.body.append(host);
  try{actividadUI(host,A)}catch(e){}
  const go=host.querySelector('.lanz .btn');
  if(go)return {abrir:()=>go.click()};
  if(!host.children.length){host.remove();return null}
  host.style.display='';
  return {abrir:()=>modal('Actividad',host)};
}
const ACT=CFG.actividad?montaActividad(CFG.actividad):null;
let _avisoAct=false;
function barra(ayuda){
  const ba=$('#bAct');
  if(ba){
    if(!ACT)ba.remove();
    else{ba.textContent='Ir a la actividad →';ba.onclick=()=>{if(ba.getAttribute('aria-disabled')==='true'){toast('Visita todo el contenido para habilitar la actividad.');return}ACT.abrir()}}
  }
  const by=$('#bAy');
  if(by)by.onclick=()=>modal('Cómo usar este recurso',h('div',{class:'ay'},ayuda.map(t=>h('p',{},t))));
}
function estado(vistos,N,cur){
  const pr=$('#prog');
  if(pr){
    pr.setAttribute('role','progressbar');pr.setAttribute('aria-label','Avance del recurso');pr.setAttribute('aria-valuemin','0');pr.setAttribute('aria-valuemax',String(N));pr.setAttribute('aria-valuenow',String(vistos.size));
    pr.replaceChildren(h('span',{class:'dots','aria-hidden':'true'},Array.from({length:N},(_,i)=>h('i',{class:(vistos.has(i)?'on ':'')+(i===cur?'ac':'')}))),h('span',{class:'pt'},vistos.size+' de '+N));
  }
  const ok=N>0&&vistos.size>=N;
  const ba=$('#bAct');
  if(ba&&ACT){
    const hab=FREE||ok;
    ba.setAttribute('aria-disabled',hab?'false':'true');ba.classList.toggle('off',!hab);
    ba.title=hab?'':'Se habilita al visitar todo el contenido';
    if(hab&&!_avisoAct&&!FREE){_avisoAct=true;toast('Actividad habilitada: ya puedes abrirla.')}
  }
  if(ok)ovaCompleto();
}

const B=(CFG.bloques||[]).filter(b=>b.titulo||b.texto);
const N=B.length;
document.title=CFG.titulo;
$('#tit').textContent=CFG.titulo;
if(CFG.kicker)$('#kk').textContent=CFG.kicker;else $('#kk').remove();
barra([
  'Cada hexágono es un bloque de la infografía. Pulsa uno para leer su contenido en una ventana.',
  LOCK?'Avanza en orden: la marca de color indica el siguiente hexágono por abrir.':'Puedes abrir los hexágonos en el orden que prefieras.',
  'Los hexágonos con una marca ya fueron leídos. Dentro de la lectura puedes pasar al bloque anterior o al siguiente.'
].concat(CFG.actividad?['Cuando hayas abierto todos los hexágonos se habilita el botón «Ir a la actividad».']:[]));
const vistos=new Set(FREE?B.map((_,i)=>i):[]);let cur=-1;
const canOpen=i=>!LOCK||i===0||vistos.has(i)||vistos.has(i-1);
const sugerido=()=>{for(let i=0;i<N;i++)if(!vistos.has(i)&&canOpen(i))return i;return -1};
// ---- Introducción (contenido primero) ----
(function(){
  const it=$('#intro');
  const de=CFG.descripcion||'';
  if(de)it.append(h('p',{class:'de'},de));
  if((CFG.info||{}).resultado)it.append(h('div',{class:'rl'},h('b',{},'Resultado de aprendizaje'),h('span',{},CFG.info.resultado)));
  if(CFG.dato)it.append(h('div',{class:'dt'},h('b',{},'Dato importante'),h('span',{},CFG.dato)));
  const p=h('p',{class:'pista'});p.append(ico('mano'),h('span',{},CFG.instruccion||'Pulsa un hexágono para abrir su contenido.'));it.append(p);
})();
// ---- Geometría de panal (punta plana): vecinos a 0,75·W en horizontal y H/2 en vertical ----
const W=168,H=Math.round(W*.866),GAP=6;
const DIR=[[0,-1],[1,-.5],[1,.5],[0,1],[-1,.5],[-1,-.5]];
function sitios(n,estrecho){
  const s=[];
  if(estrecho){for(let i=0;i<n;i++){const col=i%2,fila=Math.floor(i/2);s.push([col*.75*W,fila*H+(col?H/2:0)])}return {pos:s,cx:null}}
  const pick=n>=6?[0,1,2,3,4,5]:({1:[0],2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4]})[n];
  pick.forEach(k=>s.push([DIR[k][0]*.75*W,DIR[k][1]*H]));
  if(n>6){
    const r2=[];
    for(let c=-2;c<=2;c++)for(let r=-4;r<=4;r+=1){
      const x=c*.75*W,y=(r/2)*H;
      if(Math.abs(c)%2!==Math.abs(r)%2)continue;
      const d=Math.max(Math.abs(c),Math.abs(r/2)+Math.abs(c)/2);
      if(Math.abs(Math.round(d*100)/100-2)>.01)continue;
      r2.push([x,y,(Math.atan2(x,-y)+2*Math.PI)%(2*Math.PI)]);
    }
    r2.sort((a,b)=>a[2]-b[2]);
    r2.slice(0,n-6).forEach(p=>s.push([p[0],p[1]]));
  }
  return {pos:s,cx:[0,0]};
}
function pinta(foco){
  const st=$('#stage');st.replaceChildren();
  const hive=$('#hive');const estrecho=movil();
  const {pos,cx}=sitios(N,estrecho);
  const all=cx?[cx,...pos]:pos;
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  const minx=Math.min(...xs)-(estrecho?0:W/2),maxx=Math.max(...xs)+(estrecho?W:W/2),miny=Math.min(...ys)-(estrecho?0:H/2),maxy=Math.max(...ys)+(estrecho?H:H/2);
  const ox=estrecho?0:-minx,oy=estrecho?0:-miny;
  const SW=estrecho?maxx:maxx-minx,SH=estrecho?maxy:maxy-miny;
  st.style.width=SW+'px';st.style.height=SH+'px';st._dim=[SW,SH];
  if(cx)st.append(h('div',{class:'hxc',style:'left:'+(cx[0]+ox-W/2+GAP/2)+'px;top:'+(cx[1]+oy-H/2+GAP/2)+'px;width:'+(W-GAP)+'px;height:'+(H-GAP)+'px'},h('div',{},CFG.centro||CFG.titulo)));
  const sg=sugerido();
  B.forEach((b,i)=>{
    const [x,y]=pos[i];const left=estrecho?x:x+ox-W/2,top=estrecho?y:y+oy-H/2;
    const lk=!canOpen(i);
    const bot=h('button',{type:'button',class:'hx t'+(i%5)+(lk?' lk':''),'aria-label':(i+1)+'. '+(b.titulo||('Bloque '+(i+1)))+(vistos.has(i)?' (leído)':'')+(lk?' (bloqueado)':''),'aria-disabled':lk?'true':null,onclick:()=>abre(i)},
      b.img?h('img',{src:b.img,alt:''}):h('span',{class:'nu','aria-hidden':'true'},String(i+1).padStart(2,'0')),
      h('span',{class:'ti'},b.titulo||('Bloque '+(i+1))),
      vistos.has(i)?(()=>{const c=okm();c.classList.add('ck');return c})():null,
      i===sg&&!vistos.has(i)&&LOCK?h('i',{class:'lima lm','aria-label':'Siguiente'}):null);
    st.append(h('div',{class:'hxw',style:'left:'+(left+GAP/2)+'px;top:'+(top+GAP/2)+'px;width:'+(W-GAP)+'px;height:'+(H-GAP)+'px'},bot));
  });
  encaja();
  estado(vistos,N,cur);
  if(foco>=0){const t=document.querySelectorAll('.hx')[foco];if(t)t.focus({preventScroll:true})}
}
function encaja(){
  const hive=$('#hive'),st=$('#stage');if(!st._dim)return;const [SW,SH]=st._dim;
  if(movil()){
    const k=Math.min(1.1,hive.clientWidth/SW);
    st.style.transform='scale('+k+')';st.style.left=Math.max(0,(hive.clientWidth-SW*k)/2)+'px';st.style.top='0px';hive.style.height=(SH*k+8)+'px';return;
  }
  hive.style.height='';
  const k=Math.min(1.9,hive.clientWidth/SW,hive.clientHeight/SH);
  st.style.transform='scale('+k+')';st.style.left=Math.max(0,(hive.clientWidth-SW*k)/2)+'px';st.style.top=Math.max(0,(hive.clientHeight-SH*k)/2)+'px';
}
// ---- Lectura de un hexágono ----
function abre(i){
  if(!canOpen(i)){toast('Abre primero el hexágono anterior.');return}
  cur=i;vistos.add(i);ovaUbicacion('bloque'+(i+1));
  const b=B[i];const ant=document.activeElement;
  const cu=h('div',{class:'cuerpo'},cuerpoB(b,i===N-1));
  const cierra=()=>{ov.remove();document.removeEventListener('keydown',tecla);pinta(i)};
  const vea=j=>{ov.remove();document.removeEventListener('keydown',tecla);abre(j)};
  const sig=i<N-1&&canOpen(i+1);
  const hoja=h('div',{class:'hoja t'+(i%5)},
    h('div',{class:'cab'},h('span',{class:'num','aria-hidden':'true'},String(i+1).padStart(2,'0')),h('h2',{id:'hxt'},b.titulo||('Bloque '+(i+1))),h('button',{type:'button',class:'cerrar','aria-label':'Cerrar lectura',onclick:cierra},'×')),
    cu,
    h('div',{class:'nv'},
      h('button',{type:'button',class:'btn sec sm',disabled:i===0,onclick:()=>vea(i-1)},'← Anterior'),
      h('span',{class:'pp'},'Bloque '+(i+1)+' de '+N),
      i<N-1?h('button',{type:'button',class:'btn sm',onclick:()=>{if(!canOpen(i+1)){toast('Abre primero el hexágono anterior.');return}vea(i+1)}},'Siguiente →'):h('button',{type:'button',class:'btn sm',onclick:cierra},'Cerrar ✔')));
  const ov=h('div',{class:'ov',role:'dialog','aria-modal':'true','aria-labelledby':'hxt',onclick:e=>{if(e.target===ov)cierra()}},hoja);
  const tecla=e=>{
    if(e.key==='Escape'){cierra();return}
    if(e.key==='Tab'){const f=[...hoja.querySelectorAll('button:not(:disabled)')];if(!f.length)return;const a=f.indexOf(document.activeElement);if(e.shiftKey&&a<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&a===f.length-1){e.preventDefault();f[0].focus()}}
  };
  document.addEventListener('keydown',tecla);
  document.body.append(ov);
  hoja.querySelector('.cerrar').focus();
  kUniforme('h',cu,j=>cuerpoB(B[j],j===N-1),N);
  estado(vistos,N,cur);
}
if(!N){$('#main').replaceWith(h('p',{class:'txt',style:'padding:1rem'},'Esta infografía todavía no tiene bloques. Agrégalos en el editor.'))}
else{pinta(-1);pistaInicial(CFG.instruccion||'Pulsa un hexágono para abrir su contenido.');
  let ancho=innerWidth;new ResizeObserver(()=>{encaja();ajusta($('#intro'))}).observe($('#hive'));
  addEventListener('resize',()=>{if(Math.abs(innerWidth-ancho)>2){ancho=innerWidth;pinta(-1)}});
  ajusta($('#intro'))}
</script>
