<!--
  PLANTILLA · crucigrama-2
  CAMPOS DEL JSON (sacados del contenido de ejemplo; los límites de palabras de cada formación están en la guía de plantillas):
    id  texto
    tipo  texto
    codigo  texto
    clase  texto
    unidadNum  número
    tag  texto
    titulo  texto
    tituloCrucigrama  texto
    chips  lista (0 elementos en el ejemplo)
    pie  texto
    info  objeto
    actividad  vacío
    nota  texto
    palabras  lista (6 elementos en el ejemplo)
      .palabra  texto
      .pista  texto
    variante  texto
  FORMACIÓN: el JSON puede traer "nivel" (tecnologia, profesional, especializacion o doctorado) o la dirección ?nivel=; sin nivel se usa Tecnológico.
  TEXTOS: los títulos de interfaz son fijos y genéricos en el HTML; claves de "textos" ajustables: ninguna.
-->
<!--
  CRUCIGRAMA · DISEÑO 2 «Campo y papel»
  Cuadrícula protagonista sobre un campo de color plano (var(--nav)); las pistas viven en un panel de papel con pestañas
  Horizontales / Verticales. Un solo archivo, sin recursos externos. Los colores salen de las variables del tema.
-->
<style>/*CSS*/</style>
<style>
:root{--ink2:var(--nav);--mute:var(--muted);--okc:var(--brand)}
*{box-sizing:border-box}
html,body{margin:0}
body{padding:0;background:var(--nav);color:#fff;font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.panel :focus-visible,.dlg :focus-visible{outline-color:var(--nav)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- Estructura (móvil: flujo continuo; escritorio: campo + panel a pantalla completa) ---------- */
.app{display:flex;flex-direction:column;min-height:100vh}
.campo,.panel{display:contents}
.cab{order:1;padding:22px 16px 10px}
.activa{order:2}
.gridbox{order:3}
.prog{order:4}
.acc{order:5}
.tabs{order:6}
.lista{order:7}
.ayuda{order:8}

/* Cabecera editorial */
.cab .tag{display:none}
.cab h1{margin:0 0 .3rem;font-size:clamp(1.65rem,7vw,2.5rem);line-height:1.04;font-weight:800;letter-spacing:-.025em;color:#fff;text-wrap:balance}
.cab .meta{display:none}
.cab .logo{display:block;max-height:34px;margin-bottom:10px}
.cab .sub{font-size:1rem;font-weight:600;color:rgba(255,255,255,.84)}

/* Pista activa: bloque de color plano */
.activa{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center;background:var(--brand);color:var(--on-brand,#fff);padding:12px 16px;border-bottom:4px solid var(--nav);transition:background-color .25s var(--ease)}
.activa .num{grid-row:1/3;font-size:clamp(2.2rem,9vw,3rem);font-weight:800;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.activa .k{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.activa .t{font-size:1.02rem;font-weight:700;line-height:1.25;min-height:1.25em}
.activa.fin{background:var(--mid)}
.activa .num svg{width:1em;height:1em;display:block}
.activa .t,.activa .k{animation:in .22s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* Cuadrícula */
.gridbox{display:flex;justify-content:center;align-items:center;overflow-x:auto;padding:16px 12px 10px}
.cw-grid{display:grid;gap:3px;flex:none}
.cel{position:relative;border-radius:4px}
.cel.v{visibility:hidden}
.cel.l{background:#fff;transition:background-color .15s var(--ease),box-shadow .15s var(--ease)}
.cel.sel{background:var(--cyan)}
.cel.sel input,.cel.sel .n{color:var(--cyan-ink)}
.cel input{display:block;width:100%;height:100%;border:0;padding:2px 0 0;margin:0;background:transparent;text-align:center;font-family:var(--font);font-weight:800;font-size:max(16px,calc(var(--cs,32px)*.54));line-height:1;color:var(--nav);text-transform:uppercase;caret-color:transparent;border-radius:4px;cursor:pointer;outline:0}
.cel input::selection{background:transparent}
.cel .n{position:absolute;top:2px;left:3px;font-size:max(9px,calc(var(--cs,32px)*.27));font-weight:800;line-height:1;color:var(--nav);pointer-events:none}
.cel.act{background:var(--mid);box-shadow:0 0 0 3px #fff;z-index:1}
.cel.act:before{content:"";position:absolute;left:50%;bottom:3px;width:max(8px,calc(var(--cs,32px)*.3));height:3px;margin-left:calc(max(8px,calc(var(--cs,32px)*.3))/-2);border-radius:2px;background:var(--lime)}
.cel.act input,.cel.act .n{color:#fff}
.cel.ok:after{content:"";position:absolute;right:0;bottom:0;border:5px solid transparent;border-right-color:var(--okc);border-bottom-color:var(--okc);border-radius:0 0 4px 0}
.cel.act.ok:after{border-right-color:#fff;border-bottom-color:#fff}
.cel.mal{background-image:repeating-linear-gradient(45deg,rgba(20,39,73,.28) 0 4px,transparent 4px 8px)}
.cel.act.mal{background-image:none}
.cel.rev input{font-style:italic}
.cel input:focus-visible{outline:2px solid #fff;outline-offset:-5px}
.cel.sel input:focus-visible{outline-color:var(--cyan-ink)}

/* Progreso */
.prog{display:flex;align-items:center;gap:16px;padding:6px 16px 16px}
.prog .cnt{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.prog b{font-size:2.1rem;font-weight:800;line-height:1;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums}
.prog span{font-size:.82rem;font-weight:600;color:rgba(255,255,255,.82)}
.barra{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}
.barra i{display:block;height:100%;background:var(--cyan);transform-origin:left;transform:scaleX(0);transition:transform .25s var(--ease)}

/* Botones */
.bt{font:inherit;font-weight:800;font-size:.84rem;letter-spacing:.01em;min-height:44px;padding:.35rem 1.1rem;border-radius:999px;border:2px solid var(--nav);background:var(--nav);color:#fff;cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.bt:hover:not(:disabled){background:var(--brand);border-color:var(--brand)}
.bt.sec{background:transparent;color:var(--nav)}
.bt.sec:hover:not(:disabled){background:var(--nav);border-color:var(--nav);color:#fff}
.bt.go{background:var(--brand);border-color:var(--brand)}
.bt.go:hover:not(:disabled){background:var(--nav);border-color:var(--nav)}
.bt:disabled{opacity:.4;cursor:not-allowed}
.bt:active{transform:scale(.97)}
.bt .i{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.2em;margin-right:.4em}
.bt .i svg{width:100%;height:100%;display:block}
.acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px 6px;background:#fff;color:var(--ink2)}
.acc .msg{flex:1 0 100%;min-height:1.4em;font-size:.84rem;font-weight:700;color:var(--ink2)}
.acc .msg.ok{color:var(--okc)}
.acc .link{font:inherit;font-size:.78rem;font-weight:700;background:none;border:0;color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 6px;min-height:44px;margin-left:auto}
.acc .link:hover{color:var(--nav)}

/* Pestañas y lista de pistas (papel) */
.tabs{display:flex;background:#fff;padding:6px 16px 0;border-bottom:2px solid var(--line)}
.tab{font:inherit;font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;color:var(--mute);padding:12px 4px 10px;margin-right:22px;min-height:44px;cursor:pointer;transition:color .15s var(--ease),border-color .15s var(--ease)}
.tab:hover{color:var(--nav)}
.tab[aria-selected=true]{color:var(--nav);border-bottom-color:var(--nav)}
.tab .c{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--tint);color:var(--nav);font-size:.7rem;letter-spacing:0}
.lista{position:relative;background:#fff;color:var(--ink2)}
.it{display:grid;grid-template-columns:2.4rem minmax(0,1fr) 1.4rem;gap:6px 12px;align-items:start;width:100%;text-align:left;font:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 16px;min-height:56px;cursor:pointer;color:var(--ink2);transition:background-color .15s var(--ease)}
.it:hover{background:var(--tint2)}
.it[aria-current=true]{background:var(--tint);box-shadow:inset 6px 0 0 var(--nav)}
.it .nn{font-size:1.15rem;font-weight:800;color:var(--nav);line-height:1.2;font-variant-numeric:tabular-nums}
.it .q{display:block;font-size:.92rem;font-weight:600;line-height:1.35}
.it .ln{display:block;margin-top:2px;font-size:.72rem;font-weight:700;color:var(--mute);letter-spacing:.04em}
.it .st{width:1.4rem;height:1.4rem;border-radius:50%;margin-top:1px;border:2px solid var(--line2);position:relative}
.it.llena .st{border-color:var(--brand);background:var(--tint)}
.it.hecha .st{border-color:var(--okc);background:var(--okc)}
.it.hecha .st:after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.ayuda{background:#fff;color:var(--mute);padding:14px 16px 26px;font-size:.78rem;line-height:1.5}
.ayuda p+p{margin-top:6px}
.ayuda kbd{font:inherit;font-weight:800;color:var(--nav)}
#foot{font-weight:700}
.vacio{padding:36px 22px;background:#fff;color:var(--ink2);border-radius:18px;margin:16px;font-weight:600}

/* Diálogo */
.dlg{border:0;padding:26px 26px 22px;border-radius:24px;width:min(440px,92vw);background:#fff;color:var(--ink2);box-shadow:0 30px 80px rgba(20,39,73,.4)}
.dlg[open]{animation:dlgIn .22s var(--ease)}
.dlg::backdrop{background:rgba(20,39,73,.66)}
.dlg h3{font-size:1.35rem;font-weight:800;color:var(--nav);letter-spacing:-.02em}
.dlg p{margin-top:8px;font-size:.95rem}
.dlg-b{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
@keyframes dlgIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* Escritorio: campo plano a la izquierda, papel a la derecha */
@media (min-width:900px) and (min-height:520px){
  body{height:100vh;height:100dvh;overflow:hidden}
  .app{height:100vh;height:100dvh;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,36vw,440px)}
  .campo{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0;padding:30px 36px 26px}
  .cab,.prog,.gridbox{padding-left:0;padding-right:0}
  .cab{padding-top:0;padding-bottom:6px}
  .cab h1{font-size:clamp(1.8rem,3.1vw,2.7rem)}
  .gridbox{display:grid;place-items:center;min-height:0;overflow:hidden;padding-top:10px;padding-bottom:10px}
  .prog{padding-bottom:0;padding-top:4px}
  .panel{display:flex;flex-direction:column;min-height:0;background:#fff;color:var(--ink2)}
  .activa{position:static;border-bottom:0;padding:22px 26px;flex:none}
  .acc{order:unset}
  .panel>.activa{order:1}.panel>.tabs{order:2}.panel>.lista{order:3}.panel>.acc{order:4}.panel>.ayuda{order:5}
  .tabs{padding:6px 26px 0;flex:none}
  .lista{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
  .it{padding:13px 26px}
  .acc{flex:none;padding:14px 26px 4px;border-top:2px solid var(--line)}
  .ayuda{flex:none;padding:6px 26px 18px}
  .ayuda .largo{display:none}
  .acc .msg{min-height:2.9em}
}
@media (min-width:900px) and (min-height:520px) and (max-height:780px){.ayuda p{display:none}}
@media (max-width:899px){.activa{padding:12px 16px}}
</style>

<script>var cwFin=function(){window.__cw=true;try{ovaCompleto()}catch(e){}if(window.__cwGate)window.__cwGate.abrir()};</script>
<script>
/* ===== Actividad opcional integrada: se abre desde la barra de acciones (no se agrega debajo de la página) y se habilita al completar ===== */
const ACT=(function(){
  const A=CFG.actividad,btns=[];
  if(!A)return {tiene:false,btn:()=>document.createDocumentFragment(),abrir(){}};
  const host=h('div',{hidden:true});document.body.append(host);
  actividadUI(host,A);
  let vista=null;
  const abrir=()=>{
    const l=host.querySelector('.lanz .btn');
    if(l){l.click();return}
    const card=host.firstElementChild;if(!card)return;
    if(!vista)vista=vistaActividad(A.nombre||'Actividad',ACT_ROT[A.tipo]||'Actividad','Realice la actividad y descargue su evidencia.',card,()=>{});
    vista.abre();const r=document.querySelector('.vact .pieact .btn:not(.sec)');if(r)r.remove();
  };
  const pon=b=>{const ok=!LOCK||!!window.__cw;b.disabled=!ok;b.title=ok?'':'Complete el crucigrama para habilitar la actividad'};
  window.__cwGate={abrir(){btns.forEach(pon)}};
  return {tiene:true,abrir,btn(cls,txt){const b=h('button',{type:'button',class:cls,onclick:abrir},txt||'Ir a la actividad →');btns.push(b);pon(b);return b}};
})();
</script>
<script>
hero2();
/* ===== Núcleo del crucigrama: mismo algoritmo de colocación y numeración que la plantilla clásica ===== */
const P=(CFG.palabras||[]).map(p=>({raw:String(p.palabra||'').trim(),w:norm(String(p.palabra||'')).replace(/[^a-z0-9]/g,'').toUpperCase(),clue:p.pista||''})).filter(p=>p.w.length>1);
const K=(r,c)=>r+','+c;
const NS='http://www.w3.org/2000/svg';
const ico=(d,sw)=>{const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width',sw||2.4);s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');s.innerHTML='<path d="'+d+'"/>';return s};
const IC={ok:'M5 12.5l4.5 4.5L19 7.5',izq:'M15 5l-7 7 7 7',der:'M9 5l7 7-7 7',rei:'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5',ojo:'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',cmp:'M4 12.5l5 5L20 6.5'};

function armar(P){
  const placed=[];const cells=new Map();
  const fits=(w,r,c,dir)=>{
    const dr=dir==='v'?1:0,dc=dir==='h'?1:0;let cross=0;
    if(cells.has(K(r-dr,c-dc))||cells.has(K(r+dr*w.length,c+dc*w.length)))return -1;
    for(let i=0;i<w.length;i++){
      const rr=r+dr*i,cc=c+dc*i,ex=cells.get(K(rr,cc));
      if(ex){if(ex!==w[i])return -1;cross++}
      else{if(cells.has(K(rr+dc,cc+dr))||cells.has(K(rr-dc,cc-dr)))return -1}
    }
    return cross;
  };
  const put=(p,r,c,dir)=>{const dr=dir==='v'?1:0,dc=dir==='h'?1:0;for(let i=0;i<p.w.length;i++)cells.set(K(r+dr*i,c+dc*i),p.w[i]);placed.push({...p,r,c,dir})};
  const orden=P.slice().sort((a,b)=>b.w.length-a.w.length);
  const sueltas=[];
  orden.forEach(p=>{
    if(!placed.length){put(p,0,0,'h');return}
    let best=null;
    placed.forEach(q=>{
      for(let i=0;i<q.w.length;i++)for(let j=0;j<p.w.length;j++){
        if(q.w[i]!==p.w[j])continue;
        const dir=q.dir==='h'?'v':'h';
        const r=q.dir==='h'?q.r-j:q.r+i,c=q.dir==='h'?q.c+i:q.c-j;
        const s=fits(p.w,r,c,dir);
        if(s>0&&(!best||s>best.s))best={s,r,c,dir};
      }
    });
    if(best)put(p,best.r,best.c,best.dir);else sueltas.push(p);
  });
  sueltas.forEach(p=>{ /* sin cruce posible: debajo del resto, sin romper nada */
    let maxr=0;cells.forEach((v,k)=>{maxr=Math.max(maxr,+k.split(',')[0])});
    put(p,placed.length?maxr+2:0,0,'h');
  });
  let r0=1e9,c0=1e9,r1=-1e9,c1=-1e9;cells.forEach((v,k)=>{const[r,c]=k.split(',').map(Number);r0=Math.min(r0,r);c0=Math.min(c0,c);r1=Math.max(r1,r);c1=Math.max(c1,c)});
  placed.forEach(p=>{p.r-=r0;p.c-=c0});
  const R=r1-r0+1,C=c1-c0+1;
  const starts=[];placed.slice().sort((a,b)=>a.r-b.r||a.c-b.c).forEach(p=>{let s=starts.find(x=>x.r===p.r&&x.c===p.c);if(!s){s={r:p.r,c:p.c,n:starts.length+1};starts.push(s)}p.n=s.n});
  const letra=new Map();placed.forEach(p=>{for(let i=0;i<p.w.length;i++){letra.set(K(p.r+(p.dir==='v'?i:0),p.c+(p.dir==='h'?i:0)),p.w[i])}});
  return {placed,R,C,letra,starts};
}

/* Confirmación en <dialog> nativo (foco atrapado, Esc cierra) */
function confirmar(titulo,texto,okTxt,fn){
  const prev=document.activeElement;
  const d=h('dialog',{class:'dlg','aria-labelledby':'dlg-t'});
  d.append(h('h3',{id:'dlg-t'},titulo),h('p',{},texto),h('div',{class:'dlg-b'},
    h('button',{class:'bt sec',type:'button',onclick:()=>d.close()},'Cancelar'),
    h('button',{class:'bt',type:'button',onclick:()=>{d.close();fn()}},okTxt)));
  d.addEventListener('close',()=>{d.remove();if(prev&&prev.focus)prev.focus()});
  d.addEventListener('click',e=>{if(e.target===d)d.close()});
  document.body.append(d);d.showModal();
}

function motor(G,H){
  const {placed,R,C,letra,starts}=G;
  H=H||{};
  const orden=[...placed.filter(p=>p.dir==='h').sort((a,b)=>a.n-b.n),...placed.filter(p=>p.dir==='v').sort((a,b)=>a.n-b.n)];
  const el=new Map();
  const grid=h('div',{class:'cw-grid',role:'group','aria-label':'Cuadrícula del crucigrama',style:'grid-template-columns:repeat('+C+',var(--cs,32px));grid-auto-rows:var(--cs,32px)'});
  const live=h('div',{class:'vh',role:'status','aria-live':'polite'});
  const sig=placed.map(p=>p.dir+p.r+p.c+p.w).join('|');
  let cur=null,curK=null,hecho=false,solMostrada=false,sobre=false;
  const cubre=(p,r,c)=>p.dir==='h'?(p.r===r&&c>=p.c&&c<p.c+p.w.length):(p.c===c&&r>=p.r&&r<p.r+p.w.length);
  const kDe=(p,i)=>K(p.r+(p.dir==='v'?i:0),p.c+(p.dir==='h'?i:0));
  const celdasDe=p=>Array.from({length:p.w.length},(_,i)=>el.get(kDe(p,i)));
  const idxEn=(p,k)=>{const x=el.get(k);return p.dir==='h'?x.c-p.c:x.r-p.r};
  const primeraVacia=p=>{const i=celdasDe(p).findIndex(x=>!x.inp.value);return i<0?null:kDe(p,i)};
  const norma=s=>norm(s).replace(/[^a-z0-9]/g,'').toUpperCase();

  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const k=K(r,c);
    if(!letra.has(k)){grid.append(h('div',{class:'cel v','aria-hidden':'true'}));continue}
    const cel=h('div',{class:'cel l'});
    const inp=h('input',{'aria-label':'Fila '+(r+1)+', columna '+(c+1),autocomplete:'off',autocapitalize:'characters',autocorrect:'off',spellcheck:'false',inputmode:'text',tabindex:'-1'});
    const x={cel,inp,r,c,ch:letra.get(k),ws:placed.filter(p=>cubre(p,r,c))};
    el.set(k,x);
    cel.append(inp);
    const s=starts.find(z=>z.r===r&&z.c===c);if(s)cel.append(h('span',{class:'n','aria-hidden':'true'},s.n));
    inp.addEventListener('focus',()=>{
      try{inp.select()}catch(e){}
      const p=(cur&&x.ws.includes(cur))?cur:(x.ws.find(w=>cur&&w.dir===cur.dir)||x.ws[0]);
      if(p!==cur||curK!==k)select(p,k,false);
    });
    inp.addEventListener('pointerdown',()=>{sobre=(curK===k&&document.activeElement===inp)});
    inp.addEventListener('click',()=>{if(sobre&&x.ws.length>1){sobre=false;alterna()}});
    inp.addEventListener('keydown',e=>teclas(e,k));
    inp.addEventListener('input',e=>{
      const multi=e.inputType==='insertFromPaste'||(e.data&&norma(e.data).length>1);
      if(multi&&cur){ /* pegado o texto de varias letras: se reparte por la palabra */
        const txt=norma(e.data||inp.value);inp.value=x.prev||'';
        const i0=idxEn(cur,k);let last=k;
        for(let j=0;j<txt.length&&i0+j<cur.w.length;j++){last=kDe(cur,i0+j);el.get(last).inp.value=txt[j];tras(last)}
        const i=idxEn(cur,last);select(cur,i<cur.w.length-1?kDe(cur,i+1):last,true);return;
      }
      const v=norma(inp.value).slice(-1);inp.value=v;if(v){tras(k);avanza()}else tras(k)
    });
    inp.addEventListener('beforeinput',()=>{x.prev=norma(inp.value).slice(-1)});
    grid.append(cel);
  }

  function select(p,k,foco){
    if(!p)return;
    const prev=cur;
    if(curK&&el.get(curK)){const o=el.get(curK);o.cel.classList.remove('act');o.inp.tabIndex=-1}
    cur=p;curK=k||primeraVacia(p)||K(p.r,p.c);
    el.forEach(x=>x.cel.classList.remove('sel'));
    celdasDe(p).forEach(x=>x.cel.classList.add('sel'));
    const xa=el.get(curK);xa.cel.classList.add('act');xa.inp.tabIndex=0;
    if(p!==prev){
      live.textContent=p.n+' '+(p.dir==='h'?'horizontal':'vertical')+', '+p.w.length+' letras: '+(p.clue||'sin pista');
      H.onSelect&&H.onSelect(p,curK);
    }
    if(foco)xa.inp.focus();
  }
  function alterna(){
    if(!cur)return;const x=el.get(curK);const o=x.ws.find(w=>w!==cur);
    if(o)select(o,curK,true);
  }
  function avanza(){
    if(!cur)return;const i=idxEn(cur,curK);
    if(i<cur.w.length-1)select(cur,kDe(cur,i+1),true);
  }
  function vecino(k,dr,dc){
    const x=el.get(k);let r=x.r+dr,c=x.c+dc;
    while(r>=0&&r<R&&c>=0&&c<C){const kk=K(r,c);if(el.has(kk))return kk;r+=dr;c+=dc}
    return null;
  }
  function paso(d){
    const i=orden.indexOf(cur);const n=orden[(i+d+orden.length)%orden.length];
    select(n,null,true);
  }
  function tras(k){
    const x=el.get(k);
    x.cel.classList.remove('ok','mal','rev');
    x.ws.forEach(w=>{w.ok=false});
    guardar();progreso();
  }
  function escribe(k,ch){const x=el.get(k);x.inp.value=ch;tras(k);avanza()}
  function teclas(e,k){
    if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
    const x=el.get(k),key=e.key;
    const dirs={ArrowLeft:[0,-1,'h'],ArrowRight:[0,1,'h'],ArrowUp:[-1,0,'v'],ArrowDown:[1,0,'v']};
    if(dirs[key]){
      e.preventDefault();const [dr,dc,pref]=dirs[key];const nk=vecino(k,dr,dc);
      if(nk){const nx=el.get(nk);select(nx.ws.find(w=>w.dir===pref)||(nx.ws.includes(cur)?cur:nx.ws[0]),nk,true)}
      return;
    }
    if(key===' '||key==='Spacebar'){e.preventDefault();alterna();return}
    if(key==='Enter'){e.preventDefault();paso(e.shiftKey?-1:1);return}
    if(key==='Tab'){
      const i=orden.indexOf(cur);
      if((e.shiftKey&&i<=0)||(!e.shiftKey&&i>=orden.length-1))return; /* deja salir de la cuadrícula */
      e.preventDefault();paso(e.shiftKey?-1:1);return;
    }
    if(key==='Backspace'){
      e.preventDefault();
      if(x.inp.value){x.inp.value='';tras(k)}
      else if(cur){const i=idxEn(cur,k);if(i>0){const pk=kDe(cur,i-1);select(cur,pk,true);if(el.get(pk).inp.value){el.get(pk).inp.value='';tras(pk)}}}
      return;
    }
    if(key==='Delete'){e.preventDefault();if(x.inp.value){x.inp.value='';tras(k)}return}
    if(key==='Home'&&cur){e.preventDefault();select(cur,kDe(cur,0),true);return}
    if(key==='End'&&cur){e.preventDefault();select(cur,kDe(cur,cur.w.length-1),true);return}
    if(key.length===1){
      const ch=norma(key);e.preventDefault();
      if(ch)escribe(k,ch.slice(-1));
    }
  }

  function progreso(sil){
    let llenas=0,ok=0;
    el.forEach(x=>{const v=x.inp.value;if(v){llenas++;if(v===x.ch)ok++}});
    const total=el.size;
    H.onProgress&&H.onProgress({llenas,ok,total});
    if(total>0&&ok===total){if(!hecho){hecho=true;H.onDone&&H.onDone({silencioso:!!sil,solucion:solMostrada})}}
    else hecho=false;
  }
  function guardar(){const v={};el.forEach((x,k)=>{if(x.inp.value)v[k]=x.inp.value});store('cw',{sig,v})}
  function restaurar(){
    const s=store('cw');if(!s||s.sig!==sig||!s.v)return false;
    for(const k in s.v)if(el.has(k))el.get(k).inp.value=String(s.v[k]).slice(0,1);
    return true;
  }
  function comprobar(){
    let bien=0,vacias=0,mal=0;
    placed.forEach(p=>{p.ok=celdasDe(p).every((x,i)=>x.inp.value===p.w[i]);if(p.ok)bien++});
    el.forEach(x=>{const v=x.inp.value;x.cel.classList.toggle('ok',!!v&&v===x.ch);x.cel.classList.toggle('mal',!!v&&v!==x.ch);if(!v)vacias++;else if(v!==x.ch)mal++});
    const res={bien,total:placed.length,vacias,mal};
    H.onProgress&&progreso();
    H.onCheck&&H.onCheck(res);
    return res;
  }
  function revela(p){
    celdasDe(p).forEach((x,i)=>{x.inp.value=p.w[i];x.cel.classList.remove('mal');x.cel.classList.add('ok','rev')});
    p.ok=true;
  }
  function revelar(p){p=p||cur;if(!p)return;revela(p);guardar();progreso();H.onReveal&&H.onReveal(p)}
  function mostrarSolucion(){solMostrada=true;placed.forEach(revela);guardar();progreso();H.onSolucion&&H.onSolucion()}
  function reiniciar(){
    el.forEach(x=>{x.inp.value='';x.cel.classList.remove('ok','mal','rev')});
    placed.forEach(p=>{p.ok=false});
    solMostrada=false;hecho=false;guardar();progreso();
    H.onReset&&H.onReset();
    if(orden.length)select(orden[0],null,false);
  }
  const GAP=3;
  function fit(box,fijo){
    const cs0=getComputedStyle(box);
    const W=box.clientWidth-parseFloat(cs0.paddingLeft)-parseFloat(cs0.paddingRight);
    const Hh=box.clientHeight-parseFloat(cs0.paddingTop)-parseFloat(cs0.paddingBottom);
    let cs=(W-(C-1)*GAP)/C;
    if(fijo&&Hh>0)cs=Math.min(cs,(Hh-(R-1)*GAP)/R);
    cs=Math.floor(Math.max(fijo?16:28,Math.min(cs,62)));
    grid.style.setProperty('--cs',cs+'px');
    return cs;
  }
  function iniciar(){
    restaurar();
    if(orden.length)select(orden[0],null,false);
    progreso(true);
  }
  return {grid,live,placed,orden,el,R,C,celdasDe,select,fit,iniciar,comprobar,revelar,mostrarSolucion,reiniciar,paso,
    estado:p=>({llena:celdasDe(p).every(x=>x.inp.value),ok:!!p.ok}),
    actual:()=>cur,enFoco:p=>{select(p,null,true)}};
}

(function(){
  const app=$('#app');
  const sub=CFG.tituloCrucigrama&&CFG.tituloCrucigrama!==CFG.titulo?CFG.tituloCrucigrama:'';
  if(sub)$('#hero').append(h('p',{class:'sub'},sub));
  const ayuda=$('#ayuda');
  ayuda.append(h('p',{},CFG.instruccion||'Seleccione una pista o una casilla y escriba. Toque de nuevo la casilla para cambiar de dirección.'),
    h('p',{class:'largo'},h('kbd',{},'Flechas'),' mueven · ',h('kbd',{},'Espacio'),' cambia de dirección · ',h('kbd',{},'Tab'),' o ',h('kbd',{},'Enter'),' pasan a la siguiente palabra.'),
    CFG.nota?h('p',{},CFG.nota):null);

  if(!P.length){
    $('.campo').replaceChildren($('#hero'),h('div',{class:'vacio'},'Este crucigrama todavía no tiene palabras. Agréguelas en el editor (palabra y pista).'));
    $('.panel').remove();$('.campo').style.display='block';return;
  }

  const G=armar(P);
  const items=new Map();let fin=false,llenasAhora=0;
  const activa=$('#activa'),lista=$('#lista'),tabs=$('#tabs');
  const msgEl=h('p',{class:'msg',role:'status','aria-live':'polite'});
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const txtDir=d=>d==='h'?'Horizontal':'Vertical';
  const msg=(t,tipo)=>{msgEl.textContent=t;msgEl.className='msg'+(tipo?' '+tipo:'')};

  function pintaActiva(){
    const p=M.actual();activa.replaceChildren();
    activa.classList.toggle('fin',fin);
    if(fin){
      const ck=h('span',{class:'num'});ck.append(ico(IC.ok,3));
      activa.append(ck,h('span',{class:'k'},'Completado'),h('span',{class:'t'},'¡Crucigrama completo! Resolvió las '+G.placed.length+' palabras.'));
    }else if(p){
      activa.append(h('span',{class:'num'},String(p.n)),h('span',{class:'k'},txtDir(p.dir)+' · '+p.w.length+' letras'),h('span',{class:'t'},p.clue||'(sin pista)'));
    }
  }
  function verTab(d,foco){
    ['h','v'].forEach(x=>{const t=$('#tab-'+x),l=$('#l-'+x);if(!t)return;const s=x===d;t.setAttribute('aria-selected',s);t.tabIndex=s?0:-1;l.hidden=!s;if(s&&foco)t.focus()});
  }
  function item(p){
    const sr=h('span',{class:'vh'});
    const b=h('button',{type:'button',class:'it',onclick:()=>M.enFoco(p)},
      h('span',{class:'nn'},String(p.n).padStart(2,'0')),
      h('span',{class:'tx'},h('span',{class:'q'},p.clue||'(sin pista)'),h('span',{class:'ln'},p.w.length+' letras'),sr),
      h('span',{class:'st','aria-hidden':'true'}));
    items.set(p,{b,sr});return h('li',{},b);
  }
  [['h','Horizontales'],['v','Verticales']].forEach(([d,tit])=>{
    const g=M0().orden.filter(p=>p.dir===d);if(!g.length)return;
    const t=h('button',{type:'button',role:'tab',id:'tab-'+d,'aria-controls':'l-'+d,'aria-selected':'false',tabindex:'-1',class:'tab',onclick:()=>verTab(d)},tit,h('span',{class:'c','aria-hidden':'true'},String(g.length)));
    t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const o=d==='h'?'v':'h';if($('#tab-'+o)){e.preventDefault();verTab(o,true)}}});
    tabs.append(t);
    lista.append(h('ul',{id:'l-'+d,role:'tabpanel','aria-labelledby':'tab-'+d,hidden:true},g.map(item)));
  });
  function M0(){return {orden:[...G.placed.filter(p=>p.dir==='h').sort((a,b)=>a.n-b.n),...G.placed.filter(p=>p.dir==='v').sort((a,b)=>a.n-b.n)]}}

  const M=motor(G,{
    onSelect(p){
      pintaActiva();verTab(p.dir);try{ovaUbicacion('p'+p.n+p.dir)}catch(e){}
      items.forEach((v,q)=>{v.b.setAttribute('aria-current',q===p?'true':'false')});
      const b=items.get(p).b;
      if(b.offsetParent){
        const top=b.offsetTop,bot=top+b.offsetHeight;
        if(lista.scrollHeight>lista.clientHeight&&(top<lista.scrollTop||bot>lista.scrollTop+lista.clientHeight))lista.scrollTo({top:Math.max(0,top-(lista.clientHeight-b.offsetHeight)/2),behavior:reduce?'auto':'smooth'});
      }
    },
    onProgress(s){
      llenasAhora=s.llenas;
      $('#pn').textContent=s.llenas;$('#pt').textContent='de '+s.total+' letras';
      $('#pb').style.transform='scaleX('+(s.total?s.llenas/s.total:0)+')';
      items.forEach((v,p)=>{const e=M.estado(p);v.b.classList.toggle('llena',e.llena&&!e.ok);v.b.classList.toggle('hecha',e.ok);v.sr.textContent=e.ok?' (correcta)':''});
      if(fin&&s.ok<s.total){fin=false;pintaActiva();msg('')}
    },
    onCheck(r){
      if(r.bien===r.total)return;
      msg('Palabras correctas: '+r.bien+' de '+r.total+'.'+(r.mal?' Revise las casillas rayadas.':'')+(r.vacias?' Faltan '+r.vacias+' casillas.':''));
    },
    onDone(o){
      fin=true;pintaActiva();cwFin();
      if(o.silencioso)return;
      msg(o.solucion?'Solución mostrada. Pulse «Reiniciar» para intentarlo de nuevo.':'¡Crucigrama completo! Todas las palabras son correctas.','ok');
    },
    onReveal(p){msg('Palabra revelada: '+p.w+'.')},
    onReset(){fin=false;pintaActiva();msg('Crucigrama reiniciado.')}
  });

  const bt=(txt,ic,cls,fn)=>{const b=h('button',{type:'button',class:'bt'+(cls?' '+cls:''),onclick:fn});if(ic){const i=h('span',{class:'i','aria-hidden':'true'});i.append(ico(ic,2.4));b.append(i)}b.append(txt);return b};
  $('#acc').append(
    bt('Comprobar',IC.cmp,'',()=>M.comprobar()),
    bt('Revelar palabra',IC.ojo,'sec',()=>M.revelar()),
    bt('Reiniciar',IC.rei,'sec',()=>{if(llenasAhora)confirmar('¿Reiniciar el crucigrama?','Se borrarán todas las letras que escribió.','Reiniciar',()=>M.reiniciar());else M.reiniciar()}),
    ACT.btn('bt go'),
    h('button',{type:'button',class:'link',onclick:()=>confirmar('¿Mostrar la solución?','Se completarán todas las palabras. Podrá reiniciar para volver a intentarlo.','Mostrar solución',()=>M.mostrarSolucion())},'Mostrar solución'),
    msgEl);

  $('#gridbox').append(M.grid,M.live);
  const mq=matchMedia('(min-width:900px) and (min-height:520px)');
  const ajusta=()=>M.fit($('#gridbox'),mq.matches);
  if(window.ResizeObserver)new ResizeObserver(ajusta).observe($('#gridbox'));
  addEventListener('resize',ajusta);ajusta();
  M.iniciar();
  ajusta();
})();
</script>
</body>
